    const boundaryWeekends=[];
    if (weekdays[priorDays]>=5) boundaryWeekends.push(priorDays-weekdays[priorDays]+4);
    if (weekdays[endIndex]===4 || weekdays[endIndex]===5) boundaryWeekends.push(endIndex-weekdays[endIndex]+4);
    const context={days,start,end,horizon,endIndex,monthEnd,nurses,needed,shiftMinutes,shiftIntervals,restIntervals,
      weekdays,boundaryWeekends,rotationStart,pairSlots,
      nightRoleReservesDay:D.nightRoleReservesDay,fullWeekendPairAt:D.fullWeekendPairAt,nightRecoveryRequired:D.nightRecoveryRequired,rollingDutyPeaks:D.rollingDutyPeaks,
      pairTuesdayRestException:D.pairTuesdayRestException,
      firstMonday:priorDays-weekdays[priorDays],lastMonday:endIndex-weekdays[endIndex]};
    setWorkTargets(state,D,context);
    return context;
  }

  // Only rolling windows containing this new shift can get worse. The sum of
  // elapsed working minutes reaches a maximum at an interval endpoint or its
  // translation by 168 hours, including weeks with a clock change.
  function withinWeeklyLimit(ctx, work, i) {
    const [ownStart,ownEnd] = ctx.shiftIntervals[i][work[i]];
    const nearby=[];
    let total=0,daytime=false;
    for (let j=Math.max(0,i-priorDays); j<=Math.min(work.length-1,i+priorDays); j++) {
      const shift=work[j];
      if (!shift) continue;
      const [begin,finish]=ctx.shiftIntervals[j][shift];
      if (begin>=ownEnd+weeklyMinutes || finish<=ownStart-weeklyMinutes) continue;
      nearby.push({begin,finish,shift});
      total+=finish-begin;
      if(shift!=="N") daytime=true;
    }
    if (total<=workLimit || !daytime) return true;
    const peaks=ctx.rollingDutyPeaks(nearby,{scopeStart:ownStart,scopeEnd:ownEnd,
      affected:[{begin:ownStart,finish:ownEnd}],stopOnBlocking:true});
    return !peaks.blocking.length;
  }

  const dayShift = shift => shift === "J" || shift === "T";

  function consecutiveFullWeekends(ctx,work,firstFriday) {
    if (ctx.fullWeekendPairAt(work,firstFriday)) return true;
    // At a month boundary, an assigned night commits its holder to all three
    // dates. A Friday duty followed by either half of the Sat/Sun pair does
    // too. These implied duties never enter the saved neighboring month.
    for (const boundary of ctx.boundaryWeekends) {
      if (boundary!==firstFriday && boundary!==firstFriday+7) continue;
      const other=boundary===firstFriday ? firstFriday+7 : firstFriday;
      if (!work[other] || !work[other+1] || !work[other+2]) continue;
      const fri=work[boundary], sat=work[boundary+1], sun=work[boundary+2];
      if (fri==="N" || sat==="N" || sun==="N" || (fri && (sat || sun))) return true;
    }
    return false;
  }

  function recoveredFromNight(ctx,n,a,b) {
    return n.work[a]!=="N" || ctx.shiftIntervals[b][n.work[b]][0]-ctx.shiftIntervals[a].N[1]>=2880 ||
      !ctx.nightRecoveryRequired(a,b,n.work[b],k=>k<n.phaseHistoryStart?n.oldPhase?.[k]:(n.phases?.[k] ?? n.oldPhase?.[k]));
  }

  function legalDay(ctx, nurse, i) {
    const work=nurse.work;
    const [start,end]=ctx.restIntervals[i][work[i]];
    // A long TIIH can finish after a date without an assignment.
    for (let j=Math.max(0,i-3); j<i; j++)
      if (work[j] && start-ctx.restIntervals[j][work[j]][1]<720) return false;
    for (let j=i+1; j<=Math.min(work.length-1,i+3); j++)
      if (work[j] && ctx.restIntervals[j][work[j]][0]-end<720) return false;
    // A long TIIH may overlap two dates; the night itself always ends next morning.
    for(let a=i-1;a>=Math.max(0,i-3);a--) if(work[a]) {if(!recoveredFromNight(ctx,nurse,a,i)) return false; break;}
    if(work[i]==="N") for(let b=i+1;b<=Math.min(work.length-1,i+3);b++) if(work[b]) {
      if(!recoveredFromNight(ctx,nurse,i,b)) return false;
      break;
    }
    for (let first=Math.max(0,i-4); first<=i; first++) {
      if(!work[first] || !work[first+1] || !work[first+2]) continue;
      if(work[first+3]) return false;
      if(work[first+4]) {
        if(!ctx.pairTuesdayRestException(ctx.pairSlots[first],work.slice(first,first+5),4)) return false;
      }
    }
    const weekday=ctx.weekdays[i];
    if (weekday>=4) {
      const friday=i-weekday+4;
      if (consecutiveFullWeekends(ctx,work,friday-7) || consecutiveFullWeekends(ctx,work,friday))
        return false;
    }
    if ((weekday===0 && dayShift(work[i]) && work[i-1]) ||
        (weekday===6 && dayShift(work[i+1]))) return false;
    return withinWeeklyLimit(ctx, work, i);
  }

  function summarizeNights(state,ctx,D) {
    const periods=new Map();
    for(const day of D.dates(ctx.start,ctx.horizon)) {
      const slot=D.nightPairSlot(state,day);
      if(!slot) continue;
      if(!periods.has(slot.start)) {
        const owners=D.nightPairOwners(state,slot.start);
        const roles=owners.map((ids,k)=>({role:["A","B","C"][k],nurseIds:ids,scheduledDays:[],workedDays:[],vacantDays:[]}));
        periods.set(slot.start,{start:slot.start,end:slot.end,mode:slot.mode,roles});
      }
      const role=periods.get(slot.start).roles[slot.role];
      role.scheduledDays.push(day);
      const covered=Object.values(state.assignments[day]||{}).some(a=>a.shift==="N");
      (covered?role.workedDays:role.vacantDays).push(day);
    }
    return {periods:[...periods.values()]};
  }

  // There are at most five assignable units per role in 14 days. Enumerate
  // their subsets, keeping Friday-to-Sunday as one unit and other nights
  // independent. A long rolling-hours window can require skipping Tuesday
  // and Wednesday without preventing Thursday or the following weekend.
  function nightOption(ctx,period,role,n,slots,random,path) {
    const own=period.owners[role],other=period.owners.some((owners,k)=>k!==role && owners.has(n));
    if(other || (own.size && (!own.has(n) || own.size>1)) || period.dayOwners[role].has(n)) return null;
    const eligible=slots.filter(s=>s.candidates.includes(n));
    if(!eligible.length && !own.has(n)) return null;
    const patterns=[];
    for(let mask=0;mask<(1<<eligible.length);mask++) {
      let count=0;
      for(let k=0;k<eligible.length;k++) if(mask&(1<<k)) count+=eligible[k].open.length;
      patterns.push({mask,count,tie:random()});
    }
    patterns.sort((a,b)=>b.count-a.count || a.tie-b.tie);
    const oldPhase=n.phases, saved=n.work;
    for(const {mask,count} of patterns) {
      if(!count) return own.has(n)?{n,count,work:saved,phases:oldPhase}:null;
      n.work=saved.slice();
      const inserted=[];
      for(let k=0;k<eligible.length;k++) if(mask&(1<<k))
        for(const i of eligible[k].positions) if(!n.work[i]) {n.work[i]="N";inserted.push(i);}
      n.phases=null;
      let phases=null,work=null;
      if(inserted.every(i=>legalDay(ctx,n,i))) {
        phases=path(n,period,role);
        n.phases=phases;
        if(phases && inserted.every(i=>legalDay(ctx,n,i))) work=n.work;
      }
      n.work=saved;
      n.phases=oldPhase;
      if(work) return {n,count,work,phases};
    }
    return null;
  }

  // Night-only peaks are informational. When coverage permits, select a new
  // holder at the boundary rather than accumulating extra nights in 168 h.
  function nightPeak(ctx,work,first,last) {
    const nights=[];
    for(let i=Math.max(0,first-8);i<=Math.min(work.length-1,last+8);i++)
      if(work[i]==="N") nights.push(ctx.shiftIntervals[i].N);
    if(nights.length<4) return 0;
    const lo=ctx.shiftIntervals[first].N[0],hi=ctx.shiftIntervals[last].N[1];
    let largest=0;
    for(const [a,b] of nights) for(const t of [a,b-weeklyMinutes]) {
      if(t+weeklyMinutes<=lo || t>=hi) continue;
      let sum=0;
      for(const [left,right] of nights) sum+=Math.max(0,Math.min(t+weeklyMinutes,right)-Math.max(t,left));
      largest=Math.max(largest,sum);
    }
    return Math.max(0,largest-workLimit);
  }

  function allocateNightRoles(ctx,periods,random,path,pass) {
    let added=0;
    for(const period of periods) {
      const loads=ctx.nurses.map(n=>n.nightCount);
      const minNight=Math.min(...loads),range=Math.max(1,Math.max(...loads)-minNight);
      const first=Math.max(priorDays,period.first),last=Math.min(ctx.endIndex,period.first+13);
      const options=period.groups.map((slots,role)=>{
        const choices=[];
        for(const n of ctx.nurses) {
          const option=nightOption(ctx,period,role,n,slots,random,path);
          if(!option) continue;
          let dayCapacity=0;
          for(let i=first;i<=last;i++) if(n.available[i].J && n.phases?.[i]<=0) dayCapacity++;
          const surplus=nightPeak(ctx,option.work,first,last);
          const fairness=(n.nightCount-minNight)*option.count/range;
          // Periods before the current one include earlier trials in this same
          // proposal. Repeating an identical role is only a tie-breaker.
          const repeated=n.work.slice(Math.max(0,period.first-14),period.first).some((shift,j)=>
            shift==="N" && ctx.pairSlots[Math.max(0,period.first-14)+j]?.role===role);
          const gapBenefit=gapCost(ctx,n,n.work)-gapCost(ctx,n,option.work);
          const scarce=gapCost(ctx,n,n.work,[],true)-gapCost(ctx,n,option.work,[],true);
          const continuityBonus=ctx.prioritizeContinuity && pass%5!==4 ? Math.min(3,Math.max(0,scarce))*75:0;
          option.score=option.count*10+continuityBonus+Math.min(9,Math.sqrt(Math.max(0,gapBenefit))*0.8)+random()*(pass%6===5?16:7)-fairness*0.7-dayCapacity*0.42-
            (period.mode==="three"?Math.min(8,surplus/80):0)-(repeated?1.5:0);
          choices.push(option);
        }
        choices.sort((a,b)=>b.score-a.score);
        // At most R-1 distinct nurses are taken by the other roles. Any option
        // below a role's top R can therefore be replaced by a higher one.
        const top=choices.slice(0,period.groups.length);
        if(!choices.length || !period.owners[role].size) top.push({n:null,count:0,score:0});
        return top;
      });
      let best=null,bestScore=-Infinity;
      const chosen=[];
      function assign(role,score) {
        if(role===options.length) {
          if(score>bestScore) {bestScore=score;best=chosen.slice();}
          return;
        }
        for(const choice of options[role]) {
          if(choice.n && chosen.some(v=>v.n===choice.n)) continue;
          chosen.push(choice);
          assign(role+1,score+choice.score);
          chosen.pop();
        }
      }
      assign(0,0);
      for(const option of best||[]) if(option.n && option.count) {
        option.n.work=option.work;
        option.n.phases=option.phases;
        option.n.nightCount+=option.count;
        added+=option.count;
      }
    }
    return added;
  }

  // Only actual duty codes distinguish two proposals. Unknown or reviewed rest,
  // phase age, locks, confirmation and anticipatory rows do not create a variant.
  function referenceGrid(ctx,reference) {
    const idSet=new Set(ctx.nurses.map(n=>n.id));
    let otherJobs=0;
    const rows=ctx.nurses.map(()=>[]);
    for(let i=priorDays;i<=ctx.monthEnd;i++) {
      const team=reference.assignments[ctx.days[i]] || {};
      for (const [id,entry] of Object.entries(team))
        if (!idSet.has(id) && shifts.includes(entry?.shift)) otherJobs++;
      ctx.nurses.forEach((n,j)=>{
        const shift=team[n.id]?.shift;
        rows[j][i]=shifts.includes(shift)?shift:null;
      });
    }
    return {rows,otherJobs};
  }

  function differentDutyCells(ref,work,monthEnd,firstOnly=false) {
    let count=ref.otherJobs;
    for (let n=0;n<work.length;n++) for (let i=priorDays;i<=monthEnd;i++) {
      if ((work[n][i]||null)!==ref.rows[n][i]) {
        if (firstOnly) return 1;
        count++;
      }
    }
    return count;
  }

  // Keep all existing duties on a partial proposal. Only an accepted proposal
  // persists additions; an unfilled position is represented by no assignment.
  function partialProposal(state,year,month,D,options,failure,random,deadline,references) {
    const {forecast,resumeFrom,resumeUntil}=options;
    let ctx;
    try {ctx=prepare(state,year,month,D,forecast,resumeFrom,resumeUntil);}
    catch (e) {return result("invalid_input",String(e.message||e));}
    if (!ctx?.nurses) return failure;
    ctx.prioritizeContinuity=options.prioritizeContinuity;
    const {nurses,days,weekdays,endIndex}=ctx;
    const baseline=D.planningProblems(state,ctx.start,ctx.horizon,{continuation:Boolean(resumeFrom)});
    const unchanged={...failure,start:ctx.start,end:ctx.horizon,added:0,vacancies:baseline.vacancies,
      issues:baseline.conflicts,warnings:baseline.warnings,nightOverruns:baseline.nightOverruns,totalRequired:baseline.totalRequired,covered:baseline.covered};
    if(!baseline.vacancies.length) {
      if(baseline.conflicts.length || references.length) return unchanged;
      return {...unchanged,status:"feasible",candidate:state,message:"Tous les postes de la période sont déjà couverts.",
        nightPattern:summarizeNights(state,ctx,D),resumeFrom:resumeFrom?ctx.start:null,nightRotationFrom:state.settings.night_rotation_from};
    }
    const present=new Set(baseline.conflicts.map(i=>[i.code,i.day,i.nurse_id,i.message].join("|")));
    const occupied=nurses.map(n=>n.work.slice());
    const fixed=days.map((_,i)=>Object.fromEntries(shifts.map(c=>[c,nurses.filter(n=>n.work[i]===c)])));
    const bounds={J:D.phaseBounds(state.settings,"J"),N:D.phaseBounds(state.settings,"N")};
    const refs=references.map(ref=>referenceGrid(ctx,ref));
    const periods=new Map();
    for(let i=0;i<days.length;i++) {
      const slot=ctx.pairSlots[i];
      if(!slot) continue;
      let p=periods.get(slot.start);
      if(!p) {
        p={start:slot.start,first:i-slot.index,mode:slot.mode,dayOwners:Array.from({length:slot.roleCount},()=>new Set()),
          owners:Array.from({length:slot.roleCount},()=>new Set()),groups:Array.from({length:slot.roleCount},()=>[])};
        periods.set(slot.start,p);
      }
      for(const n of fixed[i].N) p.owners[slot.role].add(n);
      for(const c of ["J","T"]) for(const n of fixed[i][c]) for(let k=0;k<slot.roleCount;k++)
        if(D.nightRoleReservesDay(slot,k)) p.dayOwners[k].add(n);
    }
    const slots=[];
    for(let i=priorDays;i<=endIndex;i++) for(const code of shifts) {
      if(code==="T" && !ctx.needed[i]) continue;
      const w=weekdays[i],mon=i-w;
      const [a,b]=code==="N" && w>=4?[4,6]:w>=5?[5,6]:[w,w];
      if(i!==Math.max(priorDays,mon+a)) continue;
      const positions=Array.from({length:b-a+1},(_,k)=>mon+a+k);
      if(code==="T" && positions.some(j=>!ctx.needed[j])) continue;
      const alternatives=new Set(positions.flatMap(j=>fixed[j][code]));
      if(alternatives.size>1) continue;
      const open=positions.filter(j=>j>=priorDays && j<=endIndex && !fixed[j][code].length);
      if(!open.length) continue;
      const candidates=nurses.filter(n=>(!alternatives.size || alternatives.has(n)) &&
        positions.every(j=>n.available[j][code] && (!n.oldPhase[j] || (n.oldPhase[j]>0)===(code==="N")) &&
        (n.work[j]===code || (!n.work[j] && (n.editable[j] || ((j<priorDays || j>endIndex) && !n.known[j]))))));
      if(candidates.length) {
        const slot={mon,i,code,positions,open,candidates};
        slots.push(slot);
        const pair=ctx.pairSlots[i];
        if(pair && code==="N") periods.get(pair.start).groups[pair.role].push(slot);
      }
    }
    if(!slots.length) return unchanged;
    const totalSmur=baseline.vacancies.filter(v=>v.shift!=="T").length;
    const nurseIndex=new Map(nurses.map((n,i)=>[n,i]));
    let best=null,bestScore=null,firstComplete=null;
    for(let pass=0;pass<1500 && (pass===0 || now()<deadline);pass++) {
      if(firstComplete!==null && now()-firstComplete>500) break;
      const order=nurses.filter(n=>n.active.slice(priorDays,endIndex+1).some(Boolean));
      for(const [k,n] of nurses.entries()) {
        n.work=occupied[k].slice();
        n.phases=null;
        n.nightCount=n.historicNights+n.work.slice(priorDays,ctx.monthEnd+1).filter(c=>c==="N").length;
      }
      const path=(n,trial,role)=>unboundedDayTrajectory(n,days,bounds,i=>{
        // The relief nurse's 14–21 day phase can straddle the fortnight;
        // actual day duties and existing phases still constrain this path.
        const offset=role===2?[7,0,4][pass%3]:
          role===1 && trial?.mode==="three"?[-7,-4,0][pass%3]:0;
        const preferredStart=trial?trial.first+offset:0;
        const span=trial && i>=preferredStart && i<preferredStart+14;
        if(span) return i-preferredStart+1;
        return -1;
      },false);
      for(const n of nurses) {
        n.phases=order.includes(n)?path(n):null;
        const dayPossible=(j,code)=>n.phases?.[j]<=0 && n.available[j]?.[code] &&
          (code!=="T" || ctx.needed[j]) && n.editable[j] && !fixed[j][code].length;
        n.dayOpportunity=days.map((_,j)=>{
          const w=weekdays[j],other=w===5?j+1:w===6?j-1:j;
          return ["J","T"].some(code=>dayPossible(j,code) && dayPossible(other,code));
        });
      }
      const allocated=allocateNightRoles(ctx,[...periods.values()].filter(p=>p.groups.some(g=>g.length)),random,path,pass);
      let count=allocated,smur=allocated;
      const sequence=slots.map(slot=>{
        let priority=slot.i+random()*(pass%3===2?10:4);
        if(pass%4===0 && slot.code!=="N") priority-=slot.positions.length*50;
        if(pass%5===1 && slot.code!=="N") priority=slot.candidates.length+random()*4;
        return {slot,priority};
      });
      sequence.sort((a,b)=>{
        const rank=s=>s.code==="N"?0:(pass%3===1 || s.code==="J"?1:2);
        return rank(a.slot)-rank(b.slot) || a.priority-b.priority;
      });
      function place(slot,accept) {
        const {code,mon,positions,open}=slot;
        const ranked=[];
        for(const n of slot.candidates) {
          if(!n.phases || positions.some(j=>n.work[j] && n.work[j]!==code)) continue;
          let cost=random()*7;
          if(code!=="N" && positions.some(j=>nightDayReserved(ctx,n,j))) continue;
          const gapBenefit=gapCost(ctx,n,n.work)-gapCost(ctx,n,n.work,open);
          cost-=Math.min(21,Math.sqrt(Math.max(0,gapBenefit))*2.1);
          if(code==="N") cost+=Math.min(15,n.nightCount*0.4);
          else {
            const year=days[slot.i].slice(0,4);
            let workload=n.initialLoads[year]-n.targetAt[slot.i];
            const frozen=occupied[nurseIndex.get(n)];
            for(let j=priorDays;j<=endIndex;j++) if(n.work[j] && !frozen[j] && days[j].startsWith(year))
              workload+=ctx.shiftMinutes[j][n.work[j]];
            cost+=Math.max(-3,Math.min(3,workload/720))*0.4;
            if(positions.some(j=>n.phases[j]>0)) cost+=5;
            if(n.work[slot.i-1]==="J" || n.work[positions.at(-1)+1]==="J") cost-=2;
            if(weekdays[slot.i]===4 && n.available[slot.i+1]?.J && n.available[slot.i+2]?.J) cost-=1;
          }
          ranked.push({n,cost});
        }
        ranked.sort((a,b)=>a.cost-b.cost);
        for(const {n} of ranked) {
          const changed=positions.filter(j=>!n.work[j]);
          for(const j of changed) n.work[j]=code;
          const previous=n.phases;
          let next=previous;
          if(positions.some(j=>(next[j]>0)!==(code==="N"))) next=path(n);
          n.phases=next;
          const viable=next && positions.every(j=>legalDay(ctx,n,j));
          if(viable) {
            const added=open.length;
            count+=added;
            if(code!=="T") smur+=added;
            if(code==="N") n.nightCount+=added;
            if(!accept || accept()) return true;
            count-=added;
            if(code!=="T") smur-=added;
            if(code==="N") n.nightCount-=added;
          }
          n.phases=previous;
          for(const j of changed) n.work[j]=null;
        }
        return false;
      }
      for(const {slot} of sequence) if(slot.code==="N" && !ctx.pairSlots[slot.i]) place(slot);
      // For each week try alternative day owners and explicitly allow leaving
      // a position open. A missed SMUR on Tuesday must not stop the Friday or
      // next week's search. Save the best combination of J, then TIIH.
      const weeks=[];
      for(let monday=ctx.firstMonday;monday<=ctx.lastMonday;monday+=7) {
        const daytime=sequence.map(s=>s.slot).filter(s=>s.mon===monday && s.code!=="N");
        let capacity=0;
        for(const slot of daytime) if(slot.code==="J") {
          capacity+=slot.candidates.filter(n=>n.phases && !nightDayReserved(ctx,n,slot.i) &&
            slot.positions.every(j=>n.phases[j]<=0)).length*slot.open.length;
        }
        const priority=pass%4===0?monday:pass%4===1?-monday:
          pass%4===2?capacity+random()*0.1:random();
        weeks.push({daytime,priority});
      }
      // Filling a scarce week first may release the preceding Sunday for
      // another nurse, or preserve Monday after a fixed weekend.
      weeks.sort((a,b)=>a.priority-b.priority);
      for(const {daytime} of weeks) {
        const remaining=Array(daytime.length+1).fill(0);
        const weight=s=>s.open.length*(s.code==="J"?1001:1);
        for(let k=daytime.length-1;k>=0;k--) remaining[k]=remaining[k+1]+weight(daytime[k]);
        let nodes=0,weekBest=null,weekScore=-1;
        function fill(k,value) {
          if(value+remaining[k]<=weekScore) return false;
          if(k===daytime.length) {
            weekScore=value;
            weekBest={smur,count,rows:nurses.map(n=>n.work.slice()),phases:nurses.map(n=>n.phases)};
            return value===remaining[0];
          }
          if(++nodes>110 && weekBest) return false;
          const slot=daytime[k];
          return place(slot,()=>fill(k+1,value+weight(slot))) || fill(k+1,value);
        }
        fill(0,0);
        if(weekBest) {
          count=weekBest.count;
          smur=weekBest.smur;
          nurses.forEach((n,k)=>{n.work=weekBest.rows[k];n.phases=weekBest.phases[k];});
        }
      }
      redistributeDayDuties(ctx,slots,occupied,nurseIndex,path,pass);
      for(const slot of slots) if(slot.code!=="N" && slot.open.every(j=>!nurses.some(n=>n.work[j]===slot.code))) place(slot);
      if(!count || refs.some(ref=>!differentDutyCells(ref,nurses.map(n=>n.work),ctx.monthEnd,true))) continue;
      const nightValues=order.map(n=>n.nightCount);
      const average=nightValues.reduce((sum,v)=>sum+v,0)/nightValues.length;
      const nightVariance=nightValues.reduce((sum,v)=>sum+(v-average)**2,0);
      let isolated=0,shortWeekend=0;
      for(const n of order) for(let j=priorDays;j<=endIndex;j++) if(dayShift(n.work[j])) {
        if(!dayShift(n.work[j-1]) && !dayShift(n.work[j+1])) isolated++;
        if(weekdays[j]===5 && n.work[j]==="J" && n.work[j-1]!=="J") shortWeekend++;
      }
      const nightExcess=order.reduce((sum,n)=>sum+nightPeak(ctx,n.work,priorDays,endIndex),0);
      const gaps=order.reduce((sum,n)=>sum+gapCost(ctx,n,n.work),0);
      const prefix=ctx.prioritizeContinuity?[-gaps,smur]:[smur,-gaps];
      const score=[...prefix,count,-nightExcess,allocated,-nightVariance,-isolated,-shortWeekend];
      const key=bestScore?score.findIndex((v,k)=>v!==bestScore[k]):-1;
      if(bestScore && (key<0 || score[key]<bestScore[key])) continue;
      const candidate=JSON.parse(JSON.stringify(state));
      for(let j=priorDays;j<=endIndex;j++) for(const [id,n] of nurses.entries()) {
        const date=days[j],code=n.work[j];
        if(!code || occupied[id][j] || !n.editable[j]) continue;
        (candidate.assignments[date]??={})[n.id]={shift:code,confirmed:false,locked:false};
        const reviewed=candidate.reviewed[date]??=[];
        if(!reviewed.includes(n.id)) reviewed.push(n.id);
      }
      for(const n of order) {
        if(!n.phases || !n.work.some((c,j)=>j>=priorDays && j<=endIndex && c && !occupied[nurseIndex.get(n)][j])) continue;
        for(let j=priorDays;j<=endIndex;j++) if(n.active[j] && !n.oldPhase[j]) {
          const phase=n.phases[j];
          (candidate.phases[days[j]]??={})[n.id]={mode:phase>0?"N":"J",age:Math.abs(phase),locked:false};
        }
      }
      const checked=D.planningProblems(candidate,ctx.start,ctx.horizon,{continuation:Boolean(resumeFrom),includeWorkGaps:false});
      if(checked.conflicts.some(i=>!present.has([i.code,i.day,i.nurse_id,i.message].join("|")))) continue;
      const added=baseline.vacancies.length-checked.vacancies.length;
      if(!added) continue;
      const status=checked.vacancies.length||checked.conflicts.length?"partial":"feasible";
      const message=status==="partial" ? "Proposition partielle du "+ctx.start+" au "+ctx.horizon+". "+failure.message :
        "Tous les postes sont attribués du "+ctx.start+" au "+ctx.horizon+".";
      best={...result(status,message,candidate,ctx.horizon),start:ctx.start,added,
        vacancies:checked.vacancies,issues:checked.conflicts,warnings:checked.warnings,nightOverruns:checked.nightOverruns,
        totalRequired:checked.totalRequired,covered:checked.covered,
        conflictCode:failure.conflictCode??null,conflictDate:failure.conflictDate??null,
        resumeFrom:resumeFrom?ctx.start:null,nightRotationFrom:state.settings.night_rotation_from??null,
        changedAssignments:refs.length?differentDutyCells(refs[0],nurses.map(n=>n.work),ctx.monthEnd):0,
        nightPattern:summarizeNights(candidate,ctx,D)};
      bestScore=score;
      if(smur===totalSmur && added===baseline.vacancies.length && gaps===0) firstComplete??=now();
    }
    return best||unchanged;
  }

  function generate(input,year,month,{timeLimitMs=1800,seed=Date.now(),includeLookahead=false,differentFrom=[],
      resumeFrom=null,resumeUntil=null,replanUnlocked=false,nightRelief=null,restartNightRotation=null,prioritizeContinuity=false}={}) {
    const D=globalThis.PlannerDomain;
    let state,start,end,horizon,replanned=false,source,referenceWasComplete=false;
    const refs=Array.isArray(differentFrom)?differentFrom:[differentFrom];
    if(refs.some(ref=>!ref?.assignments || typeof ref.assignments!=="object" || Array.isArray(ref.assignments)))
      return result("invalid_input","La référence doit contenir des affectations de planning.");
    const forecast=includeLookahead===true && !resumeFrom;
    try {
      state=input?.settings?.rules_version===5?D.validateState(input):D.migrateState(input);
      [start,end]=D.monthBounds(year,month);
      if(resumeFrom) {
        D.addDays(resumeFrom,0);
        if(resumeFrom>start) start=resumeFrom;
        if(resumeUntil!=null) {D.addDays(resumeUntil,0);if(resumeUntil>end) throw Error("Fin de reprise hors du mois.");end=resumeUntil;}
      } else if(resumeUntil!=null) throw Error("Choisissez une date de début.");
      if(start>end) throw Error("La date de fin doit suivre la date de début.");
      horizon=forecast?D.addDays(end,18):end;
      if(forecast && [4,5].includes(D.weekday(horizon))) horizon=D.addDays(horizon,6-D.weekday(horizon));
      const activation=state.settings.night_rotation_from || (resumeFrom?D.nightRotationStart(state,resumeFrom):
        (D.nightPairSlot(state,start)?.start ?? D.addDays(start,-D.weekday(start))));
      state={...state,settings:{...state.settings,night_rotation_from:activation}};
      // Record the choice for the complete calendar fortnight, but only on this
      // working copy. A different default later must not reinterpret saved shifts.
      state.settings.night_relief_periods={...state.settings.night_relief_periods};
      if(restartNightRotation!=null) {
        const restart=resumeFrom && nightRotationRestart(state,start,end);
        if(!restart || restart.date!==restartNightRotation)
          throw Error("La reprise du roulement à cette date déplacerait une quinzaine déjà enregistrée ou ne correspond pas à la fin de la première semaine historique.");
        D.setNightRotationStart(state,restart.date);
      }
      if(nightRelief!==null) {
        if(!["two","three"].includes(nightRelief)) throw Error("Choisissez le roulement à deux ou trois IDE.");
        D.setNightRotationRange(state,start,horizon,nightRelief);
      } else {
        for(let day=start;day<=horizon;) {
          const span=D.nightPairSlot(state,day);
          if(span) {
            D.setNightRotationRange(state,day,day,span.mode);
            day=D.addDays(span.end,1);
          } else day=D.addDays(day,1);
        }
      }
      if(replanUnlocked || (!resumeFrom && refs.length)) {
        source=state;
        replanned=true;
        const before=D.planningProblems(state,start,horizon,{continuation:Boolean(resumeFrom)});
        referenceWasComplete=!before.vacancies.length && !before.conflicts.length;
        state=D.previewClearRange(state,start,forecast?end:horizon).state;
      }
    } catch(e) {return result("invalid_input",String(e.message||e));}
    const explanation="Les disponibilités, les postes déjà fixés et les repos peuvent laisser des postes à pourvoir.";
    const fail=result("infeasible",explanation);
    const random=randomGenerator(seed),deadline=now()+Math.max(100,Math.min(15000,Number(timeLimitMs)||1800));
    const proposal=partialProposal(state,year,month,D,{forecast,resumeFrom,resumeUntil,prioritizeContinuity:prioritizeContinuity===true},fail,random,deadline,refs);
    if(proposal.status!=="invalid_input") {
      const pattern=proposal.nightPattern??summarizeNights(state,{start,horizon},D);
      proposal.reliefVacancies=pattern.periods.flatMap(p=>p.mode==="three"?p.roles[2].vacantDays:[]);
      proposal.canTryTwo=proposal.reliefVacancies.length>0;
    }
    if(!proposal.candidate && refs.length && proposal.status!=="invalid_input")
      return {...proposal,status:"no_alternative",message:"Aucune proposition différente compatible trouvée sur cette période."};
    if(replanned && proposal.candidate) {
      let changed=0,placed=0;
      for(const day of D.dates(start,end)) for(const n of source.nurses) {
        const before=source.assignments[day]?.[n.id]?.shift;
        const after=proposal.candidate.assignments[day]?.[n.id]?.shift;
        if((shifts.includes(before)?before:null)===(shifts.includes(after)?after:null)) continue;
        changed++;
        if(shifts.includes(after)) placed++;
      }
      if(changed && !placed) return result("no_alternative","Aucune nouvelle garde compatible à proposer sur cette période.");
      proposal.changedAssignments=changed;
      proposal.replanUnlocked=true;
    }
    if(referenceWasComplete && proposal.status==="partial" && !prioritizeContinuity)
      return result("no_alternative","Aucune autre proposition complète compatible trouvée sur cette période.");
    if(proposal.candidate && proposal.nightPattern) {
      // Only the opposite role's dates are certain rest. Leave that worker's
      // own missed nights, absences and everyone else's blank cells untouched.
      const candidate=proposal.candidate===state?JSON.parse(JSON.stringify(state)):proposal.candidate;
      for(const period of proposal.nightPattern.periods) {
        for(const holder of period.roles) {
          if(holder.nurseIds.length!==1) continue;
          const others=period.roles.filter(r=>r!==holder),id=holder.nurseIds[0];
          if(others.some(r=>r.nurseIds.includes(id))) continue;
          const person=candidate.nurses.find(n=>n.id===id);
          for(const other of others) for(const date of other.scheduledDays) {
            const slot=D.nightPairSlot(candidate,date),k=period.roles.indexOf(holder);
            const recovery=period.mode==="three" && k===1 && [7,8].includes(slot.index) &&
              [4,5,6].every(offset=>candidate.assignments[D.addDays(period.start,offset)]?.[id]?.shift==="N");
            if(!D.nightRoleReservesDay(slot,k) && candidate.phases[date]?.[id]?.mode!=="N" && !recovery) continue;
            if(!D.isActive(person,date) || D.absenceOn(candidate,id,date) || candidate.assignments[date]?.[id]) continue;
            (candidate.assignments[date]??={})[id]={shift:"-",locked:false,confirmed:false};
            const reviewed=candidate.reviewed[date]??=[];
            if(!reviewed.includes(id)) reviewed.push(id);
          }
        }
      }
      proposal.candidate=candidate;
      proposal.restartNightRotation=restartNightRotation;
      proposal.workGaps=D.workGaps(candidate,start,horizon,{assumePlanned:true});
    }
    proposal.prioritizeContinuity=prioritizeContinuity===true;
    return proposal;
  }
  globalThis.PlannerEngine=Object.freeze({generate,nightRotationRestart,summarizeNights:(state,start,end)=>
    summarizeNights(state,{start,horizon:end},globalThis.PlannerDomain)});
})();

</script>
<script>
/* Import the monthly attendance grid. JSON remains the full-fidelity backup. */
(() => {
  "use strict";

  function readRows(text, separator) {
    const rows = [];
    let row = [], field = "", quoted = false, closing = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c !== '"') field += c;
        else if (text[i + 1] === '"') { field += '"'; i++; }
        else { quoted = false; closing = true; }
        continue;
      }
      if (c === separator || c === "\r" || c === "\n") {
        row.push(field);
        field = ""; closing = false;
        if (c !== separator) {
          if (row.some(value => value !== "")) rows.push(row);
          row = [];
          if (c === "\r" && text[i + 1] === "\n") i++;
        }
      } else if (c === '"' && !field && !closing) {
        quoted = true;
      } else {
        if (closing || c === '"') throw Error("Guillemets incorrects dans le CSV.");
        field += c;
      }
    }
    if (quoted) throw Error("Guillemets non fermés dans le CSV.");
    row.push(field);
    if (row.some(value => value !== "")) rows.push(row);
    return rows;
  }

  function shiftLabel(state, day, code, label) {
    if (code !== "T") return label;
    const minutes = globalThis.PlannerDomain.shiftMinutes(state,day,code);
    const duration = Math.floor(minutes / 60) + ":" + String(minutes % 60).padStart(2,"0");
    return "TIIH (" + duration + ")";
  }

  function toLegacyFile(file) {
    const text = file.content.replace(/^\uFEFF/, "");
    const delimiter = /^(?:"IDE"|IDE)([;,])/i.exec(text)?.[1];
    if (!delimiter) throw Error(file.name + " : le CSV mensuel doit commencer par IDE puis les dates AAAA-MM-JJ.");
    const [header, ...rows] = readRows(text, delimiter);
    const days = header.slice(1);
    const month = days[0]?.slice(0, 7);
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month) || !rows.length)
      throw Error(file.name + " : choisissez un CSV mensuel de planning contenant des IDE et des dates.");
    const last = globalThis.PlannerDomain.monthBounds(Number(month.slice(0, 4)), Number(month.slice(5)))[1];
    const validDays = new Set(globalThis.PlannerDomain.dates(month + "-01", last));
    if (days.some(day => !validDays.has(day)) || new Set(days).size !== days.length)
      throw Error(file.name + " : chaque colonne doit porter une date distincte du même mois.");

    const result = Object.create(null), missingAbsences = [];
    const labels = new Map([["J","J"],["SMUR J","J"],["N","N"],["SMUR N","N"],
      ["T","T"],["TIIH","T"],["REPOS","-"],["-","-"],["'-","-"]]);
    for (const [index, row] of rows.entries()) {
      if (row.length !== header.length)
        throw Error(file.name + " : nombre de colonnes incorrect à la ligne " + (index + 2) + ".");
      // The exporter protects formula-like fields for spreadsheet software.
      const name = row[0].replace(/^'(?=\s*[=+@-])/, "").trim();
      if (!name || Object.hasOwn(result, name)) throw Error(file.name + " : nom d’IDE vide ou en double.");
      const entries = result[name] = Object.create(null);
      days.forEach((day, column) => {
        const label = row[column+1].trim().toUpperCase();
        if (["","NON RENSEIGNÉ","INCONNU","À RENSEIGNER","HORS EFFECTIF"].includes(label)) return;
        if (label === "ABSENCE") { missingAbsences.push(name + " · " + day); return; }
        // The history importer checks explicit durations and rejects conflicting
        // records across files. Older exports carry only the shift code.
        const value = /^TIIH \(\d{1,2}:[0-5]\d\)$/.test(label) ? label : labels.get(label);
        if (!value) throw Error(file.name + " : poste non reconnu pour " + name + " le " + day + " (« " + row[column+1] + " »).");
        entries[String(Number(day.slice(-2)))] = value;
      });
    }
    const warnings = [];
    if (missingAbsences.length) {
      warnings.push(file.name + " · " + missingAbsences.length + " case(s) Absence sans horaires ni crédit : " +
        missingAbsences.slice(0, 7).join(", ") + (missingAbsences.length > 7 ? "…" : "") +
        ". Elles restent à renseigner dans Absences. La sauvegarde JSON complète conserve ces informations.");
    }
    if (!Object.values(result).some(row => Object.keys(row).length))
      throw Error(file.name + " : le CSV ne contient aucun poste ni repos renseigné. Utilisez une sauvegarde JSON pour reprendre les absences.");
    return {name: "planning_" + month.replace("-", "_") + ".json", content: JSON.stringify(result), warnings};
  }
  globalThis.PlannerCSV = Object.freeze({toLegacyFile,shiftLabel});
})();

</script>
<script>
/* Staffing dates and temporary contract percentages for the offline planner. */
(() => {
  "use strict";
  const D = globalThis.PlannerDomain;
  const escape = value => String(value ?? "").replace(/[&<>"']/g,
    ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
  const dateLabel = date => date ? date.split("-").reverse().join("/") : "—";
  const button = (command, label, data = "", css = "") =>
    '<button type="button" class="'+css+'" data-act="team-manage" data-command="'+command+'" '+data+'>'+label+'</button>';
  const attr = (key, val) => 'data-'+key+'="'+escape(val)+'"';

  function view(state, {day}) {
    const nurses = state.nurses;
    const dated = nurses.filter(n => n.active_from || n.active_until);
    const periods = nurses.flatMap(n => (n.quota_periods || []).map(p => ({n,p})))
      .sort((a,b) => a.p.from.localeCompare(b.p.from) || a.n.name.localeCompare(b.n.name,"fr"));
    const staffingTable = dated.length ? '<div class="scroll"><table><thead><tr><th>Agent</th><th>Entrée</th><th>Dernier jour inclus</th><th>Départ</th></tr></thead><tbody>'+
      dated.map(n => '<tr><th scope="row">'+escape(n.name)+'</th><td>'+dateLabel(n.active_from)+'</td><td>'+dateLabel(n.active_until)+'</td><td>'+
        (n.active_until ? button("return","Annuler le départ",attr("id",n.id),"mini") : "—")+'</td></tr>').join("")+
      '</tbody></table></div>' : "";
    const periodTable = periods.length ? '<div class="scroll"><table><thead><tr><th>Agent</th><th>Du</th><th>Au inclus</th><th>Quotité</th><th>Actions</th></tr></thead><tbody>'+
      periods.map(({n,p}) => {
        const target = attr("id",n.id)+" "+attr("period",p.id);
        return '<tr><th scope="row">'+escape(n.name)+'</th><td>'+dateLabel(p.from)+'</td><td>'+dateLabel(p.to)+'</td><td>'+p.percent+' %</td><td><div class="actions">'+
          button("period","Modifier",target,"mini")+button("delete-period","Supprimer",target,"mini")+'</div></td></tr>';
      }).join("")+'</tbody></table></div>' : "";
    return '<div class="cols"><section class="panel"><h2>Effectif</h2><p class="hint">'+
      nurses.filter(n=>D.isActive(n,day)).length+' agent(s) en poste au '+dateLabel(day)+'.</p><div class="actions">'+
      button("add","Ajouter un agent",attr("day",day),"primary")+
      (nurses.length ? button("exit","Retirer un agent",attr("day",day)) : "")+'</div>'+staffingTable+
      '</section><section class="panel"><h2>Quotités temporaires</h2><p class="hint">À la fin d’une période, la quotité de base en vigueur reprend automatiquement.</p>'+
      (nurses.length ? button("period","Ajouter une période",attr("day",day)) : "")+periodTable+'</section></div>';
  }

  function open(dialog, operation, title, body, submitLabel, attributes="") {
    dialog.innerHTML='<form data-form="team-management" data-operation="'+operation+'" '+attributes+
      '><h2 id="dialog-title">'+escape(title)+'</h2>'+body+'<p role="alert" class="issueerror"></p><div class="actions">'+
      '<button type="button" data-act="close">Annuler</button><button type="submit" class="primary">'+escape(submitLabel)+'</button></div></form>';
    if (!dialog.open) dialog.showModal();
  }
  function options(nurses, selected) {
    return nurses.map(n => '<option value="'+escape(n.id)+'"'+(n.id===selected?" selected":"")+'>'+escape(n.name)+'</option>').join("");
  }
  function dateField(label,name,value) {
    return '<label class="field">'+label+'<input required type="date" name="'+name+'" value="'+escape(value)+'"></label>';
  }
  function percentage(label,value) {
    return '<label class="field">'+label+'<input type="number" min="1" max="100" step="1" required name="percent" value="'+escape(value)+'" placeholder="80"></label>';
  }
  function action(element,{state,dialog}) {
    const {command,id,period,day} = element.dataset;
    const nurse = state.nurses.find(n=>n.id===id);
    const item = nurse?.quota_periods?.find(p=>p.id===period);
    const target = attr("id",id)+" "+attr("period",period);
    if (command==="add") {
      open(dialog,"add","Ajouter un agent",'<label class="field">Nom de l’agent<input required maxlength="90" name="name" autocomplete="off"></label>'+
        dateField("Date d’entrée dans l’équipe","from",day)+percentage("Quotité de base (%)",100),"Ajouter l’agent");
    } else if (command==="exit") {
      open(dialog,"exit-preview","Retirer un agent",'<label class="field">Agent<select required name="nurse">'+
        options(state.nurses)+'</select></label>'+dateField("Dernier jour dans l’équipe (inclus)","last",day),"Examiner le retrait");
    } else if (command==="return" && nurse) {
      open(dialog,"return","Annuler le départ de "+nurse.name+" ?",'<p>La fiche indique un dernier jour au '+dateLabel(nurse.active_until)+
        '. L’agent redeviendra disponible après cette date pour les prochaines générations.</p>',"Annuler ce départ",target);
    } else if (command==="period") {
      const who = item ? '<p>'+escape(nurse.name)+'</p>' :
        '<label class="field">Agent<select required name="nurse">'+options(state.nurses)+'</select></label>';
      open(dialog,"period",item?"Modifier la période":"Ajouter une période de quotité",who+
        dateField("Début inclus","from",item?.from||day)+dateField("Fin incluse","to",item?.to||"")+
        percentage("Quotité temporaire (%)",item?.percent??""),"Enregistrer la période",target);
    } else if (command==="delete-period" && item) {
      open(dialog,"delete-period","Supprimer cette période ?",'<p>'+escape(nurse.name)+' · '+item.percent+' % du '+dateLabel(item.from)+
        ' au '+dateLabel(item.to)+'. La quotité de base s’appliquera sur ces dates.</p>',"Supprimer la période",target);
    }
  }
  function affectedList(shifts) {
    if (!shifts.length) return "";
    return '<details><summary>Voir les postes concernés</summary><ul>'+shifts.map(a=>'<li>'+dateLabel(a.day)+' · '+
      escape(D.SHIFT_LABELS[a.shift])+'</li>').join("")+'</ul></details>';
  }
  function submit(form,{state,dialog,save}) {
    const operation = form.dataset.operation;
    const fields = new FormData(form);
    const get = key => String(fields.get(key)??"");
    const candidate = JSON.parse(JSON.stringify(state));
    const id = form.dataset.id || get("nurse");
    const nurse = candidate.nurses.find(n=>n.id===id);
    let message;
    switch(operation) {
      case "add":
        D.addNurse(candidate,{name:get("name").trim(),from:get("from"),percent:Number(get("percent"))});
        message="Agent ajouté à l’équipe."; break;
      case "exit-preview": {
        const last = get("last");
        const impact = D.nurseExitImpact(candidate,id,last);
        if (impact.protected.length) {
          const first = impact.protected[0];
          throw Error(impact.protected.length+' poste(s) confirmé(s) ou verrouillé(s) après cette sortie, dont '+
            D.SHIFT_LABELS[first.shift]+' le '+dateLabel(first.day)+'. Vérifiez ces postes ou choisissez un autre dernier jour.');
        }
        const count=impact.drafts.length;
        open(dialog,"exit","Confirmer le retrait de "+nurse.name+" ?",'<p>Dernier jour dans l’équipe : <strong>'+dateLabel(last)+
          '</strong>. Son historique jusqu’à cette date reste consultable.</p><p>'+count+' poste(s) de brouillon à réattribuer après le départ.</p>'+
          affectedList(impact.drafts),"Confirmer le retrait",attr("id",id)+" "+attr("last",last));
        return;
      }
      case "exit":
        D.setNurseExit(candidate,id,form.dataset.last);
        message="Départ enregistré. Le planning tient compte du dernier jour dans l’équipe."; break;
      case "return":
        D.setNurseExit(candidate,id,null);
        message="Départ annulé."; break;
      case "period": {
        const period={from:get("from"),to:get("to"),percent:Number(get("percent"))};
        if (form.dataset.period) period.id=form.dataset.period;
        D.setQuotaPeriod(nurse,period);
        message="Période de quotité enregistrée."; break;
      }
      case "delete-period":
        D.removeQuotaPeriod(nurse,form.dataset.period);
        message="Période supprimée. La quotité de base s’applique à ces dates."; break;
      default: throw Error("Action de gestion d’équipe inconnue.");
    }
    save(candidate,message);
    dialog.close();
  }
  globalThis.PlannerTeamManagement=Object.freeze({view,action,submit});
})();

</script>
<script>
/* Each submitted edit has its own immutable body, base revision and retry key. */
(() => {
  "use strict";
  function connect(run, {prepare, receive, canRefresh, active, changed, saved}) {
    let revision=null, phase="loading", error="", readVersion=0, reading=false, writing=false;
    const queue=[];
    const signal=(next,reason="")=>{phase=next; error=reason; changed();};
    function rpc(method,args=[]) {
      return new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>reject(Error("Google Sheets ne répond pas. Vérifiez la connexion puis réessayez.")),35000);
        const ok=value=>{clearTimeout(timer);resolve(value);};
        const fail=problem=>{clearTimeout(timer);reject(Error(problem?.message || "La connexion à Google Sheets a échoué."));};
        try {run.withSuccessHandler(ok).withFailureHandler(fail)[method](...args);}
        catch(e) {fail(e);}
      });
    }
    function readRecord(data) {
      if(!data || !Number.isSafeInteger(data.revision) || data.revision<0 ||
          !(typeof data.body==="string" || data.revision===0 && data.body===null))
        throw Error("Réponse de lecture Google Sheets invalide.");
      return prepare(data.body);
    }
    async function read({force=false,discard=false}={}) {
      if(!active() || writing || queue.length && !discard || !force && (reading || !canRefresh())) return;
      const attempt=++readVersion;
      reading=true;
      if(force) signal(discard?"reloading":"loading");
      try {
        const data=await rpc("readPlanning");
        if(attempt!==readVersion || !active()) return;
        if(!force && !canRefresh()) return;
        if(!force && data?.revision===revision && phase!=="read-error" && phase!=="refresh-error") return;
        const model=readRecord(data);
        if(discard) queue.length=0;
        revision=data.revision;
        signal(data.body===null?"empty":"ready");
        receive(model);
      } catch(e) {
        if(attempt===readVersion && active()) signal(queue.length?"conflict":force?"read-error":"refresh-error",e.message);
      } finally {
        if(attempt===readVersion) reading=false;
      }
    }
    async function drain() {
      if(writing || !queue.length) return;
      writing=true;
      try {
        signal("saving");
        while(queue.length) {
          const job=queue[0];
          if(job.base===null) job.base=revision;
          const result=await rpc("writePlanning",[job.base,job.body,job.id]);
          if(result?.ok===false && result.conflict===true) {
            signal("conflict","Une autre fenêtre a enregistré une version plus récente.");
            return;
          }
          if(result?.ok!==true || !Number.isSafeInteger(result.revision) || result.revision!==job.base+1)
            throw Error("Confirmation d’enregistrement Google Sheets invalide.");
          queue.shift();
          revision=result.revision;
          if(!queue.length) {signal("saved"); saved(job.message,typeof result.viewWarning==="string"?result.viewWarning:"");}
        }
      } catch(e) { signal("write-error",e.message); }
      finally {writing=false;}
    }
    function enqueue(body,message) {
      if(revision===null || phase==="reloading" || phase==="loading" || phase==="read-error") throw Error("Attendez le chargement du planning partagé avant d’enregistrer.");
      const id=globalThis.crypto.randomUUID?.() ?? Array.from(globalThis.crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,"0")).join("");
      readVersion++; reading=false;
      queue.push({id,body,message,base:null});
      if(phase!=="conflict" && phase!=="write-error") void drain();
      else changed();
    }
    return Object.freeze({
      read, enqueue, retry:drain,
      get phase(){return phase;}, get error(){return error;},
      get pending(){return queue.length>0;}, get revision(){return revision;}
    });
  }
  globalThis.PlannerSheetsSync=Object.freeze({connect});
})();

<script>
/* Reassign the roles of one civil date as a single change, including swaps. */
(() => {
  "use strict";
  const D = globalThis.PlannerDomain;
  const roles = ["J","N","T"];
  const owners = (row,role) => Object.keys(row).filter(id=>row[id].shift===role);
  const protectedCell = cell => cell?.locked || cell?.confirmed;
  function checkWeekends(state,candidate,day) {
    const conflicts=D.newConsecutiveFullWeekends(state,candidate,[day]);
    if(conflicts.length) throw Error(conflicts.map(c=>c.message).join("\n"));
  }
  function checkScheduleChange(state,candidate,day) {
    checkWeekends(state,candidate,day);
    const conflicts=[
      ...D.newNightExitRestConflicts(state,candidate,[day]),
      ...D.newNightRotationConflicts(state,candidate,[day])
    ];
    if(conflicts.length) throw Error(conflicts.map(c=>c.message).join("\n"));
  }

  const cachedProblems=new WeakMap();
  function datedErrors(state,day) {
    return D.validateSchedule(state,day,day,false,{partial:true}).filter(i=>i.severity==="error");
  }
  function recordChanges(state,day,next,changes) {
    const reviewed=[...new Set([...(state.reviewed[day]||[]),...changes.map(c=>c.id)])];
    const candidate={...state,assignments:{...state.assignments,[day]:next},reviewed:{...state.reviewed,[day]:reviewed}};
    const inheritedRole=D.newNightRotationConflicts(state,candidate,[day]);
    if(inheritedRole.length) throw Error(inheritedRole.map(c=>c.message).join("\n"));
    const phaseChanges=D.adaptManualDutyPhases(state,candidate,day);
    checkWeekends(state,candidate,day);
    const recovery=D.newNightExitRestConflicts(state,candidate,[day]);
    if(recovery.length) throw Error(recovery.map(c=>c.message).join("\n"));
    const ids=new Set(changes.map(c=>c.id));
    let byDay=cachedProblems.get(state);
    if(!byDay) {byDay=new Map();cachedProblems.set(state,byDay);}
    if(!byDay.has(day)) byDay.set(day,new Set(datedErrors(state,day).map(i=>i.message)));
    const previous=byDay.get(day);
    const problem=datedErrors(candidate,day).find(i=>ids.has(i.nurse_id) && !previous.has(i.message));
    if(problem) throw Error(problem.message);
    return {changes,candidate,phaseChanges};
  }
  function edit(state,day,choices,lock) {
    const old = state.assignments[day] || {}, next = {...old}, wanted = new Map();
    for (const role of roles) {
      const prior = owners(old,role);
      const value = choices[role] ?? "keep";
      let ids = prior;
      if (value!=="keep") {
        if (value!=="vacant" && !value.startsWith("id:")) throw Error("Titulaire non reconnu.");
        ids = value==="vacant" ? [] : [value.slice(3)];
      }
      for (const id of ids) {
        if (wanted.has(id)) throw Error("Une IDE ne peut pas occuper deux postes à la même date. Vérifiez les titulaires.");
        wanted.set(id,role);
        if (old[id]?.shift===role) continue;
        const nurse = state.nurses.find(n=>n.id===id);
        if (!nurse || !D.isActive(nurse,day)) throw Error("L’IDE doit faire partie de l’effectif à cette date.");
        if (role==="T" && !D.tiihRequired(state,day)) throw Error("Le TIIH est fermé à cette date.");
        if (D.absentFor(state,id,day,role)) throw Error(nurse.name+" est en absence pendant ce poste.");
      }
    }
    const changes = [];
    for (const id of new Set([...Object.keys(old),...wanted.keys()])) {
      const before = old[id]?.shift || "-", after = wanted.get(id) || "-";
      if (before===after) continue;
      const nurse = state.nurses.find(n=>n.id===id);
      if (protectedCell(old[id])) throw Error("La case de "+nurse.name+" est verrouillée ou confirmée. Retirez sa protection dans sa fiche pour la modifier.");
      next[id]={shift:after,locked:lock,confirmed:false};
      changes.push({id,name:nurse.name,before,after});
    }
    if (!changes.length) return {candidate:state,changes};
    return recordChanges(state,day,next,changes);
  }
  function cell(state,day,id,shift,{locked=false,confirmed=false}={}) {
    const row=state.assignments[day]||{}, prior=row[id], nurse=state.nurses.find(n=>n.id===id);
    if(!nurse || !D.isActive(nurse,day)) throw Error("Cette IDE est hors effectif le "+day+".");
    if(!["-",...roles].includes(shift)) throw Error("Poste inconnu.");
    if(confirmed && (shift==="-" || D.shiftInterval(day,shift,"elapsed",state)[1]>Date.now()/60000))
      throw Error("Seul un poste terminé peut être confirmé.");
    const next={...row,[id]:{shift,locked,confirmed}}, before=prior?.shift||"-";
    if(before===shift) {
      const reviewed=[...new Set([...(state.reviewed[day]||[]),id])];
      return {candidate:{...state,assignments:{...state.assignments,[day]:next},reviewed:{...state.reviewed,[day]:reviewed}},changes:[],phaseChanges:[]};
    }
    if(protectedCell(prior)) throw Error("La case de "+nurse.name+" est protégée le "+day+".");
    if(shift==="T"&&!D.tiihRequired(state,day)) throw Error("Le TIIH est fermé le "+day+".");
    if(shift!=="-"&&D.absentFor(state,id,day,shift)) throw Error(nurse.name+" est en absence pendant ce poste le "+day+".");
    const changes=[{id,name:nurse.name,before,after:shift}];
    for(const holder of shift==="-"?[]:owners(row,shift)) {
      const other=state.nurses.find(n=>n.id===holder);
      if(protectedCell(row[holder])) throw Error(D.SHIFT_LABELS[shift]+" du "+day+" est déjà attribué à "+other.name+" et protégé.");
      next[holder]={shift:"-",locked:false,confirmed:false};
      changes.push({id:holder,name:other.name,before:shift,after:"-"});
    }
    return recordChanges(state,day,next,changes);
  }
  globalThis.PlannerDayEditor=Object.freeze({edit,cell,owners,protectedCell,checkWeekends,checkScheduleChange});
})();

</script>

(() => {

      const h=Math.max(1,above+Math.ceil(m.actualBoundingBoxDescent)+1);
      canvas.width=w;canvas.height=h;ctx.font=font;ctx.fillText(text,-left,above);
      const alpha=ctx.getImageData(0,0,w,h).data, stride=Math.ceil(w/8), mask=new Uint8Array(stride*h);

      const lower=(above-h)/em, box=[left/em,lower,(left+w)/em,above/em].map(num).join(" "), advance=num(m.width/em);

      const map=this.stream("","/CIDInit /ProcSet findresource begin\n12 dict begin\nbegincmap\n/CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def\n/CMapName /LocalUnicode def\n/CMapType 2 def\n1 begincodespacerange\n<01> <01>\nendcodespacerange\n1 beginbfchar\n<01> <"+unicodeHex(text)+">\nendbfchar\nendcmap\nCMapName currentdict /CMap defineresource pop\nend end");
      const id=this.object("<< /Type /Font /Subtype /Type3 /FontBBox ["+box+"] /FontMatrix [1 0 0 1 0 0] /FirstChar 1 /LastChar 1 /Widths ["+advance+"] /Encoding << /Type /Encoding /Differences [1 /G] >> /CharProcs << /G "+glyph+" 0 R >> /Resources << /XObject << /I "+image+" 0 R >> >> /ToUnicode "+map+" 0 R >>");

  function drawHalf(p,job,dates,rows,y,custom) {

        p.text(c==="X"?"×":c,wx+cw/2,y+row.h/2+3.1,9.3,{bold:c!=="?"&&c!=="R",align:"center",color:c==="?"?colors.muted:colors.ink});
      });
      row.lines.forEach((t,i)=>p.text(t,x+7,y+(row.h-row.lines.length*10.6)/2+8+i*10.6,8.8,{bold:true}));

    }

      p.rect(x,y,w,18,colors.A);p.text("Postes à pourvoir",x+7,y+12,8.8,{bold:true});
      dates.forEach((d,i)=>p.text((job.openByDay.get(d)||[]).join(" "),x+nameW+(i+.5)*cw,y+12,8.6,{bold:true,align:"center"}));
      y+=18;
    }
    if(custom.size){
      p.rect(x,y,w,24,colors.light);p.text("TIIH modifié · début 09:00",x+7,y+10,7.8,{bold:true,color:colors.teal});
      p.text("Heure de fin / durée du poste",x+7,y+20,7.1,{color:colors.muted});
      dates.forEach((d,i)=>{const t=custom.get(d);if(!t)return;const center=x+nameW+(i+.5)*cw;

        p.text(D.formatMinutes(t.minutes),center,y+20,7,{align:"center",color:colors.muted});

    p.line(x,gridTop,x, y);p.line(x,gridTop,x+w,gridTop);p.line(x,y,x+w,y);
    return y;
  }
  function teamPages(pdf,job) {
    const pages=[];let p,y,top;
    function next(){p=new Page(pdf,LANDSCAPE);pages.push(p);top=y=header(p,job);}
    next();
    const rows=job.roster.flatMap(n=>{
      const lines=wrap(pdf,n.name,148,8.8,true);
      const parts=[];
      for(let i=0;i<lines.length;i+=28) {
        const portion=lines.slice(i,i+28);
        parts.push({n,lines:portion,h:Math.max(18,portion.length*10.6+7)});
      }
      return parts;
    });
    for(const dates of [job.days.slice(0,15),job.days.slice(15)]) {
      const custom=new Map();
      for(const d of dates) {
        if(!D.tiihRequired(job.state,d)&&!job.roster.some(n=>codeAt(job.state,n,d)==="T"))continue;
        const t=tiih(job.state,d);if(t.minutes!==D.SHIFT_MINUTES.T)custom.set(d,t);
      }
      const fixed=39+(custom.size?24:0)+(dates.some(d=>job.openByDay.has(d))?18:0), bottom=p.h-85;
      if(!rows.length){y=drawHalf(p,job,dates,[],y,custom)+15;continue;}
      if(y>top && y+fixed+rows.reduce((sum,r)=>sum+r.h,0)>bottom) next();
      let i=0;
      while(i<rows.length) {
        if(y+fixed+rows[i].h>bottom && y>top) next();
        const start=i;let h=0;
        while(i<rows.length && (i===start || y+fixed+h+rows[i].h<=bottom)){h+=rows[i].h;i++;}
        y=drawHalf(p,job,dates,rows.slice(start,i),y,custom)+15;
        if(i<rows.length) next();
      }
    }
    return pages;
  }
  function individualPages(pdf,job) {
    const pages=[],rows=job.days.map(day=>({day,code:codeAt(job.state,job.person,day)}));
    const total=rows.reduce((m,r)=>m+(["J","N","T"].includes(r.code)?D.shiftMinutes(job.state,r.day,r.code):0),0);
    job.nameAnnex=wrap(pdf,job.person.name,PORTRAIT[0]-2*margin-2,24,true).length>5;
    let i=0;
    while(i<rows.length){

      const x=margin,right=p.w-margin,cols=[x,x+139,x+236,right-57,right];

        y+=19;p.line(x,y,right,y);
      }
      cols.forEach(xx=>p.line(xx,top,xx,y));p.line(x,top,right,top);
    }

      const nameLines=wrap(pdf,job.person.name,PORTRAIT[0]-2*margin-2,12,true);
      let line=0;
      while(line<nameLines.length) {
        const p=new Page(pdf,PORTRAIT);pages.push(p);
        let y=header(p,job,true,true)+12;
        while(line<nameLines.length && y<=p.h-50){p.text(nameLines[line++],margin,y,12,{bold:true});y+=17;}
      }
    }
    return pages;
  }
  function conflictPages(pdf,job) {
    const conflicts=job.problems.conflicts.filter(i=>!job.person || i.nurse_id===job.person.id);
    const notes=job.person?[]:(job.problems.capacityNotes||[]);
    if(!conflicts.length && !notes.length && !job.nightOverruns.length && !job.workGaps.length) return [];
    const pages=[];
    let page,y,heading;
    function next() {
      page=new Page(pdf,job.person?PORTRAIT:LANDSCAPE);pages.push(page);
      y=header(page,job,Boolean(job.person))+10;
      page.text(heading,margin,y,13,{bold:true});y+=22;
    }

      ...job.nightOverruns

    for(const [title,items] of [["Périodes sans garde à examiner",job.workGaps],["Dépassements de 48 h en nuits seules",nightItems],["Couverture des nuits",notes],["Conflits à examiner",conflicts]]) {
      if(!items.length) continue;
      heading=title;
      if(!page || y>page.h-88) next();
      else {page.text(heading,margin,y+5,13,{bold:true});y+=27;}
      for(const issue of items) {
        const message=job.person && issue.code==="night_rotation" ?
          "Roulement de nuit à vérifier pour le "+dayFmt.format(utc(issue.day))+"." : issue.message;
        for(const line of wrap(pdf,message,page.w-2*margin,9.5)) {
          if(y>page.h-53) next();

        }
        y+=6;
      }

  }
  function exportMonth({state,year,month,nurseId=null,proposal=false,demo=false}) {
    const days=D.dates(...D.monthBounds(year,month));
    const roster=state.nurses.filter(n=>days.some(d=>D.isActive(n,d)));
    const person=nurseId===null?null:roster.find(n=>n.id===nurseId);
    if(nurseId!==null && !person) throw Error("Cette IDE est hors effectif pendant tout le mois demandé.");
    const monthName=capital(monthFmt.format(utc(days[0])));
    const problems=D.planningProblems(state,days[0],days.at(-1));
    const nightOverruns=(problems.nightOverruns||[]).filter(i=>!person || i.nurse_id===person.id);
    const workGaps=(problems.workGaps||[]).filter(gap=>!person || gap.nurse_id===person.id);
    const openByDay=new Map();
    for(const {day,shift} of problems.vacancies) {
      if(!openByDay.has(day)) openByDay.set(day,[]);
      openByDay.get(day).push(shift);
    }
    const job={state,days,roster,person,proposal,demo,monthName,problems,openByDay,nightOverruns,workGaps,
      unresolved:Boolean(problems.vacancies.length||problems.conflicts.length),
      monthOnly:new Intl.DateTimeFormat("fr-FR",{month:"long",timeZone:"UTC"}).format(utc(days[0])),stamp:stampFmt.format(new Date())};
    const pdf=new PdfFile(), pages=person?individualPages(pdf,job):teamPages(pdf,job);
    if(!person) pages.forEach(teamLegend);
    pages.push(...conflictPages(pdf,job));
    pages.forEach((p,i)=>footer(p,job,i,pages.length));
    const who=person?clean(person.name).replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"").slice(0,60)||"ide":"equipe";
    return {blob:pdf.blob(pages),filename:"planning-"+days[0].slice(0,7)+"-"+who+(proposal?"-proposition":"")+(demo?"-essai":"")+".pdf"};
  }
  globalThis.PlannerPDF=Object.freeze({exportMonth});
})();

      throw Error("L’équipe ou le mois affiché a changé. Rouvrez l’aperçu pour confirmer son périmètre.");

      if(!dialog.open || !form.isConnected || snapshot.key!==key() || snapshot.period!==period) return;
      if(!["ready","empty"].includes(cloud.phase)) throw Error("Impossible de vérifier la version partagée. Vérifiez la connexion puis confirmez à nouveau.");

      syncClearPreview(form);

    if(cloudActive() || storageAvailable) {
