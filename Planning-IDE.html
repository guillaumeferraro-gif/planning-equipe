<body>
<header class="brandbar"><span aria-hidden="true" class="brandmark">+</span><strong>Planning IDE</strong><span class="subtle">SMUR · TIIH</span><small id="storage-status"></small></header>
<div class="wrap"><nav class="nav" id="nav" aria-label="Rubriques"></nav><div id="feedback" class="status" role="status" aria-live="polite"></div><div id="cloud-controls" aria-live="polite"></div><main id="app"></main></div>
<dialog id="editor" aria-labelledby="dialog-title"></dialog><noscript>Activez JavaScript dans le navigateur pour ouvrir le planning.</noscript>
<script>
/* Shared business rules for the offline planner. Civil dates use YYYY-MM-DD. */
(() => {
  "use strict";
  const SHIFT_MINUTES = Object.freeze({J: 720, N: 720, T: 462, "-": 0});
  const SHIFT_LABELS = Object.freeze({J: "SMUR J", N: "SMUR N", T: "TIIH", "-": "Repos"});
  const ABSENCE_KINDS = Object.freeze(["Maladie", "Congés annuels", "RTT", "Grossesse / maternité",
    "Formation", "Congés exceptionnels", "Temps partiel thérapeutique", "Autre"]);
  const shifts = ["J", "N", "T"];
  const maxTiihMinutes=48*60;
  const dayMilliseconds = 86400000;
  const weekMinutes = 10080;
  const paris = new Intl.DateTimeFormat("en-GB", {timeZone: "Europe/Paris", hourCycle: "h23",
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"});
  const dateCache = new Map();
  const shiftCache = new Map();
  const holidaysByYear = new Map();

  function requireValue(condition, message) {
    if (!condition) throw new Error(message);
  }
  function plain(value) {
    return value !== null && typeof value === "object" && !Array.isArray(value);
  }
  function integer(value, min, max) {
    return Number.isSafeInteger(value) && value >= min && value <= max;
  }
  function validId(value) {
    return typeof value === "string" && value.length > 0 && value.length <= 200 &&
      !Object.prototype.hasOwnProperty.call(Object.prototype, value) && value !== "prototype";
  }
  function serial(day) {
    if (dateCache.has(day)) return dateCache.get(day);
    requireValue(typeof day === "string" && /^\d{4}-\d{2}-\d{2}$/.test(day), "Date invalide.");
    const epoch = Date.parse(day + "T00:00:00Z");
    requireValue(Number.isFinite(epoch) && new Date(epoch).toISOString().slice(0,10) === day,
      "Date de calendrier invalide.");
    const daysSinceEpoch = epoch / dayMilliseconds;
    if (dateCache.size > 12000) dateCache.clear();
    dateCache.set(day, daysSinceEpoch);
    return daysSinceEpoch;
  }
  function isoDay(number) {
    return new Date(number * dayMilliseconds).toISOString().slice(0,10);
  }
  function addDays(day, count) { return isoDay(serial(day) + count); }
  function weekday(day) { return ((serial(day) + 3) % 7 + 7) % 7; } // Monday = 0
  function dates(start, end) {
    const first = serial(start), last = serial(end);
    requireValue(last - first < 10000, "Période trop longue.");
    return Array.from({length: Math.max(0, last - first + 1)}, (_, i) => isoDay(first + i));
  }
  function monthBounds(year, month) {
    requireValue(integer(year, 1000, 9998) && integer(month, 1, 12), "Mois ou année invalide.");
    return [new Date(Date.UTC(year, month - 1, 1)).toISOString().slice(0,10),
      new Date(Date.UTC(year, month, 0)).toISOString().slice(0,10)];
  }
  function formatMinutes(value) {
    if (value === null || value === undefined) return "À renseigner";
    const minutes = Math.abs(Math.round(value));
    return (value < 0 ? "−" : "") + Math.floor(minutes / 60) + " h " + String(minutes % 60).padStart(2,"0");
  }
  function parseDuration(text, allowBlank = false) {
    const value = String(text).trim().replace(/\s/g,"").replace(/h/i,":");
    if (value === "" && allowBlank) return null;
    const match = /^(\d{1,5}):([0-5]\d)$/.exec(value);
    requireValue(match, "Saisir une durée au format h:mm, par exemple 7:42.");
    return Number(match[1]) * 60 + Number(match[2]);
  }
  function newState(year = Number(paris.formatToParts(new Date()).find(p => p.type === "year").value)) {
    return {schema_version: 2, revision: 0, nurses: Array.from({length:7},(_,i) => ({
      id: "ide-" + String.fromCharCode(97+i), name: "IDE " + String.fromCharCode(65+i),
      contracts: [{from: year + "-01-01", percent: 100}]
    })), assignments: {}, phases: {}, reviewed: {}, absences: [], tiih_changes: {}, tiih_durations: {},
    oat: {"2026":1560*60},
    settings: {timezone: "Europe/Paris", rest_clock: "wall", phase_min: 14, phase_target: 15,
      phase_max: 21, day_phase_min: 14, day_phase_target: 15, day_phase_max: 16,
      rules_version: 2, extra_holidays: []}};
  }
  function migrateState(input) {
    validateState(input);
    const state=JSON.parse(JSON.stringify(input));
    if (!Object.hasOwn(state,"tiih_durations")) {
      state.tiih_durations={};
      // One previous version opened only Tuesdays and Fridays. A saved move
      // to Thursday retains its slot when the native Thursday is introduced.
      for (const [source,day] of Object.entries(state.tiih_changes)) {
        if (day && day!==source && weekday(day)===3 && !Object.hasOwn(state.tiih_changes,day))
          state.tiih_changes[day]=null;
      }
    }
    const settings=state.settings;
    delete settings.rest_gap_mode;
    if (settings.rules_version===2) return state;
    state.oat["2026"]=1560*60;
    settings.day_phase_min=settings.phase_min;
    settings.day_phase_target=settings.phase_target;
    settings.day_phase_max=settings.phase_max;
    settings.phase_min=14;
    settings.phase_target=Math.max(14,Math.min(21,settings.phase_target));
    settings.phase_max=21;
    settings.rules_version=2;
    return state;
  }
  function phaseBounds(settings,mode) {
    if (mode==="N" || settings.rules_version!==2)
      return {min:settings.phase_min,target:settings.phase_target,max:settings.phase_max};
    return {min:settings.day_phase_min??14,target:settings.day_phase_target??15,max:settings.day_phase_max??16};
  }
  function isActive(nurse,day) {
    return (!nurse.active_from || day>=nurse.active_from) && (!nurse.active_until || day<=nurse.active_until);
  }
  function baseQuotaOn(nurse, day) {
    let latest;
    for (const c of nurse.contracts) if (c.from <= day && (!latest || c.from > latest.from)) latest = c;
    return latest ? latest.percent : null;
  }
  function quotaOn(nurse,day) {
    if (!isActive(nurse,day)) return 0;
    const temporary=nurse.quota_periods?.find(p=>p.from<=day && day<=p.to);
    return temporary ? temporary.percent : baseQuotaOn(nurse,day);
  }
  function setContract(nurse, day, percent) {
    serial(day);
    requireValue(percent === null || integer(percent, 1, 100), "Quotité attendue entre 1 et 100 %, ou vide.");
    nurse.contracts = nurse.contracts.filter(c => c.from !== day).concat({from: day, percent})
      .sort((a,b) => a.from.localeCompare(b.from));
  }
  function newId(prefix,items) {
    const ids=new Set(items.map(item=>item.id));
    let i=1;
    while (ids.has(prefix+i)) i++;
    return prefix+i;
  }
  function checkQuotaPeriod(period) {
    requireValue(plain(period) && integer(period.percent,1,100),"La quotité temporaire doit être comprise entre 1 et 100 %.");
    serial(period.from);
    serial(period.to);
    requireValue(period.from<=period.to,"La fin de la période doit suivre son début.");
  }
  function setQuotaPeriod(nurse,period) {
    checkQuotaPeriod(period);
    requireValue((!nurse.active_from || period.to>=nurse.active_from) &&
      (!nurse.active_until || period.from<=nurse.active_until),"La période est entièrement hors des dates de présence de l’IDE.");
    const periods=nurse.quota_periods??[];
    requireValue(!period.id || periods.some(p=>p.id===period.id),"Cette période de quotité n’existe plus.");
    const id=period.id||newId("periode-",periods);
    requireValue(periods.every(p=>p.id===id || period.to<p.from || period.from>p.to),
      "Cette période chevauche une autre quotité temporaire de l’IDE.");
    nurse.quota_periods=[...periods.filter(p=>p.id!==id),{id,from:period.from,to:period.to,percent:period.percent}]
      .sort((a,b)=>a.from.localeCompare(b.from));
    return id;
  }
  function removeQuotaPeriod(nurse,id) {
    const periods=nurse.quota_periods??[];
    requireValue(periods.some(p=>p.id===id),"Cette période de quotité n’existe plus.");
    nurse.quota_periods=periods.filter(p=>p.id!==id);
  }
  function addNurse(state,{name,from,percent}) {
    serial(from);
    const clean=typeof name==="string"?name.trim():"";
    requireValue(clean,"Renseignez un nom pour l’IDE.");
    requireValue(state.nurses.every(n=>n.name.trim().toLocaleLowerCase("fr")!==clean.toLocaleLowerCase("fr")),
      "Une IDE porte déjà ce nom dans l’équipe.");
    requireValue(integer(percent,1,100),"La quotité initiale doit être comprise entre 1 et 100 %.");
    const id=newId("agent-",state.nurses);
    state.nurses.push({id,name:clean,active_from:from,contracts:[{from,percent}]});
    return id;
  }

      for (const [d,row] of Object.entries(state.assignments)) {
        const a=row[n.id];

        remaining_minutes:total===null || target===null ? null : target-total, conflicts,

  function validateSchedule(state,start,end,coverage=true) {

    }

    for (const [range,code,title] of [[prior,"history","Historique précédent"],[following,"future","Mois suivant"]]) {

        issue(code,title+" incomplet. Le contrôle des limites reste provisoire.",null,null,"warning");
    }
    if (!state.settings.rest_clock)
      issue("rest_convention","Choisissez la convention de repos dans les paramètres.",null,null,"warning");

      issue("quota","Certaines quotités doivent être renseignées.",null,null,"warning");

      const assigned=state.nurses.filter(n=>isActive(n,d)).map(n=>state.assignments[d]?.[n.id]).filter(Boolean);

      for (const d of contextDays) {
        const a=state.assignments[d]?.[nid];
        if (a && a.shift!=="-") {

      for (const w of work) if (w.d>=start && w.d<=end) impactedEnd=Math.max(impactedEnd,w.finish);

        const next=work[i],clock=state.settings.rest_clock;

          if (!clock && next.begin>=prev.finish) continue;

            next.begin-prev.finish;
          if (rest<0) report("rest","postes du "+prev.d+" et du "+next.d+" en chevauchement.",next.d);

      for (const first of dates(addDays(start,-4),end)) {
        const third=addDays(first,2);

          const d=addDays(first,offset);

          recoveryIssues.add(d);
          report("recovery_after_three","poste du "+d+" pendant les deux jours de repos obligatoires après la série du "+
            first+" au "+third+".",d);

      }
      const impactedWeeks=impactedEnd>followingWeek.interval[0]?[...weeks,followingWeek]:weeks;
      for (const {date,interval:[a,b]} of impactedWeeks) {
        const total=work.reduce((sum,w)=>sum+Math.max(0,Math.min(b,w.finish)-Math.max(a,w.begin)),0);

        for (const t of [begin,finish,begin-weekMinutes,finish-weekMinutes]) boundaries.add(t);

      for (const t of boundaries) {
        if (!overlap(t,t+weekMinutes,scopeStart,impactedEnd)) continue;
        const total=work.reduce((sum,w)=>sum+Math.max(0,Math.min(t+weekMinutes,w.finish)-Math.max(t,w.begin)),0);
        if (total>worst) { worst=total; when=t; }
      }
      if (worst>2880) {
        const d=localParts(when).day;
        report("weekly",formatMinutes(worst)+" de travail sur 168 h à partir du "+d+" (maximum 48 h).",d);
      }
      for (const fri of dates(addDays(start,-3),end)) {
        if (weekday(fri)!==4) continue;
        const sat=addDays(fri,1),sun=addDays(fri,2),mon=addDays(fri,3);
        const known=d=>(d>=start && d<=end) || state.reviewed[d]?.includes(nid) ||
          Object.hasOwn(state.assignments[d]||{},nid);
        if (known(sat)&&known(sun)&&byDay.get(sat)!==byDay.get(sun))
          report("weekend","samedi "+sat+" et dimanche doivent être travaillés ensemble au même poste.",sat);
        const nightBlock=[fri,sat,sun];
        if (nightBlock.some(d=>byDay.get(d)==="N") && nightBlock.some(d=>known(d)&&byDay.get(d)!=="N"))
          report("weekend_night","les trois nuits du vendredi "+fri+" au dimanche "+sun+
            " doivent être confiées à la même IDE.",fri);
        if (byDay.has(sun) && ["J","T"].includes(byDay.get(mon)))
          report("monday","poste de jour le lundi "+mon+" après un week-end travaillé.",mon);
      }
      let missing=false;
      // An edited phase can also invalidate the first saved phase after the displayed month.
      for (const d of [...monthDays,addDays(end,1)]) {
        if (!isActive(nurse,d)) continue;
        const previousDay=addDays(d,-1),wasActive=isActive(nurse,previousDay);
        const p=state.phases[d]?.[nid], prev=wasActive?state.phases[previousDay]?.[nid]:null;
        if (d<=end && (!p || (wasActive && !prev))) missing=true;
        if (!p) continue;

        if (d<=end && (p.age>phaseBounds(state.settings,p.mode).max || (shift && (shift==="N")!==(p.mode==="N"))))
          report("regime","poste ou durée incompatible avec la période du "+d+".",d);
        if (prev) {
          const previousBounds=phaseBounds(state.settings,prev.mode);
          const valid=p.mode===prev.mode ? p.age===prev.age+1 :
            p.age===1 && prev.age>=previousBounds.min && prev.age<=previousBounds.max;
          if (!valid) report("regime","transition de régime incohérente le "+d+".",d);

    }

  }
  function legacyShift(label, file, day) {

    if (["J","SMUR J"].includes(value) || value.includes("JOUR") || value.includes("☀")) return "J";
    if (["N","SMUR N"].includes(value) || value.includes("NUIT") || value.includes("🌙")) return "N";

        n.name==="IDE "+String.fromCharCode(65+i) && !n.active_from && !n.active_until && !n.quota_periods?.length && n.contracts.length===1 &&

<script>
/* Standalone search for a monthly nursing roster. All changes go into a copy. */
(() => {
  "use strict";
  const shifts = ["N", "J", "T"];
  // A duty can start two dates before it finishes. Include both tails of every
  // 168-hour window, with one more civil day for clock changes.
  const priorDays = 10;
  const weeklyMinutes = 7 * 24 * 60;
  const workLimit = 48 * 60;
  const now = () => performance.now();
  const result = (status, message, candidate = null, end = null, isolatedNights = null) =>
    ({status, message, candidate, end, isolatedNights});

  function randomGenerator(seed) {
    let number = seed >>> 0;
    return () => {
      number = (Math.imul(1664525, number) + 1013904223) >>> 0;
      return number / 4294967296;
    };
  }

  // Each observed past duty contributes a fair share only to the people on
  // the roster that day. An arrival therefore starts with no inherited debt.
  // The next month accumulates its target at the rate effective on each date.
  function setWorkTargets(state,D,ctx) {
    const {nurses,days,start,endIndex,monthEnd,needed,shiftMinutes}=ctx;
    const years=new Set(days.slice(priorDays,endIndex+1).map(day=>day.slice(0,4)));
    const credits=new Map();
    const people=new Map(nurses.map(n=>[n.id,n.person]));
    for (const a of state.absences) for (const [day,minutes] of Object.entries(a.credits))
      if (D.isActive(people.get(a.nurse_id),day)) credits.set(day,(credits.get(day)||0)+minutes);
    const history=new Set([...Object.keys(state.assignments),...credits.keys()].filter(day=>day<start));
    for (const n of nurses) {
      n.workTargets={};
      n.targetAt=[];
      n.expectedCount=[];
      n.countTarget=0;
    }
    for (const day of history) {
      const year=day.slice(0,4), row=state.assignments[day] || {};
      let minutes=credits.get(day)||0;
      const count={J:0,N:0};
      const weights=nurses.map(n=>{
        if (!D.isActive(n.person,day)) return 0;
        // If a legacy month predates all known rates, use a full-time weight
        // for that historic calculation only.
        return D.quotaOn(n.person,day) ?? 100;
      });
      const weight=weights.reduce((sum,q)=>sum+q,0);
      if (!weight) continue;
      for (const n of nurses) {
        const shift=row[n.id]?.shift;
        if (!shift || shift==="-" || !D.isActive(n.person,day) || D.absentFor(state,n.id,day,shift)) continue;
        if (shift!=="T") {
          count[shift]++;
          n.historicalShifts[shift]++;

        minutes+=D.shiftMinutes(state,day,shift);
      }
      nurses.forEach((n,j)=>{
        const share=weights[j]/weight;
        for (const code of ["J","N"]) n.historicalShifts[code]-=count[code]*share;
        if (years.has(year)) n.workTargets[year]=(n.workTargets[year]||0)+minutes*share;
      });
    }
    for (let i=priorDays; i<=endIndex; i++) {
      const day=days[i],year=day.slice(0,4);
      const work=shiftMinutes[i].J+shiftMinutes[i].N+(needed[i]?shiftMinutes[i].T:0)+(credits.get(day)||0);
      const weight=nurses.reduce((sum,n)=>sum+n.quotas[i],0);
      for (const n of nurses) {
        const share=weight?n.quotas[i]/weight:0;
        n.workTargets[year]=(n.workTargets[year]||0)+work*share;
        n.targetAt[i]=n.workTargets[year];
        if (i<=monthEnd) n.countTarget+=share;
        n.expectedCount[i]=n.countTarget;
      }
    }
  }

  function prepare(state, year, month, D, includeLookahead, reopen=new Set()) {

      throw Error("Choisir un mois et une année valides.");
    if (!state.settings.rest_clock) throw Error("Préciser la convention des 12 h de repos.");
    const [start, end] = D.monthBounds(year, month);
    let horizon = end;
    if (includeLookahead) {
      horizon = D.addDays(end, 18);
      if ([4, 5].includes(D.weekday(horizon))) horizon = D.addDays(horizon, 6-D.weekday(horizon));
    }

    // phase checks. Only start..horizon can ever be written to the proposal.
    const days = D.dates(D.addDays(start, -priorDays), D.addDays(horizon, priorDays));
    const endIndex = days.indexOf(horizon);
    const monthEnd=days.indexOf(end);
    for (const day of days.slice(priorDays,endIndex+1)) {
      const active=state.nurses.filter(n=>D.isActive(n,day)).length;

      shift, D.shiftInterval(day, shift, "elapsed", state)
    ])));
    const restIntervals = state.settings.rest_clock === "elapsed" ? shiftIntervals :
      days.map(day => Object.fromEntries(shifts.map(shift => [shift, D.shiftInterval(day, shift, "wall", state)])));
    const shiftMinutes = days.map(day => Object.fromEntries(shifts.map(shift => [
      shift, D.shiftMinutes(state, day, shift)
    ])));
    const weekdays = days.map(day => D.weekday(day));
    const calendarWeeks = days.map(D.calendarWeekBounds);
    const needed = days.map(day => D.tiihRequired(state, day));
    const nurses = state.nurses.map(nurse => {
      const work = Array(days.length).fill(null);
      const editable = [], oldPhase = [], available = [], initialLoads = {};

      for (const y of years) {
        const period = days.slice(priorDays, endIndex + 1).filter(d => d.startsWith(y));
        const credits = D.creditMinutes(state, nurse.id, y+"-01-01", period.at(-1));
        initialLoads[y] = credits;
        for (const [day, assignments] of Object.entries(state.assignments)) {
          const shift = assignments[nurse.id]?.shift;
          if (shift && shift !== "-" && day.startsWith(y) && day < period[0] && D.isActive(nurse,day) &&
              !D.absentFor(state, nurse.id, day, shift))
            initialLoads[y] += D.shiftMinutes(state, day, shift);
        }
      }
      const historicalShifts = {J:0, N:0};
      const known = [];
      days.forEach((day, i) => {
        const old = state.assignments[day]?.[nurse.id];
        const reviewed = state.reviewed[day]?.includes(nurse.id);
        editable[i] = active[i] && day >= start && day <= horizon && !old?.locked && !old?.confirmed &&
          (day <= end || reopen.has(i) || (!reviewed && !old));
        known[i] = active[i] && (editable[i] || reviewed || Boolean(old));
        const phase = state.phases[day]?.[nurse.id];
        oldPhase[i] = active[i] && phase && (day < start || (day > end && !reopen.has(i)) || phase.locked)
          ? (phase.mode === "N" ? phase.age : -phase.age) : null;
        if (!editable[i] && old?.shift && old.shift !== "-") {
          work[i] = old.shift;
          if (day >= start && day <= horizon) initialLoads[day.slice(0,4)] += shiftMinutes[i][old.shift];
        }
        available[i] = Object.fromEntries(shifts.map(code => [code, active[i] && !D.absentFor(state,nurse.id,day,code)]));
      });
      return {id:nurse.id, person:nurse, active, quotas, work, editable, known, oldPhase, available, initialLoads, historicalShifts};
    });
    // First try to repair vacancies in a saved forecast without disturbing
    // other work. If this fails, only the surrounding forecast week may reopen.
    const timing = {shiftIntervals, restIntervals, calendarWeeks, weekdays};
    const repairDates=new Set();
    for (let i=monthEnd+1; i<=endIndex; i++) {
      const day=days[i], row=state.assignments[day] || {};
      if (!Object.keys(row).length || reopen.has(i)) continue;
      const missing=shifts.some(code=>(code!=="T" || needed[i]) && !nurses.some(n=>n.work[i]===code));
      const incompatible=nurses.filter(n=>n.work[i] && (!n.available[i][n.work[i]] || !legalDay(timing,n,i)));
      if (!missing && !incompatible.length) continue;
      for (let j=Math.max(i-7,monthEnd+1); j<=Math.min(i+7,endIndex); j++) repairDates.add(j);
      for (const n of incompatible) {
        if (n.work[i]!=="T" || !n.active[i] || row[n.id].locked || row[n.id].confirmed) continue;
        n.initialLoads[day.slice(0,4)]-=shiftMinutes[i][n.work[i]];
        n.work[i]=null;
        n.editable[i]=true;
      }
      for (const n of nurses) {
        const entry=row[n.id];
        if (n.active[i] && entry?.shift==="-" && !entry.locked && !entry.confirmed) n.editable[i]=true;
      }
    }
    const tasks = [];
    let impossible = null;
    for (const n of nurses) {
      for (let first=priorDays-4; first<=endIndex; first++) {
        if (n.work[first] && n.work[first+1] && n.work[first+2] &&
            [first+3,first+4].some(j=>j>=priorDays && n.work[j]))
          return {repairDates,impossible:n.person.name+" : deux jours de repos obligatoires après les trois prises de poste du "+
            days[first]+" au "+days[first+2]+". Une affectation enregistrée empêche ce repos."};
      }
    }
    for (let i=priorDays; i<=endIndex; i++) {
      if (needed[i]) {
        const [begin,finish]=shiftIntervals[i].T;
        const monday=calendarWeeks[i][1];
        if (finish-begin>workLimit)
          return {impossible:"La durée réelle du TIIH du "+days[i]+" dépasse à elle seule le plafond de 48 h sur 168 h."};
        if (Math.max(Math.min(monday,finish)-begin,finish-monday)>44*60)
          return {impossible:"Le TIIH du "+days[i]+" dépasse à lui seul 44 h dans une semaine du lundi au dimanche."};
      }
      for (const code of shifts) {
        const need = code !== "T" || needed[i];
        const owners = nurses.filter(n => n.work[i] === code);
        if (owners.length > Number(need) || owners.some(n => !n.available[i][code])) {
          impossible = "Une affectation protégée est incompatible avec la couverture ou une absence le "+days[i]+".";
        }
        if (!need) continue;
        // The mandatory weekend units are Fri/Sat/Sun for N and Sat/Sun for J.
        // Check saved members of a unit across month boundaries, even if the
        // beginning of that unit predates the generated interval.
        const groupStart = code === "N" ? 4 : 5;
        const anchor = weekdays[i] >= groupStart ? i-(weekdays[i]-groupStart) : i;
        const groupEnd = weekdays[i] >= groupStart ? anchor+6-groupStart : i;
        if (i !== Math.max(priorDays,anchor)) continue;
        const group=Array.from({length:groupEnd-anchor+1},(_,offset)=>anchor+offset);
        const indices=group.filter(j=>j>=priorDays && j<=endIndex);
        if (code === "T" && group.some(j=>!needed[j]))
          impossible = "Un TIIH de week-end doit pouvoir être couvert au même poste samedi et dimanche.";
        const fixed = nurses.filter(n => group.some(j => n.work[j] === code));
        if (fixed.length > 1) impossible = "Plusieurs IDE sont protégées pour le même bloc de week-end du "+days[anchor]+".";
        const candidates = nurses.filter(n => (!fixed.length || n === fixed[0]) && group.every(j => {
          const openBoundary = (j<priorDays || j>endIndex) && !n.known[j];
          return n.available[j][code] && (n.work[j]===code || (!n.work[j] && (n.editable[j] || openBoundary)));
        }));
        if (!candidates.length) impossible = "Aucune IDE disponible pour "+D.SHIFT_LABELS[code]+" le "+days[i]+".";
        if (!indices.every(j => fixed[0]?.work[j] === code))
          tasks.push({i, code, indices, candidates});
      }
      if (weekdays[i] === 6 && i > priorDays && needed[i] !== needed[i-1])
        impossible = "Le TIIH du week-end doit être couvert samedi et dimanche ensemble.";
    }
    const ctx={days,start,end,horizon,endIndex,monthEnd,nurses,tasks,needed,shiftMinutes,shiftIntervals,restIntervals,calendarWeeks,weekdays,impossible,repairDates};
    if (!impossible) setWorkTargets(state,D,ctx);
    return ctx;
  }

  // A positive age is a night regime, a negative age a day regime. Work backwards
  // to choose a legal trajectory that also reaches any known future regime.
  function trajectory(nurse, days, phaseBounds, preferredLength, offset, nightFirst, anchor) {
    const max=Math.max(phaseBounds.J.max,phaseBounds.N.max);
    const size = max * 2;
    let nextCosts = new Float64Array(size);
    const links = new Int16Array(size * days.length);
    const firstDay = Math.round(Date.parse(days[0]+"T00:00:00Z")/86400000);
    let firstState;
    for (let i=days.length-1; i>=0; i--) {
      const costs = new Float64Array(size).fill(Infinity);
      const position = firstDay+i-anchor+offset;
      const preferredAge = ((position % preferredLength)+preferredLength)%preferredLength+1;
      const preferredNight = Math.abs(Math.floor(position/preferredLength)%2) === Number(nightFirst);
      const requiredMode = nurse.work[i] ? nurse.work[i]==="N" : null;
      for (let k=0; k<size; k++) {
        const night = k>=max, age = k%max+1;
        const bounds=night ? phaseBounds.N : phaseBounds.J;
        if (age>bounds.max) continue;
        if (nurse.person.active_from===days[i] && !nurse.oldPhase[i] && age!==1) continue;
        if ((requiredMode !== null && requiredMode !== night) ||
            (nurse.oldPhase[i] !== null && nurse.oldPhase[i] !== (night?age:-age))) continue;
        let cost=0, to=-1;
        if (i < days.length-1) {
          cost=Infinity;
          if (age < bounds.max) {cost=nextCosts[k+1]; to=k+1;}
          const switched = night ? 0 : max;
          if (age >= bounds.min && nextCosts[switched] < cost) {cost=nextCosts[switched]; to=switched;}
        }
        costs[k] = cost + (preferredNight===night ? 0 : 5) + Math.abs(preferredAge-age)*0.02;
        links[i*size+k] = to;
      }
      nextCosts=costs;
      if (i===0) {
        const best=Math.min(...costs);
        if (!Number.isFinite(best)) return null;
        firstState=costs.indexOf(best);
      }
    }
    const phases=[];
    let k=firstState;
    for (let i=0; i<days.length; i++) {
      phases[i] = k >= max ? k%max+1 : -(k%max+1);
      k=links[i*size+k];
    }
    return phases;
  }

  // Only rolling windows containing this new shift can get worse. The sum of
  // elapsed working minutes reaches a maximum at an interval endpoint or its
  // translation by 168 hours, including weeks with a clock change.
  function withinWeeklyLimit(ctx, work, i) {
    const [ownStart,ownEnd] = ctx.shiftIntervals[i][work[i]];
    const nearby=[];
    let total=0;
    for (let j=Math.max(0,i-priorDays); j<=Math.min(work.length-1,i+priorDays); j++) {
      if (!work[j]) continue;
      const span=ctx.shiftIntervals[j][work[j]];
      if (span[0] >= ownEnd + weeklyMinutes || span[1] <= ownStart - weeklyMinutes) continue;
      nearby.push(span);
      total+=span[1]-span[0];
    }
    if (total<=workLimit) return true;
    for (const [a,b] of nearby) for (const left of [a,b,a-weeklyMinutes,b-weeklyMinutes]) {
      const right=left+weeklyMinutes;
      if (right<=ownStart || left>=ownEnd) continue;
      let sum=0;
      for (const [start,end] of nearby) {
        sum+=Math.max(0,Math.min(right,end)-Math.max(left,start));
        if (sum>workLimit) return false;
      }
    }
    return true;
  }

  function withinCalendarWeek(ctx, work, i, index) {
    const [left,right] = ctx.calendarWeeks[index];
    let total=0;
    for (let j=Math.max(0,i-priorDays); j<=Math.min(work.length-1,i+priorDays); j++) {
      if (!work[j]) continue;
      const [begin,finish]=ctx.shiftIntervals[j][work[j]];
      total+=Math.max(0,Math.min(finish,right)-Math.max(begin,left));
    }
    return total<=44*60;
  }

  const dayShift = shift => shift === "J" || shift === "T";

  function legalDay(ctx, nurse, i) {
    const work=nurse.work;
    const [start,end]=ctx.restIntervals[i][work[i]];
    // A long TIIH can finish after a date without an assignment.
    for (let j=Math.max(0,i-3); j<i; j++)
      if (work[j] && start-ctx.restIntervals[j][work[j]][1]<720) return false;
    for (let j=i+1; j<=Math.min(work.length-1,i+3); j++)
      if (work[j] && ctx.restIntervals[j][work[j]][0]-end<720) return false;
    for (let first=Math.max(0,i-4); first<=i; first++)
      if (work[first] && work[first+1] && work[first+2] &&
          (work[first+3] || work[first+4])) return false;
    const weekday=ctx.weekdays[i];
    if ((weekday===0 && dayShift(work[i]) && work[i-1]) ||
        (weekday===6 && dayShift(work[i+1]))) return false;
    if (!withinCalendarWeek(ctx,work,i,i)) return false;
    if (ctx.shiftIntervals[i][work[i]][1]>ctx.calendarWeeks[i][1] &&
        !withinCalendarWeek(ctx,work,i,i+7-weekday))
      return false;
    return withinWeeklyLimit(ctx, work, i);
  }

  // A preference on Friday's J helps reserve the same nurse for Saturday and
  // Sunday. Saturday's actual assignment remains free if the trio is infeasible.
  function canExtendFriday(ctx, nurse, i) {
    for (const j of [i+1,i+2]) {
      if (nurse.phases[j]>0 || !nurse.available[j].J ||
          (nurse.work[j]!=="J" && (!nurse.editable[j] || nurse.work[j]))) return false;
      if (ctx.nurses.some(other=>other!==nurse && other.work[j]==="J")) return false;
    }
    const previous=nurse.work.slice(i,i+3);
    nurse.work.fill("J",i,i+3);
    const legal=[i,i+1,i+2].every(j=>legalDay(ctx,nurse,j));
    nurse.work.splice(i,3,...previous);
    return legal;
  }

  // Try the regular 2 + 2 + 3 weekday pattern first. A grouped trial may fail
  // on a locked shift, a regime boundary or an absence. Independent searches
  // with partially grouped and ungrouped shifts explore other arrangements.
  function groupPreferredSeries(ctx, slots, attempt) {
    const pattern=attempt%8;
    if (pattern===7) return slots;
    const buckets=new Map();
    for(const slot of slots) {
      const {i,code}=slot;
      const weekday=ctx.weekdays[i];
      let first=i;
      if(code==="N" && pattern!==5 && pattern!==6 && weekday<4)
        first=i-weekday%2;
      if(code==="J") {
        if (weekday>=4 && pattern!==6) first=i-(weekday-4);
        else if (weekday<4 && pattern<=3) first=i-weekday%2;
      }
      const key=code+":"+first;
      if (!buckets.has(key)) buckets.set(key,[]);
      buckets.get(key).push(slot);
    }
    const grouped=[];
    for(const group of buckets.values()) {
      if(group.length===1) {grouped.push(group[0]);continue;}
      const candidates=group[0].candidates.filter(n=>group.every(s=>s.candidates.includes(n)));
      if(candidates.length) grouped.push({i:group[0].i,code:group[0].code,
        indices:group.flatMap(s=>s.indices),candidates});
      else grouped.push(...group);
    }
    return grouped;
  }

  function search(ctx, state, D, random, attempt, deadline) {
    const {nurses,days,tasks} = ctx;
    const settings=state.settings;
    const order=nurses.filter(n=>n.active.slice(priorDays,ctx.endIndex+1).some(Boolean));
    for (let i=order.length-1;i>0;i--) {
      const j=Math.floor(random()*(i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }
    const length = attempt%4 === 0 && settings.phase_min<=14 && settings.phase_max>=14 ?
      14 : settings.phase_target;
    const anchor=10959; // Monday, 3 January 2000.
    const phaseMap=new Map();
    const phaseBounds={J:D.phaseBounds(settings,"J"),N:D.phaseBounds(settings,"N")};
    for (let pos=0; pos<order.length; pos++) {
      const n=order[pos];
      n.loads={...n.initialLoads};
      n.counts={...n.historicalShifts};
      for(let i=priorDays;i<=ctx.monthEnd;i++)
        if (n.work[i]==="J" || n.work[i]==="N") n.counts[n.work[i]]++;
      const stagger=attempt%4===0 ? 0 : (attempt%4===1 ? (pos%3)*5 : Math.floor(random()*length));
      n.phases=trajectory(n,days,phaseBounds,length,stagger,pos%2===0,anchor);
      if (!n.phases) return null;
      phaseMap.set(n.id,n.phases);
    }
    const rawSlots=tasks.map(t=>({...t, candidates:t.candidates.filter(n =>
      t.indices.every(j => (n.phases[j]>0)===(t.code==="N")))}));
    if (rawSlots.some(t=>!t.candidates.length)) return null;
    const slots=groupPreferredSeries(ctx,rawSlots,attempt);
    slots.sort((a,b)=>a.i-b.i || a.candidates.length-b.candidates.length);
    let nodes=0;
    function visit(k) {
      if (k===slots.length) return true;
      if (++nodes>900 || ((nodes&31)===0 && now()>deadline)) return false;
      const {code,indices,candidates,i}=slots[k];
      const year=days[i].slice(0,4);
      const ranked=[];
      for (const n of candidates) {
        if (indices.some(j => n.work[j] && n.work[j]!==code)) continue;
        const changed=indices.filter(j=>!n.work[j]);
        for (const j of changed) n.work[j]=code;
        const legal=indices.every(j=>legalDay(ctx,n,j));
        for (const j of changed) n.work[j]=null;
        if (!legal) continue;
        let cost=n.loads[year]-n.targetAt[i];
        // The same assignment represents a larger fraction of a short
        // contract, including when a temporary percentage begins mid-series.
        for (const j of changed) cost+=ctx.shiftMinutes[j][code]*(100/n.quotas[j]-1)*0.5;
        if(code==="J" || code==="N") cost+=1080*(n.counts[code]-n.expectedCount[i]);
        const inSameSeries=code==="N" ? (shift=>shift==="N") : dayShift;
        if(inSameSeries(n.work[i-1]) || inSameSeries(n.work[indices.at(-1)+1])) cost-=1600;
        if(code==="J" && ctx.weekdays[i]===4 && canExtendFriday(ctx,n,i)) cost-=1150;
        if(code==="J" && ctx.weekdays[i]===5 && n.work[i-1]==="J") cost-=2300;
        cost+=random()*900;
        ranked.push({n,changed,cost});
      }
      ranked.sort((a,b)=>a.cost-b.cost);
      for (const {n,changed} of ranked) {
        for (const j of changed) {
          n.work[j]=code;
          n.loads[days[j].slice(0,4)] += ctx.shiftMinutes[j][code];
          if(j<=ctx.monthEnd && code!=="T") n.counts[code]++;
        }
        if (visit(k+1)) return true;
        for (const j of changed) {
          n.work[j]=null;
          n.loads[days[j].slice(0,4)] -= ctx.shiftMinutes[j][code];
          if(j<=ctx.monthEnd && code!=="T") n.counts[code]--;
        }
      }
      return false;
    }
    if (!visit(0)) return null;
    let isolated=0, isolatedDays=0, skippedFriday=0;
    const candidate=JSON.parse(JSON.stringify(state));
    for(let i=priorDays;i<=ctx.endIndex;i++) {
      const day=days[i];
      candidate.assignments[day]??={};
      candidate.phases[day]??={};
      candidate.reviewed[day]??=[];
      for(const n of nurses) {
        if (!n.active[i]) continue;
        if (i<=ctx.monthEnd && n.work[i]) {
          if (n.work[i]==="N" && n.work[i-1]!=="N" && n.work[i+1]!=="N") isolated++;
          if (dayShift(n.work[i]) && !dayShift(n.work[i-1]) && !dayShift(n.work[i+1])) isolatedDays++;
          if (ctx.weekdays[i]===5 && n.work[i]==="J" && n.work[i-1]!=="J") skippedFriday++;
        }
        if (n.editable[i]) {
          candidate.assignments[day][n.id]={shift:n.work[i]||"-",locked:false,confirmed:false};
          if (!candidate.reviewed[day].includes(n.id)) candidate.reviewed[day].push(n.id);
        }
        if(!n.oldPhase[i]) {
          const phase=phaseMap.get(n.id)[i];
          candidate.phases[day][n.id]={mode:phase>0?"N":"J",age:Math.abs(phase),locked:false};
        }
      }
    }
    // Restore the working arrays between independent search attempts.
    for(const n of nurses) for(let i=priorDays;i<=ctx.endIndex;i++) if(n.editable[i]) n.work[i]=null;
    for(const day of days.slice(priorDays,ctx.endIndex+1)) {
      if(!candidate.reviewed[day].length) delete candidate.reviewed[day];
    }
    const balance=Object.keys(order[0].loads).reduce((sum,year)=>{
      const loads=order.filter(n=>days.some((day,i)=>i>=priorDays && i<=ctx.endIndex &&
        day.startsWith(year) && n.active[i])).map(n=>n.loads[year]-n.workTargets[year]);
      return sum+Math.max(...loads)-Math.min(...loads);
    },0);
    let shiftImbalance=0;
    for(const code of ["J","N"]) {
      const counts=order.filter(n=>n.countTarget>0).map(n=>n.counts[code]-n.countTarget);
      const average=counts.reduce((sum,count)=>sum+count,0)/counts.length;
      shiftImbalance+=counts.reduce((sum,count)=>sum+(count-average)**2,0);
    }
    const score=shiftImbalance*180 + balance*0.2 + (isolated+isolatedDays)*320 + skippedFriday*520;
    return {candidate,isolated,isolatedDays,score};
  }

  function generate(state, year, month, {timeLimitMs=1800, seed=Date.now(), includeLookahead=false}={}) {
    const D=globalThis.PlannerDomain;
    const forecast=includeLookahead===true;
    const deadline=now()+Math.max(100,Math.min(15000,Number(timeLimitMs)||1800));
    let ctx;
    try { ctx=prepare(state,year,month,D,forecast); }
    catch(e) {return result("invalid_input",String(e.message||e));}
    const random=randomGenerator(seed);
    let best=null, repaired=false;
    for(let stage=0;stage<=1;stage++) {
      const retry=stage===0 && ctx.repairDates?.size;
      const stop=retry?now()+(deadline-now())*0.4:deadline;
      if (ctx.impossible && !retry) return result("infeasible",ctx.impossible);
      let firstSuccess=null;
      for(let attempt=0;!ctx.impossible && attempt<250 && now()<stop;attempt++) {
        if(firstSuccess!==null && now()-firstSuccess>950) break;
        const found=search(ctx,state,D,random,attempt,stop);
        if (!found || (best && found.score>=best.score)) continue;
        const issues=D.validateSchedule(found.candidate,ctx.start,ctx.horizon);
        if(issues.some(issue=>issue.severity==="error")) continue;
        best=found;
        firstSuccess??=now();
      }
      if (best || !retry) break;
      ctx=prepare(state,year,month,D,forecast,ctx.repairDates);
      repaired=true;
    }
    if (!best) return result("unknown","Aucune proposition trouvée dans le temps de recherche. Vérifiez les absences, les postes protégés et les besoins TIIH. Vous pouvez relancer la recherche.");
    let message="Proposition contrôlée du "+ctx.start+" au "+ctx.end+".";
    if (forecast) message="Proposition contrôlée, avec anticipation jusqu’au "+ctx.horizon+".";
    if (repaired) message+=" Des affectations prévisionnelles autour des dates en conflit ont été recalculées.";
    return {...result("feasible",message,
      best.candidate,ctx.horizon,best.isolated), isolatedDays:best.isolatedDays};
  }
  globalThis.PlannerEngine=Object.freeze({generate});
})();

</script>
<script>
/* Import the monthly attendance grid. JSON remains the full-fidelity backup. */
(() => {
  "use strict";

  function readRows(text, separator) {
    const rows = [];
    let row = [], field = "", quoted = false, closing = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c !== '"') field += c;
        else if (text[i + 1] === '"') { field += '"'; i++; }
        else { quoted = false; closing = true; }
        continue;
      }
      if (c === separator || c === "\r" || c === "\n") {
        row.push(field);
        field = ""; closing = false;
        if (c !== separator) {
          if (row.some(value => value !== "")) rows.push(row);
          row = [];
          if (c === "\r" && text[i + 1] === "\n") i++;
        }
      } else if (c === '"' && !field && !closing) {
        quoted = true;
      } else {
        if (closing || c === '"') throw Error("Guillemets incorrects dans le CSV.");
        field += c;
      }
    }
    if (quoted) throw Error("Guillemets non fermés dans le CSV.");
    row.push(field);
    if (row.some(value => value !== "")) rows.push(row);
    return rows;
  }

  function shiftLabel(state, day, code, label) {
    if (code !== "T") return label;
    const minutes = globalThis.PlannerDomain.shiftMinutes(state,day,code);
    const duration = Math.floor(minutes / 60) + ":" + String(minutes % 60).padStart(2,"0");
    return "TIIH (" + duration + ")";
  }

  function toLegacyFile(file) {
    const text = file.content.replace(/^\uFEFF/, "");
    const delimiter = /^(?:"IDE"|IDE)([;,])/i.exec(text)?.[1];
    if (!delimiter) throw Error(file.name + " : le CSV mensuel doit commencer par IDE puis les dates AAAA-MM-JJ.");
    const [header, ...rows] = readRows(text, delimiter);
    const days = header.slice(1);
    const month = days[0]?.slice(0, 7);
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month) || !rows.length)
      throw Error(file.name + " : choisissez un CSV mensuel de planning contenant des IDE et des dates.");
    const last = globalThis.PlannerDomain.monthBounds(Number(month.slice(0, 4)), Number(month.slice(5)))[1];
    const validDays = new Set(globalThis.PlannerDomain.dates(month + "-01", last));
    if (days.some(day => !validDays.has(day)) || new Set(days).size !== days.length)
      throw Error(file.name + " : chaque colonne doit porter une date distincte du même mois.");

    const result = Object.create(null), missingAbsences = [];
    const labels = new Map([["J","J"],["SMUR J","J"],["N","N"],["SMUR N","N"],
      ["T","T"],["TIIH","T"],["REPOS","-"],["-","-"],["'-","-"]]);
    for (const [index, row] of rows.entries()) {
      if (row.length !== header.length)
        throw Error(file.name + " : nombre de colonnes incorrect à la ligne " + (index + 2) + ".");
      // The exporter protects formula-like fields for spreadsheet software.
      const name = row[0].replace(/^'(?=\s*[=+@-])/, "").trim();
      if (!name || Object.hasOwn(result, name)) throw Error(file.name + " : nom d’IDE vide ou en double.");
      const entries = result[name] = Object.create(null);
      days.forEach((day, column) => {
        const label = row[column+1].trim().toUpperCase();
        if (["","NON RENSEIGNÉ","INCONNU","À RENSEIGNER","HORS EFFECTIF"].includes(label)) return;
        if (label === "ABSENCE") { missingAbsences.push(name + " · " + day); return; }
        // The history importer checks explicit durations and rejects conflicting
        // records across files. Older exports carry only the shift code.
        const value = /^TIIH \(\d{1,2}:[0-5]\d\)$/.test(label) ? label : labels.get(label);
        if (!value) throw Error(file.name + " : poste non reconnu pour " + name + " le " + day + " (« " + row[column+1] + " »).");
        entries[String(Number(day.slice(-2)))] = value;
      });
    }
    const warnings = [];
    if (missingAbsences.length) {
      warnings.push(file.name + " · " + missingAbsences.length + " case(s) Absence sans horaires ni crédit : " +
        missingAbsences.slice(0, 7).join(", ") + (missingAbsences.length > 7 ? "…" : "") +
        ". Elles restent à renseigner dans Absences. La sauvegarde JSON complète conserve ces informations.");
    }
    if (!Object.values(result).some(row => Object.keys(row).length))
      throw Error(file.name + " : le CSV ne contient aucun poste ni repos renseigné. Utilisez une sauvegarde JSON pour reprendre les absences.");
    return {name: "planning_" + month.replace("-", "_") + ".json", content: JSON.stringify(result), warnings};
  }
  globalThis.PlannerCSV = Object.freeze({toLegacyFile,shiftLabel});
})();

</script>
<script>
/* Staffing dates and temporary contract percentages for the offline planner. */
(() => {
  "use strict";
  const D = globalThis.PlannerDomain;
  const escape = value => String(value ?? "").replace(/[&<>"']/g,
    ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
  const dateLabel = date => date ? date.split("-").reverse().join("/") : "—";
  const button = (command, label, data = "", css = "") =>
    '<button type="button" class="'+css+'" data-act="team-manage" data-command="'+command+'" '+data+'>'+label+'</button>';
  const attr = (key, val) => 'data-'+key+'="'+escape(val)+'"';

  function view(state, {day}) {
    const nurses = state.nurses;
    const dated = nurses.filter(n => n.active_from || n.active_until);
    const periods = nurses.flatMap(n => (n.quota_periods || []).map(p => ({n,p})))
      .sort((a,b) => a.p.from.localeCompare(b.p.from) || a.n.name.localeCompare(b.n.name,"fr"));
    const staffingTable = dated.length ? '<div class="scroll"><table><thead><tr><th>Agent</th><th>Entrée</th><th>Dernier jour inclus</th><th>Départ</th></tr></thead><tbody>'+
      dated.map(n => '<tr><th scope="row">'+escape(n.name)+'</th><td>'+dateLabel(n.active_from)+'</td><td>'+dateLabel(n.active_until)+'</td><td>'+
        (n.active_until ? button("return","Annuler le départ",attr("id",n.id),"mini") : "—")+'</td></tr>').join("")+
      '</tbody></table></div>' : "";
    const periodTable = periods.length ? '<div class="scroll"><table><thead><tr><th>Agent</th><th>Du</th><th>Au inclus</th><th>Quotité</th><th>Actions</th></tr></thead><tbody>'+
      periods.map(({n,p}) => {
        const target = attr("id",n.id)+" "+attr("period",p.id);
        return '<tr><th scope="row">'+escape(n.name)+'</th><td>'+dateLabel(p.from)+'</td><td>'+dateLabel(p.to)+'</td><td>'+p.percent+' %</td><td><div class="actions">'+
          button("period","Modifier",target,"mini")+button("delete-period","Supprimer",target,"mini")+'</div></td></tr>';
      }).join("")+'</tbody></table></div>' : "";
    return '<div class="cols"><section class="panel"><h2>Effectif</h2><p class="hint">'+
      nurses.filter(n=>D.isActive(n,day)).length+' agent(s) en poste au '+dateLabel(day)+'.</p><div class="actions">'+
      button("add","Ajouter un agent",attr("day",day),"primary")+
      (nurses.length ? button("exit","Retirer un agent",attr("day",day)) : "")+'</div>'+staffingTable+
      '</section><section class="panel"><h2>Quotités temporaires</h2><p class="hint">À la fin d’une période, la quotité de base en vigueur reprend automatiquement.</p>'+
      (nurses.length ? button("period","Ajouter une période",attr("day",day)) : "")+periodTable+'</section></div>';
  }

  function open(dialog, operation, title, body, submitLabel, attributes="") {
    dialog.innerHTML='<form data-form="team-management" data-operation="'+operation+'" '+attributes+
      '><h2 id="dialog-title">'+escape(title)+'</h2>'+body+'<p role="alert" class="issueerror"></p><div class="actions">'+
      '<button type="button" data-act="close">Annuler</button><button type="submit" class="primary">'+escape(submitLabel)+'</button></div></form>';
    if (!dialog.open) dialog.showModal();
  }
  function options(nurses, selected) {
    return nurses.map(n => '<option value="'+escape(n.id)+'"'+(n.id===selected?" selected":"")+'>'+escape(n.name)+'</option>').join("");
  }
  function dateField(label,name,value) {
    return '<label class="field">'+label+'<input required type="date" name="'+name+'" value="'+escape(value)+'"></label>';
  }
  function percentage(label,value) {
    return '<label class="field">'+label+'<input type="number" min="1" max="100" step="1" required name="percent" value="'+escape(value)+'" placeholder="80"></label>';
  }
  function action(element,{state,dialog}) {
    const {command,id,period,day} = element.dataset;
    const nurse = state.nurses.find(n=>n.id===id);
    const item = nurse?.quota_periods?.find(p=>p.id===period);
    const target = attr("id",id)+" "+attr("period",period);
    if (command==="add") {
      open(dialog,"add","Ajouter un agent",'<label class="field">Nom de l’agent<input required maxlength="90" name="name" autocomplete="off"></label>'+
        dateField("Date d’entrée dans l’équipe","from",day)+percentage("Quotité de base (%)",100),"Ajouter l’agent");
    } else if (command==="exit") {
      open(dialog,"exit-preview","Retirer un agent",'<label class="field">Agent<select required name="nurse">'+
        options(state.nurses)+'</select></label>'+dateField("Dernier jour dans l’équipe (inclus)","last",day),"Examiner le retrait");
    } else if (command==="return" && nurse) {
      open(dialog,"return","Annuler le départ de "+nurse.name+" ?",'<p>La fiche indique un dernier jour au '+dateLabel(nurse.active_until)+
        '. L’agent redeviendra disponible après cette date pour les prochaines générations.</p>',"Annuler ce départ",target);
    } else if (command==="period") {
      const who = item ? '<p>'+escape(nurse.name)+'</p>' :
        '<label class="field">Agent<select required name="nurse">'+options(state.nurses)+'</select></label>';
      open(dialog,"period",item?"Modifier la période":"Ajouter une période de quotité",who+
        dateField("Début inclus","from",item?.from||day)+dateField("Fin incluse","to",item?.to||"")+
        percentage("Quotité temporaire (%)",item?.percent??""),"Enregistrer la période",target);
    } else if (command==="delete-period" && item) {
      open(dialog,"delete-period","Supprimer cette période ?",'<p>'+escape(nurse.name)+' · '+item.percent+' % du '+dateLabel(item.from)+
        ' au '+dateLabel(item.to)+'. La quotité de base s’appliquera sur ces dates.</p>',"Supprimer la période",target);
    }
  }
  function affectedList(shifts) {
    if (!shifts.length) return "";
    return '<details><summary>Voir les postes concernés</summary><ul>'+shifts.map(a=>'<li>'+dateLabel(a.day)+' · '+
      escape(D.SHIFT_LABELS[a.shift])+'</li>').join("")+'</ul></details>';
  }
  function submit(form,{state,dialog,save}) {
    const operation = form.dataset.operation;
    const fields = new FormData(form);
    const get = key => String(fields.get(key)??"");
    const candidate = JSON.parse(JSON.stringify(state));
    const id = form.dataset.id || get("nurse");
    const nurse = candidate.nurses.find(n=>n.id===id);
    let message;
    switch(operation) {
      case "add":
        D.addNurse(candidate,{name:get("name").trim(),from:get("from"),percent:Number(get("percent"))});
        message="Agent ajouté à l’équipe."; break;
      case "exit-preview": {
        const last = get("last");
        const impact = D.nurseExitImpact(candidate,id,last);
        if (impact.protected.length) {
          const first = impact.protected[0];
          throw Error(impact.protected.length+' poste(s) confirmé(s) ou verrouillé(s) après cette sortie, dont '+
            D.SHIFT_LABELS[first.shift]+' le '+dateLabel(first.day)+'. Vérifiez ces postes ou choisissez un autre dernier jour.');
        }
        const count=impact.drafts.length;
        open(dialog,"exit","Confirmer le retrait de "+nurse.name+" ?",'<p>Dernier jour dans l’équipe : <strong>'+dateLabel(last)+
          '</strong>. Son historique jusqu’à cette date reste consultable.</p><p>'+count+' poste(s) de brouillon à réattribuer après le départ.</p>'+
          affectedList(impact.drafts),"Confirmer le retrait",attr("id",id)+" "+attr("last",last));
        return;
      }
      case "exit":
        D.setNurseExit(candidate,id,form.dataset.last);
        message="Départ enregistré. Le planning tient compte du dernier jour dans l’équipe."; break;
      case "return":
        D.setNurseExit(candidate,id,null);
        message="Départ annulé."; break;
      case "period": {
        const period={from:get("from"),to:get("to"),percent:Number(get("percent"))};
        if (form.dataset.period) period.id=form.dataset.period;
        D.setQuotaPeriod(nurse,period);
        message="Période de quotité enregistrée."; break;
      }
      case "delete-period":
        D.removeQuotaPeriod(nurse,form.dataset.period);
        message="Période supprimée. La quotité de base s’applique à ces dates."; break;
      default: throw Error("Action de gestion d’équipe inconnue.");
    }
    save(candidate,message);
    dialog.close();
  }
  globalThis.PlannerTeamManagement=Object.freeze({view,action,submit});
})();

</script>
<script>
/* Each submitted edit has its own immutable body, base revision and retry key. */
(() => {
  "use strict";
  function connect(run, {prepare, receive, canRefresh, active, changed, saved}) {
    let revision=null, phase="loading", error="", readVersion=0, reading=false, writing=false;
    const queue=[];
    const signal=(next,reason="")=>{phase=next; error=reason; changed();};
    function rpc(method,args=[]) {
      return new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>reject(Error("Google Sheets ne répond pas. Vérifiez la connexion puis réessayez.")),35000);
        const ok=value=>{clearTimeout(timer);resolve(value);};
        const fail=problem=>{clearTimeout(timer);reject(Error(problem?.message || "La connexion à Google Sheets a échoué."));};
        try {run.withSuccessHandler(ok).withFailureHandler(fail)[method](...args);}
        catch(e) {fail(e);}
      });
    }
    function readRecord(data) {
      if(!data || !Number.isSafeInteger(data.revision) || data.revision<0 ||
          !(typeof data.body==="string" || data.revision===0 && data.body===null))
        throw Error("Réponse de lecture Google Sheets invalide.");
      return prepare(data.body);
    }
    async function read({force=false,discard=false}={}) {
      if(!active() || writing || queue.length && !discard || !force && (reading || !canRefresh())) return;
      const attempt=++readVersion;
      reading=true;
      if(force) signal(discard?"reloading":"loading");
      try {
        const data=await rpc("readPlanning");
        if(attempt!==readVersion || !active()) return;
        if(!force && !canRefresh()) return;
        if(!force && data?.revision===revision && phase!=="read-error" && phase!=="refresh-error") return;
        const model=readRecord(data);
        if(discard) queue.length=0;
        revision=data.revision;
        signal(data.body===null?"empty":"ready");
        receive(model);
      } catch(e) {
        if(attempt===readVersion && active()) signal(queue.length?"conflict":force?"read-error":"refresh-error",e.message);
      } finally {
        if(attempt===readVersion) reading=false;
      }
    }
    async function drain() {
      if(writing || !queue.length) return;
      writing=true;
      try {
        signal("saving");
        while(queue.length) {
          const job=queue[0];
          if(job.base===null) job.base=revision;
          const result=await rpc("writePlanning",[job.base,job.body,job.id]);
          if(result?.ok===false && result.conflict===true) {
            signal("conflict","Une autre fenêtre a enregistré une version plus récente.");
            return;
          }
          if(result?.ok!==true || !Number.isSafeInteger(result.revision) || result.revision!==job.base+1)
            throw Error("Confirmation d’enregistrement Google Sheets invalide.");
          queue.shift();
          revision=result.revision;
          if(!queue.length) {signal("saved"); saved(job.message,typeof result.viewWarning==="string"?result.viewWarning:"");}
        }
      } catch(e) { signal("write-error",e.message); }
      finally {writing=false;}
    }
    function enqueue(body,message) {
      if(revision===null || phase==="reloading" || phase==="loading" || phase==="read-error") throw Error("Attendez le chargement du planning partagé avant d’enregistrer.");
      const id=globalThis.crypto.randomUUID?.() ?? Array.from(globalThis.crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,"0")).join("");
      readVersion++; reading=false;
      queue.push({id,body,message,base:null});
      if(phase!=="conflict" && phase!=="write-error") void drain();
      else changed();
    }
    return Object.freeze({
      read, enqueue, retry:drain,
      get phase(){return phase;}, get error(){return error;},
      get pending(){return queue.length>0;}, get revision(){return revision;}
    });
  }
  globalThis.PlannerSheetsSync=Object.freeze({connect});
})();

</script>
<script>
/* Reassign the roles of one civil date as a single change, including swaps. */
(() => {
  "use strict";
  const D = globalThis.PlannerDomain;
  const roles = ["J","N","T"];
  const owners = (row,role) => Object.keys(row).filter(id=>row[id].shift===role);
  const protectedCell = cell => cell?.locked || cell?.confirmed;

  function edit(state,day,choices,lock) {
    const old = state.assignments[day] || {}, next = {...old}, wanted = new Map();
    for (const role of roles) {
      const prior = owners(old,role);
      const value = choices[role] ?? "keep";
      let ids = prior;
      if (value!=="keep") {
        if (value!=="vacant" && !value.startsWith("id:")) throw Error("Titulaire non reconnu.");
        ids = value==="vacant" ? [] : [value.slice(3)];
      }
      for (const id of ids) {
        if (wanted.has(id)) throw Error("Une IDE ne peut pas occuper deux postes à la même date. Vérifiez les titulaires.");
        wanted.set(id,role);
        if (old[id]?.shift===role) continue;
        const nurse = state.nurses.find(n=>n.id===id);
        if (!nurse || !D.isActive(nurse,day)) throw Error("L’IDE doit faire partie de l’effectif à cette date.");
        if (role==="T" && !D.tiihRequired(state,day)) throw Error("Le TIIH est fermé à cette date.");
        if (D.absentFor(state,id,day,role)) throw Error(nurse.name+" est en absence pendant ce poste.");
      }
    }
    const changes = [];
    for (const id of new Set([...Object.keys(old),...wanted.keys()])) {
      const before = old[id]?.shift || "-", after = wanted.get(id) || "-";
      if (before===after) continue;
      const nurse = state.nurses.find(n=>n.id===id);
      if (protectedCell(old[id])) throw Error("La case de "+nurse.name+" est verrouillée ou confirmée. Retirez sa protection dans sa fiche pour la modifier.");
      next[id]={shift:after,locked:lock,confirmed:false};
      changes.push({id,name:nurse.name,before,after});
    }
    if (!changes.length) return {candidate:state,changes};
    const reviewed = [...new Set([...(state.reviewed[day]||[]),...changes.map(c=>c.id)])];
    return {changes,candidate:{...state,assignments:{...state.assignments,[day]:next},
      reviewed:{...state.reviewed,[day]:reviewed}}};
  }
  globalThis.PlannerDayEditor=Object.freeze({edit,owners,protectedCell});
})();

</script>

      const glyph=this.stream("",advance+" 0 "+box+" d1\nq "+num(w/em)+" 0 0 "+num(h/em)+" "+num(left/em)+" "+num(lower)+" cm /I Do Q");
      const map=this.stream("","/CIDInit /ProcSet findresource begin\n12 dict begin\nbegincmap\n/CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def\n/CMapName /LocalUnicode def\n/CMapType 2 def\n1 begincodespacerange\n<01> <01>\nendcodespacerange\n1 beginbfchar\n<01> <"+unicodeHex(text)+">\nendbfchar\nendcmap\nCMapName currentdict /CMap defineresource pop\nend end");
      const id=this.object("<< /Type /Font /Subtype /Type3 /FontBBox ["+box+"] /FontMatrix [1 0 0 1 0 0] /FirstChar 1 /LastChar 1 /Widths ["+advance+"] /Encoding << /Type /Encoding /Differences [1 /G] >> /CharProcs << /G "+glyph+" 0 R >> /Resources << /XObject << /I "+image+" 0 R >> >> /ToUnicode "+map+" 0 R >>");
      this.unicode.set(key,id);return id;
    }
    blob(pages) {
      const ids=pages.map(p=>{
        const content=this.stream("",p.ops.join("\n"));
        const fonts=["/F1 "+this.reg+" 0 R","/F2 "+this.bold+" 0 R",...[...p.extra].map(id=>"/U"+id+" "+id+" 0 R")];
        return this.object("<< /Type /Page /Parent "+this.tree+" 0 R /MediaBox [0 0 "+p.w+" "+p.h+"] /Resources << /Font << "+fonts.join(" ")+" >> >> /Contents "+content+" 0 R >>");
      });
      this.objects[this.tree-1]="<< /Type /Pages /Kids ["+ids.map(id=>id+" 0 R").join(" ")+"] /Count "+ids.length+" >>";
      this.objects[this.catalog-1]="<< /Type /Catalog /Pages "+this.tree+" 0 R /Lang (fr-FR) >>";
      const pieces=[],offsets=[0]; let pos=0;
      const put=value=>{const bytes=typeof value==="string"?byteText.encode(value):value;pieces.push(bytes);pos+=bytes.length;};
      put("%PDF-1.4\n%");put(new Uint8Array([226,227,207,211,10]));
      this.objects.forEach((obj,i)=>{offsets.push(pos);put((i+1)+" 0 obj\n");(Array.isArray(obj)?obj:[obj]).forEach(put);put("\nendobj\n");});
      const xref=pos;
      put("xref\n0 "+offsets.length+"\n0000000000 65535 f \n");
      offsets.slice(1).forEach(x=>put(String(x).padStart(10,"0")+" 00000 n \n"));
      put("trailer\n<< /Size "+offsets.length+" /Root "+this.catalog+" 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
      return new Blob(pieces,{type:"application/pdf"});
    }
  }
  class Page {
    constructor(pdf,size){this.pdf=pdf;[this.w,this.h]=size;this.ops=[];this.extra=new Set();}
    rect(x,y,w,h,fill){this.ops.push(rgb(fill)+" rg "+[x,this.h-y-h,w,h].map(num).join(" ")+" re f");}
    line(x1,y1,x2,y2,color=colors.line,weight=.45){
      this.ops.push(rgb(color)+" RG "+num(weight)+" w "+[x1,this.h-y1].map(num).join(" ")+" m "+[x2,this.h-y2].map(num).join(" ")+" l S");
    }
    text(raw,x,y,size,{bold=false,color=colors.ink,align="left"}={}){
      const text=clean(raw);if(!text) return;
      const width=this.pdf.width(text,size,bold);
      if(align==="center") x-=width/2;else if(align==="right") x-=width;
      let font=bold?"F2":"F1",bytes=winAnsi(text);
      if(bytes===null){const id=this.pdf.unicodeFont(text,bold);font="U"+id;this.extra.add(id);bytes="01";}
      this.ops.push("BT /"+font+" "+num(size)+" Tf "+rgb(color)+" rg 1 0 0 1 "+num(x)+" "+num(this.h-y)+" Tm <"+bytes+"> Tj ET");
    }
  }
  function wrap(pdf,text,maxWidth,size,bold=false) {
    const words=clean(text).trim().split(/\s+/),lines=[];let line="";
    for(const word of words) {
      const next=line?line+" "+word:word;
      if(pdf.width(next,size,bold)<=maxWidth){line=next;continue;}
      if(line){lines.push(line);line="";}
      for(const c of word) {
        if(line && pdf.width(line+c,size,bold)>maxWidth){lines.push(line);line="";}
        line+=c;
      }
    }
    if(line) lines.push(line);
    return lines.length?lines:[""];
  }
  function codeAt(state,n,d) {
    if(!D.isActive(n,d)) return "X";
    const a=state.assignments[d]?.[n.id];
    if(a && a.shift!=="-") return a.shift;
    if(D.absenceOn(state,n.id,d)) return "A";
    return a||state.reviewed[d]?.includes(n.id)?"R":"?";
  }
  function tiih(state,day) {
    const minutes=D.shiftMinutes(state,day,"T");
    const end=D.tiihWallEnd(day,minutes)-Date.parse(day+"T00:00:00Z")/60000;
    return {minutes,clock:hhmm(end%1440),offset:Math.floor(end/1440)};
  }
  function schedule(state,day,code) {
    if(code==="J") return "08:00 – 20:00";
    if(code==="N") return "20:00 – 08:00 le lendemain";
    if(code!=="T") return "—";
    const t=tiih(state,day);
    return "09:00 – "+t.clock+([""," le lendemain"," le surlendemain"][t.offset]||"");
  }
  function header(p,job,individual=false,annex=false) {
    const right=p.w-margin;
    p.text("PLANNING IDE   /   SMUR · TIIH",margin,31,8.5,{bold:true,color:colors.teal});
    const status=(job.demo?"Équipe fictive   ·   ":"")+(job.proposal?"Proposition à valider":"Planning enregistré");
    p.text(status,right,31,8.8,{align:"right",bold:true,color:colors.teal});
    const title=annex?"Nom complet de l’IDE":individual?(job.nameAnnex?"Planning individuel":job.person.name):job.monthName;
    const lines=wrap(p.pdf,title,right-margin-2,24,true);
    let y=63;
    for(const line of lines){p.text(line,margin,y,24,{bold:true});y+=27;}
    const subtitle=individual?(job.nameAnnex?job.monthName+(annex?"":"   /   Nom complet en fin de document"):"Planning individuel   /   "+job.monthName):"Planning d’équipe   /   "+job.roster.length+" IDE";
    p.text(subtitle,margin,y-10,10,{color:colors.muted});
    return y+7;
  }
  function footer(p,job,index,total) {
    p.line(margin,p.h-33,p.w-margin,p.h-33);
    p.text("Édité le "+job.stamp+"  ·  Heure de Paris",margin,p.h-18,7.9,{color:colors.muted});
    p.text("Page "+(index+1)+" / "+total,p.w-margin,p.h-18,7.9,{align:"right",color:colors.muted});
  }
  function teamLegend(p) {
    const y=p.h-66,left=margin;
    const items=[["J","SMUR jour  08:00–20:00"],["N","SMUR nuit  20:00–08:00 le lendemain"],["T","TIIH  09:00–16:42 par défaut"]];
    let x=left;
    for(const [k,t] of items) {
      p.rect(x,y-10,15,14,colors[k]);p.text(k,x+7.5,y,8.6,{align:"center",bold:true});
      p.text(t,x+20,y,8.2);x+=p.pdf.width(t,8.2)+40;
    }
    p.text("A   Absence      R   Repos      ?   Non renseigné      ×   Hors effectif      Colonnes grisées   Samedi / dimanche",left,y+20,8,{color:colors.muted});
  }
  function drawHalf(p,job,dates,rows,y,custom) {
    const x=margin,w=p.w-margin*2,nameW=163,cw=(w-nameW)/dates.length;
    const first=Number(dates[0].slice(-2)),last=Number(dates.at(-1).slice(-2));
    p.text("Du "+first+" au "+last+" "+job.monthOnly,x,y+8,10.5,{bold:true,color:colors.teal}); y+=15;
    p.rect(x,y,w,24,colors.light);p.text("IDE",x+7,y+15,8,{bold:true,color:colors.muted});
    dates.forEach((d,i)=>{
      const wx=x+nameW+i*cw;if(D.weekday(d)>4)p.rect(wx,y,cw,24,colors.weekend);
      p.text(wd[D.weekday(d)],wx+cw/2,y+9,7,{align:"center",color:colors.muted});
      p.text(String(Number(d.slice(-2))),wx+cw/2,y+20,9.5,{bold:true,align:"center"});
    });
    const gridTop=y;y+=24;
    for(const row of rows) {
      dates.forEach((d,i)=>{
        const c=codeAt(job.state,row.n,d),wx=x+nameW+i*cw,weekend=D.weekday(d)>4;
        if(colors[c] || weekend) p.rect(wx,y,cw,row.h,colors[c]||colors.weekBody);
        p.text(c==="X"?"×":c,wx+cw/2,y+row.h/2+3.1,9.3,{bold:c!=="?"&&c!=="R",align:"center",color:c==="?"?colors.muted:colors.ink});
      });
      row.lines.forEach((t,i)=>p.text(t,x+7,y+(row.h-row.lines.length*10.6)/2+8+i*10.6,8.8,{bold:true}));
      y+=row.h;p.line(x,y,x+w,y);
    }
    if(custom.size){
      p.rect(x,y,w,24,colors.light);p.text("TIIH modifié · début 09:00",x+7,y+10,7.8,{bold:true,color:colors.teal});
      p.text("Heure de fin / durée du poste",x+7,y+20,7.1,{color:colors.muted});
      dates.forEach((d,i)=>{const t=custom.get(d);if(!t)return;const center=x+nameW+(i+.5)*cw;
        p.text(t.clock+(t.offset?" +"+t.offset:""),center,y+10,7.7,{bold:true,align:"center"});
        p.text(D.formatMinutes(t.minutes),center,y+20,7,{align:"center",color:colors.muted});
      });y+=24;
    }
    for(let i=0;i<=dates.length;i++){const wx=x+nameW+i*cw;p.line(wx,gridTop,wx,y);}
    p.line(x,gridTop,x, y);p.line(x,gridTop,x+w,gridTop);p.line(x,y,x+w,y);
    return y;
  }
  function teamPages(pdf,job) {
    const pages=[];let p,y,top;
    function next(){p=new Page(pdf,LANDSCAPE);pages.push(p);top=y=header(p,job);}
    next();
    if(!job.roster.length){p.text("Aucune IDE dans l’effectif ce mois-ci.",margin,y+26,12);return pages;}
    const rows=job.roster.flatMap(n=>{
      const lines=wrap(pdf,n.name,148,8.8,true);
      const parts=[];
      for(let i=0;i<lines.length;i+=28) {
        const portion=lines.slice(i,i+28);
        parts.push({n,lines:portion,h:Math.max(18,portion.length*10.6+7)});
      }
      return parts;
    });
    for(const dates of [job.days.slice(0,15),job.days.slice(15)]) {
      const custom=new Map();
      for(const d of dates) {
        if(!D.tiihRequired(job.state,d)&&!job.roster.some(n=>codeAt(job.state,n,d)==="T"))continue;
        const t=tiih(job.state,d);if(t.minutes!==D.SHIFT_MINUTES.T)custom.set(d,t);
      }
      const fixed=39+(custom.size?24:0), bottom=p.h-85;
      if(y>top && y+fixed+rows.reduce((sum,r)=>sum+r.h,0)>bottom) next();
      let i=0;
      while(i<rows.length) {
        if(y+fixed+rows[i].h>bottom && y>top) next();
        const start=i;let h=0;
        while(i<rows.length && (i===start || y+fixed+h+rows[i].h<=bottom)){h+=rows[i].h;i++;}
        y=drawHalf(p,job,dates,rows.slice(start,i),y,custom)+15;
        if(i<rows.length) next();
      }
    }
    return pages;
  }
  function individualPages(pdf,job) {
    const pages=[],rows=job.days.map(day=>({day,code:codeAt(job.state,job.person,day)}));
    const total=rows.reduce((m,r)=>m+(["J","N","T"].includes(r.code)?D.shiftMinutes(job.state,r.day,r.code):0),0);
    job.nameAnnex=wrap(pdf,job.person.name,PORTRAIT[0]-2*margin-2,24,true).length>5;
    let i=0;
    while(i<rows.length){
      const p=new Page(pdf,PORTRAIT);pages.push(p);let y=header(p,job,true);
      const x=margin,right=p.w-margin,cols=[x,x+139,x+236,right-57,right];
      p.text("Postes du mois  "+D.formatMinutes(total),right,y-2,9,{align:"right",bold:true,color:colors.teal});y+=6;
      p.rect(x,y,right-x,22,colors.light);
      ["Date","Poste","Horaires","Durée"].forEach((t,k)=>p.text(t,cols[k]+6,y+14,8.5,{bold:true,color:colors.muted}));
      const top=y;y+=22;
      while(i<rows.length && y+19<=p.h-44){
        const {day,code}=rows[i++],isWeekend=D.weekday(day)>4;
        if(isWeekend)p.rect(x,y,right-x,19,colors.weekBody);
        if(colors[code])p.rect(cols[1],y,cols[2]-cols[1],19,colors[code]);
        p.text(capital(dayFmt.format(utc(day))),x+6,y+12.5,8.9,{bold:isWeekend});
        p.text(labels[code],cols[1]+6,y+12.5,8.9,{bold:["J","N","T"].includes(code)});
        p.text(schedule(job.state,day,code),cols[2]+6,y+12.5,8.8);
        p.text(["J","N","T"].includes(code)?D.formatMinutes(D.shiftMinutes(job.state,day,code)):"—",cols[3]+6,y+12.5,8.7);
        y+=19;p.line(x,y,right,y);
      }
      cols.forEach(xx=>p.line(xx,top,xx,y));p.line(x,top,right,top);
    }
    if(job.nameAnnex) {
      const nameLines=wrap(pdf,job.person.name,PORTRAIT[0]-2*margin-2,12,true);
      let line=0;
      while(line<nameLines.length) {
        const p=new Page(pdf,PORTRAIT);pages.push(p);
        let y=header(p,job,true,true)+12;
        while(line<nameLines.length && y<=p.h-50){p.text(nameLines[line++],margin,y,12,{bold:true});y+=17;}
      }
    }
    return pages;
  }
  function exportMonth({state,year,month,nurseId=null,proposal=false,demo=false}) {
    const days=D.dates(...D.monthBounds(year,month));
    const roster=state.nurses.filter(n=>days.some(d=>D.isActive(n,d)));
    const person=nurseId===null?null:roster.find(n=>n.id===nurseId);
    if(nurseId!==null && !person) throw Error("Cette IDE est hors effectif pendant tout le mois demandé.");
    const monthName=capital(monthFmt.format(utc(days[0])));
    const job={state,days,roster,person,proposal,demo,monthName,
      monthOnly:new Intl.DateTimeFormat("fr-FR",{month:"long",timeZone:"UTC"}).format(utc(days[0])),stamp:stampFmt.format(new Date())};
    const pdf=new PdfFile(), pages=person?individualPages(pdf,job):teamPages(pdf,job);
    pages.forEach((p,i)=>{if(!person)teamLegend(p);footer(p,job,i,pages.length);});
    const who=person?clean(person.name).replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"").slice(0,60)||"ide":"equipe";
    return {blob:pdf.blob(pages),filename:"planning-"+days[0].slice(0,7)+"-"+who+(proposal?"-proposition":"")+(demo?"-essai":"")+".pdf"};
  }
  globalThis.PlannerPDF=Object.freeze({exportMonth});
})();

<script>
(() => {
  "use strict";
  const D = globalThis.PlannerDomain;
  const E = globalThis.PlannerEngine;
  const main = document.getElementById("app");
  const nav = document.getElementById("nav");
  const dialog = document.getElementById("editor");
  const pages = {planning:"Planning", absence:"Absences", tiih:"TIIH", team:"Équipe et règles", annual:"Compteurs", files:"Imports et exports"};
  const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  const clone = value => JSON.parse(JSON.stringify(value));
  const formatters=new Map();
  function dateFmt(day,options) {
    const key=JSON.stringify(options);
    if(!formatters.has(key)) formatters.set(key,new Intl.DateTimeFormat("fr-FR",{timeZone:"UTC",...options}));
    return formatters.get(key).format(new Date(day+"T12:00:00Z"));
  }
  const shortDay = day => dateFmt(day,{day:"numeric",month:"short",year:"numeric"});
  const todayParts = new Intl.DateTimeFormat("fr-FR",{year:"numeric",month:"2-digit",day:"2-digit",timeZone:"Europe/Paris"}).formatToParts(new Date());
  const today = ["year","month","day"].map(k => todayParts.find(x=>x.type===k).value).join("-");
  const baseKey = "planning-ide.hors-ligne.v2";
  let page = "planning", period = today.slice(0,7), week = -1, demo = false;
  let planningMode="team", selectedNurseId=null, editingTiih=null, teamDay=null;
  let proposal = null, includeLookahead = false, absenceId = "", storageAvailable = true, stored = null, broken = false, busy = false, state;
  let cloud=null, formEdited=false;
  const cloudActive=()=>Boolean(cloud && !demo);
  const key = () => baseKey+(demo?".demo":"");
  function notify(message="", failed=false) {
    const el = document.getElementById("feedback");
    el.classList.toggle("error",failed);
    el.textContent = message;
  }
  function loadLocal() {
    let raw = null;
    storageAvailable = true; broken = false;
    try { raw = localStorage.getItem(key()); } catch { storageAvailable = false; }
    stored = raw;
    if(raw !== null) {
      try {state = D.migrateState(JSON.parse(raw)); return;}
      catch { broken = true; notify("La sauvegarde de ce navigateur est illisible. Téléchargez-la ou restaurez un fichier valide dans Imports et exports.",true); }
    }
    state = D.newState(Number(today.slice(0,4)));
  }
  function openSpace() {
    if(!cloudActive()) {
      loadLocal();
      if(!storageAvailable) notify("L’enregistrement automatique est indisponible. Exportez une sauvegarde JSON avant de fermer cette page.",true);
      render();
      return;
    }
    state=null; broken=false; stored=null; storageAvailable=true;
    render(); void cloud.read({force:true});
  }
  function save(candidate,message,{replace=false}={}) {
    D.validateState(candidate);
    if(broken && !replace) throw Error("Restaurez d’abord une sauvegarde valide dans Imports et exports.");
    candidate.revision = Math.max(state.revision || 0,candidate.revision || 0)+1;
    const encoded = JSON.stringify(candidate);
    if(cloudActive()) {
      cloud.enqueue(encoded,message);
      state=candidate; broken=false; proposal=null;
      notify(); render(); return;
    }
    if(storageAvailable) {
      let current;
      try { current = localStorage.getItem(key()); }
      catch { storageAvailable=false; }
      if(storageAvailable && current !== stored) throw Error("Une autre fenêtre a modifié le planning. Rechargez cette page avant de recommencer.");
      if(storageAvailable) {
        try { localStorage.setItem(key(),encoded); stored=encoded; }
        catch { storageAvailable=false; }
      }
    }
    state=candidate; broken=false; proposal=null;
    notify(message+(storageAvailable?"":" L'enregistrement dans le navigateur est indisponible. Exportez une sauvegarde JSON avant de fermer."),!storageAvailable);
    render();
  }
  function infoError(err) {
    if(dialog.open) { const spot=dialog.querySelector('[role=alert]'); if(spot){spot.textContent=err.message || String(err); return;} }
    notify(err.message || String(err),true);
  }
  const btn = (action,label,css="",extra="") => '<button type="button" data-act="'+esc(action)+'" class="'+esc(css)+'" '+extra+'>'+esc(label)+'</button>';
  const submit = label => '<button class="primary" type="submit">'+esc(label)+'</button>';
  const title = (caption,tools="") => '<div class="pagehead"><h1>'+esc(caption)+'</h1><div class="actions">'+tools+'</div></div>';
  const picker = () => '<div class="monthnav">'+btn("prev","‹","","aria-label=\"Mois précédent\"")+'<input type="month" id="period" aria-label="Mois affiché" min="1900-01" max="2199-12" value="'+period+'">'+btn("next","›","","aria-label=\"Mois suivant\"")+'</div>';
  const year = () => Number(period.slice(0,4));
  const month = () => Number(period.slice(5));
  const range = () => D.monthBounds(year(),month());
  const days = () => D.dates(...range());
  const opt = (value,text,on=false) => '<option value="'+esc(value)+'"'+(on?' selected':'')+'>'+esc(text)+'</option>';
  function rosterDuring(s,dates) {
    return s.nurses.filter(n=>dates.some(day=>D.isActive(n,day)));
  }
  const nurseOptions = (roster,id) => roster.map(n=>opt(n.id,n.name,n.id===id)).join("");
  const defaultDay = () => today.startsWith(period)?today:range()[0];
  const nameOf = id => state.nurses.find(n=>n.id===id)?.name ?? "";
  const dataAtt = (name,val) => 'data-'+name+'="'+esc(val)+'"';
  function setPeriod(value) {
    if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(value) || Number(value.slice(0,4))<1900 || Number(value.slice(0,4))>2199) throw Error("Choisissez un mois entre 1900 et 2199.");
    period=value; teamDay=null; week=-1; proposal=null; includeLookahead=false; absenceId=""; notify(); render();
  }
  function switchSpace(toDemo) {
    if(cloudActive() && cloud.pending) throw Error("Terminez l’enregistrement dans Google Sheets ou rechargez la version partagée avant de changer d’équipe.");
    demo=toDemo; page="planning"; teamDay=null; week=-1; proposal=null; includeLookahead=false; absenceId=""; notify(); openSpace();
  }
  function syncStatus() {
    const status=document.getElementById("storage-status"), controls=document.getElementById("cloud-controls");
    controls.innerHTML="";
    main.inert=nav.inert=cloudActive() && cloud.phase==="reloading";
    if(!cloudActive()) {
      status.textContent=demo?"Équipe fictive · Essai local":storageAvailable?"Sur cet appareil":"Sauvegarde JSON requise";
      return;
    }
    const phase=cloud.phase;
    const labels={loading:"Chargement de Google Sheets…",reloading:"Rechargement de Google Sheets…",empty:"Google Sheets · Nouveau planning",
      ready:"Google Sheets · Planning partagé",saving:"Enregistrement dans Google Sheets…",saved:"Enregistré dans Google Sheets",
      "read-error":"Google Sheets · Lecture impossible","refresh-error":"Google Sheets · Actualisation impossible",
      "write-error":"Google Sheets · Brouillon en attente",conflict:"Google Sheets · Conflit d’enregistrement"};
    status.textContent=labels[phase];
    if(phase==="saving") {
      controls.innerHTML='<p class="hint">Enregistrement dans Google Sheets… Gardez cette fenêtre ouverte jusqu’à la confirmation.</p>';
    } else if(phase==="conflict" || phase==="write-error") {
      controls.innerHTML='<aside class="notice sync-error"><div><strong>'+esc(labels[phase])+'</strong><p>'+esc(cloud.error)+' Votre brouillon est disponible dans cette fenêtre.</p></div><div class="actions">'+
        btn("cloud-draft","Exporter mon brouillon JSON")+btn("cloud-retry","Réessayer l’enregistrement")+btn("cloud-reload","Recharger la version partagée")+'</div></aside>';
    } else if(phase==="read-error" || phase==="refresh-error") {
      controls.innerHTML='<aside class="notice sync-error"><p>'+esc(cloud.error)+'</p>'+btn("cloud-read","Réessayer la lecture")+'</aside>';
    }
  }
  function render() {
    formEdited=false;
    syncStatus();
    if(cloudActive() && !state) {
      nav.innerHTML="";
      main.innerHTML='<section class="panel"><h1>Planning partagé</h1><p>'+ (cloud.phase==="read-error"?"La lecture du planning a échoué.":"Ouverture du planning depuis ce classeur…")+'</p></section>';
