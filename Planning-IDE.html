      (savedMonth?btn("clear-month","Effacer le mois…","danger",busy?"disabled":""):"")+
      (undoClear&&!proposal?btn("undo-clear","Annuler l’effacement","",canUndoClear()?"":"disabled"):"")+'</div></div>';
    if(generationFailure) out+=generationFailureView();
    if(!demo && !proposal && !Object.keys(state.assignments).length)
      out+='<aside class="notice"><p><strong>'+(cloudActive() && cloud.phase==="empty"?"Démarrer dans ce classeur":"Démarrer le planning")+'</strong><br>Vous pouvez reprendre les postes d’un ancien planning ou essayer avec des noms fictifs.</p><div class="actions">'+btn("page","Importer un planning","",dataAtt("page","files"))+btn("demo","Essayer avec une équipe fictive")+'</div></aside>';
    if(missing && !proposal) out+='<aside class="notice"><p><strong>'+missing+' quotité'+(missing>1?'s':'')+' à compléter</strong><br>Renseignez les quotités manquantes pour pouvoir générer ce mois.</p>'+btn("page","Configurer l’équipe","",dataAtt("page","team"))+'</aside>';
    if(!missing && !proposal && roster.some(n=>D.isActive(n,start) && D.baseQuotaOn(n,start)!=null && D.baseQuotaOn(n,start)<100))
      out+='<aside class="notice"><p>Des contrats de base sont à temps partiel au '+esc(shortDay(start))+'. Vous pouvez choisir la date de leur passage à 100 %.</p>'+btn("page","Modifier les quotités","",dataAtt("page","team"))+'</aside>';
    if(proposal) {
      const changed=proposal.changedAssignments;
      const diff=changed>0?'<p><strong>'+changed+' case'+(changed>1?'s d’affectation modifiées':' d’affectation modifiée')+'</strong> par rapport '+(proposal.afterPreview?'à la proposition précédente.':'au planning enregistré.')+'</p>':'';
      let impact=proposal.restartNightRotation?'<p>En conservant cette proposition, vous fixerez le premier lundi de la nouvelle trame au '+esc(shortDay(proposal.restartNightRotation))+'. Les gardes antérieures resteront dans l’historique.</p>':"";
      if(proposal.resumeFrom) {
        const checks=D.dates(scopeStart,scopeEnd);
        const smur=value=>checks.reduce((sum,d)=>sum+["J","N"].filter(k=>Object.values(value.assignments[d]||{}).some(a=>a.shift===k)).length,0);
        const beforeGaps=D.workGaps(state,scopeStart,scopeEnd).length,afterGaps=D.workGaps(s,scopeStart,scopeEnd,{assumePlanned:true}).length;
        impact+='<p>'+ (proposal.prioritizeContinuity?"Priorité choisie · réduire les périodes sans garde. ":"Priorité choisie · couvrir les SMUR. ")+
          'SMUR attribués sur les dates demandées · '+smur(state)+' avant, '+smur(s)+' proposés sur '+(2*checks.length)+
          '. Périodes d’au moins sept jours sans garde · '+beforeGaps+' avant, '+afterGaps+' dans la proposition.</p>';
      }
      if(proposal.nightRelief && proposal.nightPattern?.periods?.length) {
        const periods=proposal.nightPattern.periods.map(p=>"du "+shortDay(p.start)+" au "+shortDay(p.end));
        impact+='<p>En conservant cette proposition, vous appliquerez le roulement '+(proposal.nightRelief==="two"?"sans relève":"avec relève")+
          ' '+esc(periods.join(" et "))+'.</p>';
      }
      if(proposal.replanUnlocked) {
        let moved=0,vacated=0;
        for(const day of D.dates(scopeStart,scopeEnd)) {
          const next=s.assignments[day]||{};
          for(const [id,a] of Object.entries(state.assignments[day]||{})) {
            if(!shiftFamily(a.shift)||a.locked||a.confirmed||next[id]?.shift===a.shift) continue;
            if(Object.values(next).some(n=>n.shift===a.shift)) moved++; else vacated++;
          }
        }
        impact+='<p>Si vous conservez cette proposition, '+moved+' garde'+(moved===1?' changera':'s changeront')+' de titulaire et '+vacated+' garde'+(vacated===1?' déjà saisie sera':'s déjà saisies seront')+' à pourvoir. Les cases protégées seront conservées.</p>';
      }
      const summary=partial?"Proposition partielle":proposal.resumeFrom?"Complément du "+shortDay(proposal.resumeFrom)+" au "+shortDay(proposal.resumeUntil):"Proposition à examiner";
      out+='<aside class="proposal'+(partial?' proposal-partial':'')+'"><div><strong>'+esc(summary)+'</strong><p>'+esc(proposal.message)+'</p>'+diff+impact+
        '<small>'+(proposal.end && !proposal.resumeFrom && !partial?'Affectations proposées jusqu’au '+esc(shortDay(proposal.end)):'')+'</small></div><div class="actions">'+
        btn("accept",partial?"Conserver le brouillon":"Conserver la proposition","primary")+btn("discard","Écarter")+'</div></aside>';
    }
    if(partial || attempted || problems.conflicts.length || problems.vacancies.length)
      out+=coverageView(s,scopeStart,scopeEnd,problems,{preview:Boolean(proposal),requested:Boolean(attempted),empty:!proposal&&!attempted&&!savedMonth});
    if(proposal) out+=nightRotationView(proposal.nightPattern,s,scopeStart,scopeEnd);
    else if(attempted) out+=nightRotationView(E.summarizeNights(checkState,scopeStart,scopeEnd),checkState,scopeStart,scopeEnd);
    else if(hasShifts) out+=nightRotationView(E.summarizeNights(s,start,end),s,start,end);
    if(planningMode==="team") out+='<div class="metricgrid">'+["J","N","T"].map(code=>{
      const need=all.filter(d=>code!=="T"||D.tiihRequired(s,d));
      const covered=need.filter(d=>roster.some(n=>D.isActive(n,d) && s.assignments[d]?.[n.id]?.shift===code)).length;
      return '<div class="metric"><span class="swatch '+code+'">'+code+'</span><div><div class="rolelabel">'+D.SHIFT_LABELS[code]+'</div><small>'+({J:"08 h – 20 h",N:"20 h – 08 h",T:"09 h · 7 h 42 par défaut"})[code]+'</small></div><span class="value" title="Postes affectés sur postes requis dans le mois">'+covered+' <small>/ '+need.length+'</small></span></div>';
    }).join("")+'</div>';
    const person=roster.find(n=>n.id===selectedNurseId)??roster[0];
    if(person) selectedNurseId=person.id;
    const individual=planningMode==="individual";
    const gaps=D.workGaps(s,scopeStart,scopeEnd,{assumePlanned:Boolean(proposal)}).filter(g=>!individual||g.nurse_id===person?.id);
    out+=workGapView(gaps,scopeStart,scopeEnd);
    out+=nightHoursView((problems.nightOverruns||[]).filter(entry=>!individual || entry.nurse_id===person?.id));
    out+='<section class="panel"><div class="panelhead"><div><h2>'+(partial?"Planning proposé · brouillon":proposal?"Planning proposé":savedMonth?"Planning enregistré":"Planning à remplir")+'</h2><p class="subtle">'+(proposal?"Consultez les postes avant de conserver la proposition.":"Sélectionnez un poste ou une journée pour modifier l’affectation.")+'</p></div>'+
      '<div class="actions"><div class="weekbar viewbar" role="group" aria-label="Vue du planning">'+btn("planning-mode","Équipe","",dataAtt("mode","team")+' aria-pressed="'+!individual+'"')+btn("planning-mode","Par IDE","",dataAtt("mode","individual")+' aria-pressed="'+individual+'"')+'</div>'+
      btn("export-pdf","Exporter en PDF","",person?'title="'+esc(individual?"Planning de "+person.name:"Planning de toute l’équipe")+'"':"disabled")+'</div></div>';
    if(person) out+=individual?individualAgenda(s,person,all,roster):teamGrid(s,all,roster,problems.vacancies);
    else out+='<div class="notice"><p>Aucune IDE dans l’effectif ce mois-ci.</p>'+btn("page","Gérer les agents","",dataAtt("page","team"))+'</div>';
    const warnings=problems.warnings.filter(i=>!individual||!i.nurse_id||i.nurse_id===person?.id);
    if(warnings.length) out+='<details class="validation"><summary>'+warnings.length+' point'+(warnings.length>1?'s':'')+' de contexte</summary><ul>'+
      warnings.map(i=>'<li>'+esc(i.message)+'</li>').join("")+'</ul></details>';
    out+='</section>';
    if(!individual && proposal?.end>end) {
      const future=D.dates(D.addDays(end,1),proposal.end);
      out+='<details class="panel"><summary>Voir l’anticipation jusqu’au '+esc(shortDay(proposal.end))+'</summary><div class="scroll"><table><thead><tr><th>Date</th><th>SMUR J</th><th>SMUR N</th><th>TIIH</th></tr></thead><tbody>'+future.map(d=>'<tr><th>'+esc(shortDay(d))+'</th>'+["J","N","T"].map(c=>'<td>'+esc(s.nurses.filter(n=>s.assignments[d]?.[n.id]?.shift===c).map(n=>n.name).join(", ")||"—")+'</td>').join("")+'</tr>').join("")+'</tbody></table></div></details>';
    }
    return out+(individual || !roster.length?"":balanceView(s,Boolean(proposal)))+'<div class="bottomaction actions">'+(!demo && Object.keys(state.assignments).length?btn("demo","Essayer avec une équipe fictive"):"")+btn("csv",individual?"Exporter toute l’équipe en CSV":proposal?"Exporter la proposition en CSV":"Exporter le mois en CSV","",roster.length?"":"disabled")+'</div>';
  }
  function durationInput(minutes) {
    return Math.floor(minutes/60)+":"+String(minutes%60).padStart(2,"0");
  }
  function tiihHours(day,minutes) {
    const end=D.tiihWallEnd(day,minutes);
    const start=Date.parse(day+"T00:00:00Z")/60000;
    const dayOffset=Math.floor((end-start)/1440), clock=(end-start)%1440;
    const time=clock===0?"minuit":Math.floor(clock/60)+" h"+(clock%60?" "+String(clock%60).padStart(2,"0"):"");
    return "9 h – "+time+(dayOffset===1?" le lendemain":dayOffset===2?" le surlendemain":"");
  }
  function shiftHours(s,day,code) {
    if(code==="J") return "8 h – 20 h";
    if(code==="N") return "20 h – 8 h le lendemain";
    return code==="T"?tiihHours(day,D.shiftMinutes(s,day,code)):"";
  }
  function teamGrid(s,all,roster,vacancies) {
    const pageCount=Math.ceil(all.length/7);
    week=Math.max(-1,Math.min(pageCount-1,week));
    const full=week===-1, shown=full?all:all.slice(week*7,week*7+7);
    const pager=(i,label)=>btn("week",label,"",dataAtt("week",i)+' aria-pressed="'+(week===i)+'"');
    const pages=[pager(-1,"Mois entier"),...Array.from({length:pageCount},(_,i)=>pager(i,(i*7+1)+"–"+Math.min(all.length,i*7+7)))];
    const headings=shown.map(day=>{
      const label=esc(dateFmt(day,{weekday:full?"narrow":"short"}))+'<span>'+Number(day.slice(-2))+'</span>';
      const attributes=dataAtt("day",day)+' aria-label="'+esc("Modifier la journée du "+shortDay(day))+'"';
      const heading=proposal?label:'<button type="button" class="date-edit" data-act="edit-day" '+attributes+'>'+label+'</button>';
      return '<th scope="col" class="'+(D.weekday(day)>4?"weekend":"")+'">'+heading+'</th>';
    }).join("");
    const rows=roster.map(n=>'<tr><th scope="row">'+esc(n.name)+'</th>'+shown.map(day=>{
      const {code,label,a,unknown}=cellInfo(s,n.id,day);
      const mark=code==="X"?(full?"×":"Hors effectif"):unknown?"?":code==="-"?"—":full?code:code==="A"?"Abs.":D.SHIFT_LABELS[code];
      const classes="cell "+(unknown?"unassigned":code==="-"?"empty":code)+(a?.locked||a?.confirmed?" locked":"");
      const slot=shiftHours(s,day,code);
      const tag=esc(n.name+", "+shortDay(day)+", "+label+(slot?", "+slot:""));
      return '<td class="'+(D.weekday(day)>4?"weekend":"")+'">'+btn("cell",mark,classes,dataAtt("nurse",n.id)+' '+dataAtt("day",day)+' aria-label="'+tag+'" title="'+tag+'"'+(proposal || code==="X"?" disabled":""))+'</td>';
    }).join("")+'</tr>').join("");
    const openByDay=new Map();
    for(const v of vacancies) {
      if(!openByDay.has(v.day)) openByDay.set(v.day,[]);
      openByDay.get(v.day).push(v.shift);
    }
    const openRow=shown.some(day=>openByDay.has(day))?'<tr class="grid-vacancies"><th scope="row">À pourvoir</th>'+
      shown.map(day=>{
        const shifts=openByDay.get(day);
        if(!shifts) return '<td></td>';
        const label=shifts.join(' · '), description=shortDay(day)+' · '+shifts.map(c=>D.SHIFT_LABELS[c]).join(', ')+' à pourvoir';
        const value=proposal?'<span title="'+esc(description)+'">'+esc(label)+'</span>':
          btn("edit-day",label,"",dataAtt("day",day)+' '+dataAtt("role",shifts[0])+' aria-label="'+esc(description)+'"');
        return '<td>'+value+'</td>';
      }).join("")+'</tr>':'';
    const adjusted=shown.filter(day=>D.tiihRequired(s,day) && D.shiftMinutes(s,day,"T")!==D.SHIFT_MINUTES.T);
    const times=adjusted.length?'<p class="tiih-adjusted"><strong>Horaires TIIH modifiés</strong> · '+adjusted.map(day=>esc(shortDay(day))+' ('+tiihHours(day,D.shiftMinutes(s,day,"T"))+')').join(' · ')+'</p>':"";
    return '<div class="weekbar date-range" role="group" aria-label="Jours du mois">'+pages.join("")+'</div><div class="scroll"><table class="grid'+(full?" full-grid":"")+'"><thead><tr><th scope="col">IDE</th>'+headings+'</tr></thead><tbody>'+rows+openRow+'</tbody></table></div><div class="legend"><span><b class="J"></b>J · SMUR jour</span><span><b class="N"></b>N · SMUR nuit</span><span><b class="T"></b>T · TIIH</span><span><b class="A"></b>A · Absence</span><span>— Repos</span><span>? Aucun poste ni repos saisi · disponibilité à vérifier</span><span>× Hors effectif</span><span>• Poste protégé</span></div>'+times;
  }
  function individualAgenda(s,person,all,roster) {
    const count={J:0,N:0,T:0};
    let total=0;
    const list=all.map(day=>{
      const {code,label,a,unknown}=cellInfo(s,person.id,day);
      if(Object.hasOwn(count,code)) {
        count[code]++;
        total+=D.shiftMinutes(s,day,code);
      }
      const slot=shiftHours(s,day,code);
      const tag=esc(person.name+", "+shortDay(day)+", "+label+(slot?", "+slot:""));
      const dayLabel=esc(dateFmt(day,{weekday:"short",day:"numeric",month:"short"}));
      const protection=a?.locked||a?.confirmed;
      return '<li><button type="button" class="agenda-day'+(D.weekday(day)>4?" weekend":"")+'" data-act="cell" '+dataAtt("nurse",person.id)+' '+dataAtt("day",day)+' aria-label="'+tag+'"'+(proposal || code==="X"?' disabled':'')+'><span class="agenda-date">'+dayLabel+'</span><span class="agenda-label '+(unknown?"unassigned":code==="-"?"empty":code)+(protection?" locked":"")+'">'+esc(label)+'</span><span class="agenda-time">'+slot+'</span></button></li>';
    }).join("");
    const csv=btn("csv-individual","Exporter le mois de cette IDE en CSV");
    const [history]=balanceRows(s,[person]);
    return '<div class="person-tools"><label class="field">IDE affichée<select id="individual-nurse">'+nurseOptions(roster,person.id)+'</select></label>'+csv+'</div><div class="person-summary"><strong>'+esc(D.formatMinutes(total))+' de postes</strong><span>'+count.J+' SMUR J</span><span>'+count.N+' SMUR N</span><span>'+count.T+' TIIH</span><span>Cumul des nuits, historique compris · '+(history.pastN+history.N)+'</span></div><ul class="agenda" aria-label="'+esc("Planning mensuel de "+person.name)+'">'+list+'</ul>';
  }
  function showDayEditor(day) {
    const [first,last]=range();
    if(proposal || day<first || day>last) throw Error("Choisissez une date dans le mois du planning enregistré.");
    const row=state.assignments[day]||{}, editor=globalThis.PlannerDayEditor;
    const fields=["J","N","T"].map(role=>{
      const current=editor.owners(row,role), closed=role==="T"&&!D.tiihRequired(state,day);
      if(closed && !current.length) return "";
      const selected=current.length===1?"id:"+current[0]:current.length?"keep":"vacant";
      const keep=current.length>1?opt("keep","Conserver les titulaires actuels ("+current.map(nameOf).join(", ")+")",true):"";
      const nurses=state.nurses.filter(n=>current.includes(n.id) || !closed && D.isActive(n,day));
      const choices=nurses.map(n=>{
        const assigned=current.includes(n.id), fixed=!assigned && editor.protectedCell(row[n.id]);
        const absent=D.absentFor(state,n.id,day,role);
        const label=n.name+(fixed?" · case protégée":absent?" · absence":"");
        return '<option value="'+esc("id:"+n.id)+'"'+(selected==="id:"+n.id?' selected':'')+
          (!assigned && (fixed || absent)?' disabled':'')+'>'+esc(label)+'</option>';
      }).join("");
      const label=D.SHIFT_LABELS[role]+" · "+(closed?"hors calendrier":shiftHours(state,day,role));
      return '<label class="field">'+esc(label)+'<select name="role-'+role+'">'+keep+
        opt("vacant",closed?"Retirer l’affectation":"À pourvoir",selected==="vacant")+choices+'</select></label>';
    }).join("");
    dialog.innerHTML='<form data-form="edit-day" '+dataAtt("day",day)+'><h2 id="dialog-title">Modifier une journée</h2>'+
      '<label class="field">Date du planning<input type="date" id="edit-day-date" required min="'+first+'" max="'+last+'" value="'+day+'"></label>'+
      fields+'<div class="actions">'+["J","N","T"].filter(r=>r!=="T"||D.tiihRequired(state,day)).map(r=>btn("duty-options","IDE possibles · "+D.SHIFT_LABELS[r],"mini",dataAtt("day",day)+' '+dataAtt("role",r))).join("")+'</div><label><input type="checkbox" name="lock-changes"> Verrouiller les cases modifiées pour les prochains calculs</label>'+
      '<div class="day-preview" aria-live="polite"></div><p class="issueerror" role="alert"></p>'+
      '<div class="actions">'+btn("close","Annuler")+submit("Enregistrer cette journée")+'</div></form>';
    if(!dialog.open) dialog.showModal();
    refreshDayEditor(dialog.querySelector("form"));
  }
  function dayEdits(form) {
    const choices={};
    for (const role of ["J","N","T"]) {
      const field=form.elements["role-"+role];
      if(field) choices[role]=field.value;
    }

  function refreshDayEditor(form) {
    const day=form.dataset.day, box=form.querySelector(".day-preview"), alert=form.querySelector('[role=alert]');
    const submitButton=form.querySelector('[type=submit]'), date=form.querySelector("#edit-day-date");

      const {candidate,changes,phaseChanges}=dayEdits(form);
      submitButton.disabled=!changes.length;
      date.disabled=Boolean(changes.length);
      if(!changes.length) return;
      const conflicts=D.validateSchedule(candidate,day,day).filter(i=>i.severity==="error");
      box.innerHTML='<p><strong>'+esc(shortDay(day))+'</strong></p><ul>'+changes.map(c=>'<li>'+esc(c.name)+' · '+
        esc(D.SHIFT_LABELS[c.before])+' → '+esc(D.SHIFT_LABELS[c.after])+'</li>').join("")+'</ul>'+
        phaseChangeNote(phaseChanges)+(conflicts.length?'<details open><summary>'+conflicts.length+' point(s) à corriger dans le brouillon</summary><ul>'+
          conflicts.map(i=>'<li>'+esc(i.message)+'</li>').join("")+'</ul></details>':"");

  }
  function phaseChangeNote(changes) {

      esc(nameOf(c.nurse_id))+' du '+esc(shortDay(c.start))+' au '+esc(shortDay(c.end))).join(" · ")+'.</p>';

      '<div class="fields"><label>Poste<select name="shift">'+["-","J","N","T"].map(c=>opt(c,D.SHIFT_LABELS[c]+(c==="T"?" · "+shiftHours(state,day,c):""),c===(selected||a?.shift||"-"))).join("")+'</select></label></div>'+

      '<p><label><input type="checkbox" name="confirmed" '+(a?.confirmed?"checked":"")+'> Confirmer le poste réalisé</label></p>'+

  function cellEdits(form) {

      {locked:form.elements.locked.checked,confirmed:form.elements.confirmed.checked});

  function rotationSettingsLink() {
    const anchor=state.settings.night_rotation_from;
    return btn("check-rotation-start",anchor?"Vérifier le début du roulement · "+shortDay(anchor):"Vérifier le début du roulement");
  }
  function refreshCellChecks(form) {
    const {day,nurse:id}=form.dataset,shift=form.elements.shift.value;
    const alert=form.querySelector('[role=alert]'),button=form.querySelector('[type=submit]'),preview=form.querySelector('[data-cell-preview]');
    const opts=form.querySelector('[data-cell-options]');
    alert.textContent="";preview.replaceChildren();button.disabled=false;button.textContent="Enregistrer";
    opts.innerHTML=shift!=="-"?btn("duty-options","Voir les IDE possibles pour "+D.SHIFT_LABELS[shift],"mini",dataAtt("day",day)+' '+dataAtt("role",shift)):"";
    try {
      const result=cellEdits(form);
      const {changes,phaseChanges}=result;
      const gap=donorGap(state,result,day);
      const previous=changes.filter(c=>c.id!==id);
      if(changes.length) preview.innerHTML='<ul>'+changes.map(c=>'<li>'+esc(c.name)+' · '+esc(D.SHIFT_LABELS[c.before])+' → '+esc(D.SHIFT_LABELS[c.after])+'</li>').join("")+'</ul>'+phaseChangeNote(phaseChanges);
      if(gap) preview.innerHTML+='<p class="hint">Ce remplacement laisserait '+esc(nameOf(gap.nurse_id))+' sans garde du '+esc(shortDay(gap.start))+' au '+esc(shortDay(gap.end))+'.</p>';
      if(previous.length) button.textContent="Réattribuer "+D.SHIFT_LABELS[shift]+" à "+nameOf(id);
    } catch(error) {
      alert.textContent=error.message;button.disabled=true;
      if(/quinzaine|rôle|roulement|trame/.test(error.message)) opts.innerHTML+=' '+rotationSettingsLink();
      const gap=D.workGaps(state,day,day).find(g=>g.nurse_id===id);

  function donorGap(state,result,day) {
    const donors=result.changes.filter(c=>c.after==="-"&&c.before!=="-").map(c=>c.id);
    if(!donors.length) return null;
    const known=D.workGaps(state,day,day);
    return D.workGaps(result.candidate,day,day).find(g=>donors.includes(g.nurse_id) &&
      !known.some(k=>k.nurse_id===g.nurse_id&&k.start<=g.start&&k.end>=g.end));
  }
  async function showGapOptions(id,from,until) {
    const s=proposal?.candidate||state,offer=proposal,available=[],reasons=new Set();
    const first=shortDay(from),last=shortDay(until);
    dialog.innerHTML='<h2 id="dialog-title">Postes possibles pour '+esc(nameOf(id))+'</h2><p>Du '+esc(first)+' au '+esc(last)+'</p><div data-gap-results role="status">Vérification des postes au planning…</div><div class="actions">'+btn("close","Fermer")+'</div>';

  function addTiihRange(form) {
    const data=new FormData(form), from=data.get("from"), to=data.get("to");
    const weekdays=new Set(data.getAll("weekday").map(Number));
    if(from>to) throw Error("La date de fin doit suivre le début de la période.");

    const found=D.dates(from,to).filter(day=>weekdays.has(D.weekday(day)) && (D.defaultTiih(state,day)||Object.hasOwn(state.tiih_changes,day)));

  function download(name,body,type) {

    document.body.append(a); a.click(); a.remove();

  function csv(name, rows) {
    const quote=value=>{
      let t=String(value??"");
      if(/^[\s]*[=+@-]/.test(t)) t="'"+t;
      return '"'+t.replace(/"/g,'""')+'"';
    };
    download(name,"\uFEFF"+rows.map(row=>row.map(quote).join(";")).join("\r\n"),"text/csv;charset=utf-8");
  }
  let stagedImport=null, historyFiles=null, historyNames=[];
  function showImportDialog(content) {

  function importQuotaField() {
    return '<div class="fields"><label>Passer toute l’équipe à 100 % à compter du <small>(facultatif)</small><input type="date" id="import-effective" min="1900-01-01" max="2199-12-31" aria-describedby="import-effective-hint"></label></div><p id="import-effective-hint" class="hint">Laissez la date vide pour reprendre les contrats tels quels. Si vous indiquez une date, la base des IDE en activité sera fixée à 100 % jusqu’au prochain changement prévu. Les périodes temporaires continuent de s’appliquer. Vous pourrez modifier les quotités dans Équipe et règles.</p>';

  function prepareHistory(files) {
    const names=new Set();
    historyFiles=files.map(file=>{
      let rows;
      try {rows=JSON.parse(file.content.replace(/^\uFEFF/,""));}
      catch {throw Error("JSON illisible dans "+file.name+".");}
      if(!rows || typeof rows!=="object" || Array.isArray(rows)) throw Error("Planning mensuel invalide dans "+file.name+".");
      Object.keys(rows).forEach(n=>names.add(n));
      return {...file,rows};
    });
    historyNames=[...names].sort((a,b)=>a.localeCompare(b,"fr"));
    if(historyNames.every(n=>state.nurses.some(person=>person.name===n))) {
      previewHistory();
      return;
    }
    const mapping=historyNames.map((name,i)=>{
      const existing=state.nurses.find(n=>n.name===name);
      return '<tr><th scope="row">'+esc(name)+'</th><td><select name="map-'+i+'" aria-label="'+esc("Associer "+name)+'">'+
        (existing?"":opt("","Choisir une IDE",true))+state.nurses.map(n=>opt("id:"+n.id,n.name,n.id===existing?.id)).join("")+
        (existing?"":opt("add","Créer « "+name+" »"))+'</select></td></tr>';
    }).join("");
    showImportDialog('<form data-form="history-map"><h2 id="dialog-title">Associer les noms de l’historique</h2><p>Pour chaque nom du fichier, choisissez l’IDE correspondante dans votre équipe ou créez une nouvelle fiche.</p><div class="scroll"><table><thead><tr><th>Nom du fichier</th><th>IDE de l’équipe</th></tr></thead><tbody>'+mapping+'</tbody></table></div><p role="alert" class="issueerror"></p><div class="actions">'+btn("close","Annuler")+submit("Examiner l’import")+'</div></form>');
  }
  function importRuleWarnings(before,after) {
    const days=new Set([...Object.keys(after.assignments),...Object.keys(after.phases)]);
    const groups=[
      ["week-ends complets consécutifs",D.newConsecutiveFullWeekends(before,after,days)],
      ["repos de 48 h après une période de nuit",D.newNightExitRestConflicts(before,after,days)],
      ["roulement de nuit",D.newNightRotationConflicts(before,after,days)]
    ];
    const markup=groups.filter(([,conflicts])=>conflicts.length).map(([label,conflicts])=>
      '<details open><summary>'+conflicts.length+' conflit(s) de '+label+'</summary><div class="scroll" style="max-height:10rem"><ul>'+
      conflicts.map(c=>'<li>'+esc(c.message)+'</li>').join("")+'</ul></div></details>').join("");
    return markup?markup+'<p class="hint">Les affectations de cet historique seront reprises telles quelles.</p>':"";
  }
  function previewHistory(mapping=new Map()) {
    const files=historyFiles.map(file=>{
      const renamed=Object.create(null);
      for(const [original,days] of Object.entries(file.rows)) {
        const name=mapping.get(original)??original;
        if(Object.hasOwn(renamed,name)) throw Error("Deux lignes du fichier "+file.name+" sont associées à "+name+".");
        renamed[name]=days;
      }
      return {name:file.name,content:JSON.stringify(renamed)};
    });
    const result=D.importLegacyFiles(state,files);
    stagedImport=result;
    const warnings=[...historyFiles.flatMap(file=>file.warnings??[]),...result.warnings];
    showImportDialog('<h2 id="dialog-title">Importer cet historique ?</h2><p>'+files.length+' fichier(s) · '+result.state.nurses.length+' IDE dans l’équipe après import.</p>'+importRuleWarnings(state,result.state)+'<ul>'+warnings.map(text=>'<li>'+esc(text)+'</li>').join("")+'</ul>'+importQuotaField()+'<p role="alert" class="issueerror"></p><div class="actions">'+btn("close","Annuler")+btn("restore-data","Importer les plannings","primary")+'</div>');
  }
  async function submitForm(form) {
    if(form.dataset.form==="clear-month") return clearSavedMonth(form);
    if(form.dataset.form==="resume") {
      const [start,end]=range(), from=form.elements.from.value, until=form.elements.until.value||end;
      if(!from || from<start || from>until || until>end) throw Error("Choisissez un intervalle compris dans le mois affiché.");
      dialog.close();
      return generateProposal(from,until,form.elements.mode.value==="replan",form.elements.night_relief.disabled?null:form.elements.night_relief.value||null,
        form.elements.restart_rotation.checked?E.nightRotationRestart(state,from,until)?.date:null,form.elements.prioritize_continuity.checked);
    }
    if(form.dataset.form==="edit-day") {
      const {candidate,changes}=dayEdits(form);
      if(changes.length) save(candidate,"Journée du "+shortDay(form.dataset.day)+" enregistrée.");
      dialog.close(); return;
    }
    if(form.dataset.form==="tiih-range") {addTiihRange(form); return;}
    if(form.dataset.form==="tiih-batch") {reviewTiihForm(form); return;}
    if(form.dataset.form==="team-management") {
      await globalThis.PlannerTeamManagement.submit(form,{state,save,dialog,render}); return;
    }
    const f=new FormData(form), get=k=>String(f.get(k)??"");
    const candidate=clone(state);
    switch(form.dataset.form) {
      case "cell": {
        const change=cellEdits(form);
        save(change.candidate,"Modification du planning enregistrée."); dialog.close(); break;
      }
      case "team": {
        const effective=get("effective");
        candidate.nurses.forEach((n,i)=>{
          if(!D.isActive(n,effective)) return;
          const name=get("name-"+i).trim(), raw=get("quota-"+i);
          if(!name) throw Error("Chaque IDE doit avoir un nom.");
          const quota=raw===""?null:Number(raw);
          n.name=name;
          if(quota!==D.baseQuotaOn(n,effective)) D.setContract(n,effective,quota);
        });
        if(new Set(candidate.nurses.map(n=>n.name)).size!==candidate.nurses.length) throw Error("Choisissez un nom distinct pour chaque IDE.");
        save(candidate,"Équipe enregistrée."); break;
      }
      case "rules": {
        const text=get("oat").trim();
        if(text) candidate.oat[String(year())]=D.parseDuration(text); else delete candidate.oat[String(year())];
        Object.assign(candidate.settings,{rest_clock:get("rest"),phase_min:Number(get("phase_min")),phase_target:Number(get("phase_target")),phase_max:Number(get("phase_max")),extra_holidays:[...new Set(get("holidays").split(/[,;\s]+/).filter(Boolean))]});
        const anchor=get("night_rotation_from");
        if(anchor) {
          if(D.weekday(anchor)!==0) throw Error("Le premier jour du roulement de nuit doit être un lundi.");
          if(anchor!==state.settings.night_rotation_from && hasMonthShifts(state,Object.keys(state.assignments)) && !form.elements.confirm_anchor.checked)
            throw Error("Confirmez ce premier lundi pour appliquer le roulement à partir de cette date.");
          if(anchor!==state.settings.night_rotation_from) D.setNightRotationStart(candidate,anchor);
        }
        const selectedMode=get("night_relief");
        if(selectedMode!==D.nightRotationMode(candidate)) D.setNightRotationMode(candidate,selectedMode);
        save(candidate,"Règles enregistrées."); break;
      }
      case "absence": {
        const day=get("from"), end=get("to"), slot=get("mode")==="slot", credit=D.parseDuration(get("credit"));
        if(day>end) throw Error("La fin doit suivre le début de l’absence.");
        const nurse=candidate.nurses.find(n=>n.id===get("nurse"));
        if(!nurse || !D.isActive(nurse,day) || !D.isActive(nurse,slot && get("finish")==="00:00"?D.addDays(end,-1):end))
          throw Error("Les dates de l’absence doivent être comprises dans la période d’activité de cette IDE.");
        const fields={nurse_id:get("nurse"),kind:get("kind"),start:slot?day+"T"+get("begin"):day,end:slot?end+"T"+get("finish"):D.addDays(end,1)};
        if(slot) fields.credits={[day]:credit}; else fields.daily_minutes=credit;
        if(absenceId) fields.id=absenceId;
        D.setAbsence(candidate,fields); save(candidate,"Absence enregistrée."); absenceId=""; render(); break;
      }
      case "tiih": {
        const op=get("operation"), source=get("source");
        if(op==="duration" || op==="normal") {
          const day=D.tiihDay(candidate,source);
          if(!day) throw Error("Restaurez le TIIH de cette date avant d’en modifier la durée.");
          const minutes=op==="normal"?D.SHIFT_MINUTES.T:D.parseDuration(get("duration"));
          D.setTiihDuration(candidate,day,minutes);
        } else {
          if(op==="move" && !get("target")) throw Error("Choisissez la nouvelle date.");
          D.changeTiih(candidate,source,op==="move"?get("target"):null,op==="restore");
        }
        editingTiih=source;
        save(candidate,"TIIH du "+shortDay(source)+" mis à jour."); break;
      }
      case "phase": {
        const day=get("anchor"), id=get("nurse"), mode=get("mode");
        const nurse=candidate.nurses.find(n=>n.id===id);
        if(!nurse || !D.isActive(nurse,day)) throw Error("Choisissez une IDE dans l’effectif à la date de la période.");
        if(mode) {
          if(!candidate.phases[day]) candidate.phases[day]={};
          candidate.phases[day][id]={mode,age:Number(get("age")),locked:true};
        } else if(candidate.phases[day]) {
          delete candidate.phases[day][id];
          if(!Object.keys(candidate.phases[day]).length) delete candidate.phases[day];
        }
        globalThis.PlannerDayEditor.checkScheduleChange(state,candidate,day);
        save(candidate,"Régime enregistré."); break;
      }
      case "legacy": {
        const files=f.getAll("months");
        if(!files.length || files.reduce((n,file)=>n+file.size,0)>20*1024*1024) throw Error("Sélectionnez des plannings mensuels de moins de 20 Mo au total.");
        const data=await Promise.all(files.map(async file=>{
          const value={name:file.name,content:await file.text()};
          return /\.csv$/i.test(file.name)?globalThis.PlannerCSV.toLegacyFile(value):value;
        }));
        prepareHistory(data);
        break;
      }
      case "history-map": {
        const mapping=new Map();
        historyNames.forEach((name,i)=>{
          const id=get("map-"+i);
          if(!id) throw Error("Choisissez une IDE pour "+name+".");
          mapping.set(name,id==="add"?name:nameOf(id.slice(3)));
        });
        previewHistory(mapping); break;
      }
      case "import": {
        historyFiles=null;
        const file=f.get("backup");
        if(!file?.size||file.size>20*1024*1024) throw Error("Choisissez un fichier JSON de moins de 20 Mo.");
        const value=D.migrateState(JSON.parse((await file.text()).replace(/^\uFEFF/,"")));
        stagedImport={state:value,placeholderContractIds:[]};
        dialog.innerHTML='<h2 id="dialog-title">Restaurer cette sauvegarde ?</h2><p>'+value.nurses.length+' IDE · '+Object.keys(value.assignments).length+' dates · '+value.absences.length+' absences</p><p>Cette sauvegarde remplacera les données de '+(demo?"l’équipe fictive":cloudActive()?"ce classeur Google Sheets partagé":"votre équipe")+'.</p>'+importRuleWarnings(null,value)+importQuotaField()+'<p class="issueerror" role="alert"></p><div class="actions">'+btn("close","Annuler")+btn("restore-data","Remplacer les données","primary")+'</div>';
        dialog.showModal(); break;
      }
    }
  }
  async function generateProposal(resumeFrom=null,resumeUntil=null,replanUnlocked=false,nightRelief=null,restartNightRotation=null,prioritizeContinuity=false) {
    if(busy) return;
    const original=state, oldProposal=proposal, target=period, forecast=includeLookahead;
    const all=resumeFrom?D.dates(resumeFrom,resumeUntil):days();
    const missing=state.nurses.flatMap(n=>{
      const date=all.find(d=>D.isActive(n,d) && D.quotaOn(n,d)==null);
      return date?[n.name+" le "+shortDay(date)]:[];
    });
    if(missing.length) {
      generationFailure={resumeFrom,resumeUntil,replanUnlocked,nightRelief,restartNightRotation,prioritizeContinuity,quota:true,message:"Quotité manquante pour "+missing.join(", ")+". Renseignez les quotités aux dates indiquées dans Équipe et règles."};
      notify();render();return;
    }
    busy=true; render();
    notify("Recherche en cours…");
    try {
      await new Promise(resolve=>setTimeout(resolve,40));
      if(state!==original || period!==target || proposal!==oldProposal) return;
      const options={timeLimitMs:resumeFrom?3500:2500,includeLookahead:!resumeFrom && forecast};
      if(nightRelief) options.nightRelief=nightRelief;
      if(restartNightRotation) options.restartNightRotation=restartNightRotation;
      if(prioritizeContinuity) options.prioritizeContinuity=true;
      if(resumeFrom) {
        options.resumeFrom=resumeFrom;
        options.resumeUntil=resumeUntil;
        if(replanUnlocked) options.replanUnlocked=true;
      } else {
        options.differentFrom=[];
        if(oldProposal) options.differentFrom.push(oldProposal.candidate);
        if(hasMonthShifts(original,all)) options.differentFrom.push(original);
      }
      const result=E.generate(original,year(),month(),options);
      if(result.candidate) {
        proposal={...result,resumeFrom,resumeUntil,replanUnlocked,nightRelief,restartNightRotation,prioritizeContinuity,afterPreview:Boolean(oldProposal)}; generationFailure=null; week=-1;
        notify();
      } else {
        const noAddition=result.added===0 && Boolean(result.start && result.end) && ["unknown","infeasible"].includes(result.status);
        if(noAddition) proposal=null;
        const known=!noAddition && !resumeFrom && !result.conflictDate && D.validateSchedule(original,...range(),false).find(i=>i.severity==="error" && i.day && i.nurse_id);
        generationFailure={resumeFrom,resumeUntil,replanUnlocked,nightRelief,restartNightRotation,prioritizeContinuity,noAddition,start:result.start,end:result.end,message:result.message,status:result.status,conflictDate:result.conflictDate,conflictCode:result.conflictCode,
          detail:known && !result.conflictDate?"Point à vérifier dans le planning enregistré. "+known.message:""};
        notify();
      }
    } catch(error) {
      generationFailure={resumeFrom,resumeUntil,replanUnlocked,nightRelief,restartNightRotation,prioritizeContinuity,message:error.message || String(error)};notify();
    } finally {busy=false; render();}
  }
  async function act(button) {
    const action=button.dataset.act;
    if(busy) return;
    if(action==="team-manage") {
      await globalThis.PlannerTeamManagement.action(button,{state,save,dialog,render}); return;
    }
    if(action==="generate") return generateProposal();
    switch(action) {
      case "resume": showResume();break;
      case "try-two": showResume({from:button.dataset.from,until:button.dataset.until});break;
      case "clear-month": showClearMonth();break;
      case "month-checks": showMonthChecks();break;
      case "night-rules": page="team";render();document.getElementById("night-rules").focus();break;
      case "undo-clear": await undoMonthClear();break;
      case "conflict-month": moveToConflictMonth(button.dataset.month);break;
      case "confirm-conflict-month": dialog.close();setPeriod(button.dataset.month);break;
      case "cloud-read": {
        if(cloudActive()) await cloud.read({force:!state});
        break;
      }
      case "cloud-draft": {
        if(cloudActive() && state) download("planning-ide-brouillon-"+today+".json",JSON.stringify(state,null,2),"application/json");
        break;
      }
      case "cloud-retry": if(cloudActive()) await cloud.retry(); break;
      case "cloud-reload": {
        if(!cloudActive()) break;
        dialog.innerHTML='<h2 id="dialog-title">Recharger la version partagée ?</h2><p>La version du classeur remplacera le brouillon affiché. Vous pouvez en télécharger une copie avant de continuer.</p><p class="issueerror" role="alert"></p><div class="actions">'+btn("close","Annuler")+btn("cloud-draft","Exporter mon brouillon JSON")+btn("cloud-discard","Abandonner le brouillon et recharger","primary")+'</div>';
        dialog.showModal(); break;
      }
      case "cloud-discard": {
        if(!cloudActive()) break;
        dialog.close(); await cloud.read({force:true,discard:true}); break;
      }
      case "page": page=button.dataset.page; notify(); render(); break;
      case "prev": setPeriod(D.addDays(range()[0],-1).slice(0,7)); break;
      case "next": setPeriod(D.addDays(range()[1],1).slice(0,7)); break;
      case "planning-mode": planningMode=button.dataset.mode; render(); break;
      case "week": week=Number(button.dataset.week); render(); break;
      case "all-full": {
        const form=button.closest("form");
        form.querySelectorAll('input[name^="quota-"]').forEach(input=>{input.value="100";});
        notify("Les quotités de base sont prêtes. Enregistrez l’équipe pour appliquer la date d’effet choisie.");
        break;
      }
      case "demo": switchSpace(true); break;
      case "exit-demo": switchSpace(false); break;
      case "accept":
        if(proposal) {
          const scope=proposal.status==="partial"?"Brouillon enregistré. Vérifiez les postes à pourvoir et les conflits dans le planning.":
            proposal.resumeFrom?"Complément du "+shortDay(proposal.resumeFrom)+" au "+shortDay(proposal.resumeUntil)+" enregistré.":
            proposal.end>range()[1]?"Planning et anticipation enregistrés.":"Planning du mois enregistré.";
          save(clone(proposal.candidate),scope); includeLookahead=false; render();
        }
        break;
      case "discard": proposal=null; generationFailure=null; notify("Proposition écartée."); render(); break;
      case "gap-options": await showGapOptions(button.dataset.nurse,button.dataset.from,button.dataset.until);break;
      case "duty-options": showDutyOptions(button.dataset.day,button.dataset.role);break;
      case "prepare-duty": showEditor(button.dataset.id,button.dataset.day,button.dataset.role);break;
      case "check-rotation-start":
        dialog.close();page="team";render();main.querySelector('[name=night_rotation_from]')?.focus();break;
      case "cell": showEditor(button.dataset.nurse,button.dataset.day); break;
      case "edit-day":
        showDayEditor(button.dataset.day||defaultDay());
        if(button.dataset.role) dialog.querySelector('[name="role-'+button.dataset.role+'"]')?.focus();
        break;
      case "export-pdf": {
        button.disabled=true;
        try {
          const result=await globalThis.PlannerPDF.exportMonth({state:proposal?.candidate||state,year:year(),month:month(),
            nurseId:planningMode==="individual"?selectedNurseId:null,proposal:Boolean(proposal),demo});
          if(cloud) showPdfLinks(result.blob,result.filename);
          else download(result.filename,result.blob,"application/pdf");
        } finally {button.disabled=false;}
        break;
      }
      case "close": dialog.close(); stagedImport=null; break;
      case "edit-tiih": {
        tiihMode="single"; editingTiih=button.dataset.source; render();
        main.querySelector("#tiih-op").focus();
        break;
      }
      case "tiih-mode": tiihMode=button.dataset.mode; syncTiihBatch(); break;
      case "tiih-select-month":
        main.querySelectorAll("[data-pick-tiih]").forEach(input=>tiihSelected.add(input.dataset.pickTiih));
        tiihMode="batch"; syncTiihBatch(); break;
      case "tiih-clear": tiihSelected.clear(); syncTiihBatch(); break;
      case "tiih-apply-batch": commitTiihBatch(); break;
      case "edit-absence": absenceId=button.dataset.id; render(); break;
      case "cancel-absence": absenceId=""; render(); break;
      case "delete-absence": {
        const id=button.dataset.id, a=state.absences.find(x=>x.id===id);
        if(!a) return;
        dialog.innerHTML='<h2 id="dialog-title">Supprimer cette absence ?</h2><p>'+esc(nameOf(a.nurse_id))+' · '+esc(a.kind)+' · '+esc(shortDay(a.start.slice(0,10)))+'</p><p class="issueerror" role="alert"></p><div class="actions">'+btn("close","Annuler")+btn("confirm-delete","Supprimer","danger",dataAtt("id",id))+'</div>';
        dialog.showModal(); break;
      }
      case "confirm-delete": {
        const candidate=clone(state); candidate.absences=candidate.absences.filter(a=>a.id!==button.dataset.id);
        absenceId=""; save(candidate,"Absence supprimée."); dialog.close(); break;
      }
      case "export": download("planning-ide"+(demo?"-fictif":"")+"-"+today+".json",JSON.stringify(state,null,2),"application/json"); break;
      case "raw": download("planning-ide-a-recuperer.json",stored,"application/json"); break;
      case "restore-data": {
        if(!stagedImport) throw Error("Choisissez une sauvegarde.");
        const input=dialog.querySelector("#import-effective");
        if(!input.reportValidity()) break;
        const restored=clone(stagedImport.state), effective=input.value;
        if(effective) {
          const placeholders=new Set(stagedImport.placeholderContractIds);
          for(const nurse of restored.nurses) {
            if(!D.isActive(nurse,effective)) continue;
            // These new identities have only the default contract of the template slot.
            if(placeholders.has(nurse.id)) nurse.contracts=[];
            D.setContract(nurse,effective,100);
          }
        }
        let message=historyFiles?"Historique importé. Consultez la répartition des postes dans Planning.":"Sauvegarde restaurée.";
        if(effective) message+=" Quotités à 100 % au "+shortDay(effective)+".";
        save(restored,message,{replace:true}); stagedImport=null; dialog.close(); break;
      }
      case "csv":
      case "csv-individual": {
        const value=proposal?.candidate||state, all=days();
        const one=action==="csv-individual";
        const roster=rosterDuring(value,all), nurses=one?roster.filter(n=>n.id===selectedNurseId):roster;
        if(!nurses.length) throw Error("Aucune IDE dans l’effectif sur ce mois.");
        const suffix=one?"-"+nurses[0].name.replace(/[^\p{L}\p{N}]+/gu,"-").slice(0,60):"";
        csv("planning-"+period+suffix+".csv",[["IDE",...all],...nurses.map(n=>[n.name,...all.map(d=>{
          const {code,label}=cellInfo(value,n.id,d);
          return globalThis.PlannerCSV.shiftLabel(value,d,code,label);
        })])]);
        break;
      }
      case "export-balance": {
        const rows=balanceRows(proposal?.candidate||state);
        csv("repartition-"+period+".csv",[
          ["IDE","SMUR J antérieurs","SMUR N antérieurs","SMUR J du mois","SMUR N du mois","TIIH du mois","Cumul SMUR J","Cumul SMUR N","Jours isolés du mois","Nuits isolées du mois"],
          ...rows.map(r=>[r.name,r.pastJ,r.pastN,r.J,r.N,r.T,r.pastJ+r.J,r.pastN+r.N,r.aloneJ,r.aloneN])
        ]);
        break;
      }
      case "export-year": {
        const rows=annualRows();
        csv("compteurs-"+year()+".csv",[["IDE","Confirmé (min)","Planifié (min)","Absences (min)","Total (min)","Cible (min)","Reste (min)","Conflits"],...rows.map(r=>[r.name,r.confirmed_minutes,r.planned_minutes,r.absence_minutes,r.total_minutes,r.target_minutes,r.remaining_minutes,r.conflicts])]); break;
      }
    }
  }
  dialog.addEventListener("close",()=>{stagedImport=null;historyFiles=null;historyNames=[];tiihReview=null;});
  document.addEventListener("click",e=>{const b=e.target.closest("button[data-act]"); if(b) act(b).catch(infoError);});
  document.addEventListener("submit",e=>{if(e.target.dataset.form){e.preventDefault();submitForm(e.target).catch(infoError);}});
  document.addEventListener("input",e=>{
    const t=e.target;
    if(t.form && !dialog.contains(t)) formEdited=true;
    if(t.name==="night_rotation_from" && t.form?.dataset.form==="rules") {
      const confirm=t.form.elements.confirm_anchor;
      const changed=Boolean(t.value && t.value!==state.settings.night_rotation_from && hasMonthShifts(state,Object.keys(state.assignments)));
      confirm.checked=false; confirm.required=changed;
      t.form.querySelector("[data-confirm-anchor]").hidden=!changed;
    }
    if(t.form?.dataset.form==="resume" && ["from","until"].includes(t.name)) {
      if(t.name==="from") t.form.dataset.customFrom="1";
      updateResumeSummary(t.form);
    }
    if(t.name==="duration" && t.form?.dataset.form==="tiih") syncTiih(t.form);
    if(t.form?.dataset.form==="tiih-batch" && ["duration","offset"].includes(t.name)) tiihBatchValues[t.name]=t.value;
  });
  document.addEventListener("change",e=>{
    try {
      const t=e.target;
      if(t.form?.dataset.form==="resume" && ["night_relief","restart_rotation"].includes(t.name)) updateResumeSummary(t.form);
      if(t.form?.dataset.form==="rules" && t.name==="night_relief") updateReliefRules(t.form);
      if(t.form?.dataset.form==="resume" && t.name==="mode") {
        if(!t.form.dataset.customFrom) t.form.elements.from.value=t.value==="replan"?t.form.dataset.replanFrom:t.form.dataset.keepFrom;
        updateResumeSummary(t.form);
      }
      if(t.form?.dataset.form==="clear-month") syncClearPreview(t.form);
      if(t.form?.dataset.form==="cell" && ["shift","locked","confirmed"].includes(t.name)) refreshCellChecks(t.form);
      if(t.form && !dialog.contains(t)) formEdited=true;
      if(t.form?.dataset.form==="absence" && ["from","nurse"].includes(t.name)) {
        const form=t.form;
        const edited=state.absences.find(a=>a.id===absenceId);
        const keep=edited && form.elements.nurse.value===edited.nurse_id?edited.nurse_id:null;
        syncDatedNurses(form,form.elements.from.value,keep);
      }
      if(t.form?.dataset.form==="phase" && ["anchor","nurse"].includes(t.name)) syncPhase();
      if(t.form?.dataset.form==="phase" && t.name==="mode") syncPhaseAge(t.form);
      if(t.id==="include-lookahead") includeLookahead=t.checked;
      if(t.id==="edit-day-date" && t.value && t.validity.valid) showDayEditor(t.value);
      else if(t.form?.dataset.form==="edit-day" && t.id!=="edit-day-date") refreshDayEditor(t.form);
      if(t.id==="period"&&t.value) setPeriod(t.value);
      if(t.id==="individual-nurse") {selectedNurseId=t.value; render();}
      if(t.id==="effective"&&t.value) {
        teamDay=t.value;
        t.form.querySelector("tbody").innerHTML=teamRows(teamDay);
        main.querySelector("#team-management").innerHTML=globalThis.PlannerTeamManagement.view(state,{day:teamDay});
      }
      if(t.id==="tiih-op"||t.id==="tiih-source") syncTiih(t.form,t.id==="tiih-source");
      if(t.hasAttribute("data-pick-tiih")) {
        if(t.checked) tiihSelected.add(t.dataset.pickTiih); else tiihSelected.delete(t.dataset.pickTiih);
        tiihMode="batch"; syncTiihBatch();
      }
      if(t.form?.dataset.form==="tiih-batch" && t.name==="operation") {
        tiihBatchValues.operation=t.value; syncTiihBatch();
      }
      if(t.id==="absence-mode") {
        const slot=t.value==="slot"; document.getElementById("times").style.display=slot?"":"none";
        document.getElementById("credit-label").textContent=slot?"Crédit total du créneau":"Crédit par jour du lundi au vendredi";
        t.form.elements.credit.value=slot?"2:00":"7:42";
      }
    } catch(err) {infoError(err);}
  });
  window.addEventListener("storage",e=>{if(!cloudActive() && (e.key===key() || e.key===null)) {
    undoClear=null;updateUndoControl();notify("Une autre fenêtre a modifié les données. Rechargez cette page avant d’enregistrer.",true);
  }});
  const bridge=globalThis.google?.script?.run;
  if(bridge) {
    cloud=globalThis.PlannerSheetsSync.connect(bridge,{
      active:()=>!demo,
      canRefresh:()=>!demo && !dialog.open && !proposal && !busy && !formEdited,
      prepare:body=>body===null?D.newState(Number(today.slice(0,4))):D.migrateState(JSON.parse(body)),
      receive:value=>{
        if(checkingClear && checkingClear.state===state && checkingClear.revision===cloud.revision && JSON.stringify(state)===JSON.stringify(value)) return;
        if(undoClear) {
          if(undoClear.serverRevision===cloud.revision && undoClear.body===JSON.stringify(value)) undoClear.after=value;
          else undoClear=null;
        }
        state=value;proposal=null;generationFailure=null;absenceId="";notify();render();
      },
      changed:()=>{if(!state && cloud.phase==="read-error") render(); else syncStatus();},
      saved:(message,warning)=>{
        if(undoClear && undoClear.after===state && undoClear.google) {undoClear.serverRevision=cloud.revision;updateUndoControl();}
        if(!demo) notify(message+" Enregistré dans Google Sheets."+(warning?" "+warning:""));
      }
    });
    const refresh=()=>{if(cloudActive() && state && !document.hidden) void cloud.read();};
    window.addEventListener("focus",refresh);
    document.addEventListener("visibilitychange",refresh);
    window.addEventListener("beforeunload",e=>{
      if(cloudActive() && cloud.pending) {e.preventDefault();e.returnValue="";}
    });
  }
  openSpace();
})();

</script>
