  function cellInfo(s,id,day) {
    const nurse=s.nurses.find(n=>n.id===id);
    if(!nurse || !D.isActive(nurse,day)) return {code:"X",label:"Hors effectif",a:null,unknown:false};
    const a=s.assignments[day]?.[id];
    const shift=a?.shift||"-";
    const code=shift==="-" && D.absenceOn(s,id,day)?"A":shift;
    const unknown=code==="-" && !a && !s.reviewed[day]?.includes(id);
    const label=unknown?"Non renseigné":code==="A"?"Absence":D.SHIFT_LABELS[shift];
    return {code,label,a,unknown};
  }
  const shiftFamily = code => code==="J" || code==="T" ? "J" : code==="N" ? "N" : null;
  function balanceRows(s) {
    const [start,end]=range();
    const rows=new Map(rosterDuring(s,days()).map(n=>[n.id,{name:n.name,pastJ:0,pastN:0,J:0,N:0,T:0,aloneJ:0,aloneN:0}]));
    const idsWithAbsences=new Set(s.absences.map(a=>a.nurse_id));
    const conflicts=(id,day,code)=>idsWithAbsences.has(id) && D.absentFor(s,id,day,code);
    for(const [day,assignments] of Object.entries(s.assignments)) {
      if(day>end) continue;
      for(const [id,{shift}] of Object.entries(assignments)) {
        const family=shiftFamily(shift);
        if(!rows.has(id) || !family || conflicts(id,day,shift)) continue;
        const row=rows.get(id);
        if(day<start) {
          if(shift==="J" || shift==="N") row["past"+shift]++;
        } else {
          row[shift]++;
          const hasNeighbour=[-1,1].some(offset=>{
            const neighbour=D.addDays(day,offset), shift=s.assignments[neighbour]?.[id]?.shift;
            return shiftFamily(shift)===family && !conflicts(id,neighbour,shift);
          });
          if(!hasNeighbour) row["alone"+family]++;
        }
      }
    }
    return [...rows.values()];
  }
  function balanceView(s,preview) {
    const rows=balanceRows(s);

    const earlier=Object.entries(s.assignments).filter(([day,a])=>day<start && Object.values(a).some(record=>shiftFamily(record.shift))).map(([day])=>day).sort();
    const history=earlier.length?"Historique disponible depuis le "+shortDay(earlier[0])+".":"Aucun poste antérieur à ce mois dans l’historique.";
    const counts=rows.map(r=>[r.pastJ,r.pastN,r.J,r.N,r.T,r.pastJ+r.J,r.pastN+r.N,r.aloneJ,r.aloneN]);
    const bands=[["Avant ce mois",2],[preview?"Mois proposé":"Mois affiché",3],["Cumul SMUR",2],["Isolés du mois",2]];
    return '<section class="panel balance"><div class="panelhead"><div><h2>Répartition des postes par IDE</h2><p class="subtle">'+esc(history)+'</p></div>'+btn("export-balance","Exporter la répartition en CSV")+'</div><div class="scroll"><table><thead><tr><th rowspan="2" scope="col">IDE</th>'+
      bands.map(([l,n])=>'<th scope="colgroup" colspan="'+n+'">'+l+'</th>').join("")+'</tr><tr>'+
      ["SMUR J","SMUR N","SMUR J","SMUR N","TIIH","Jour","Nuit","Jour","Nuit"].map(l=>'<th scope="col">'+l+'</th>').join("")+
      '</tr></thead><tbody>'+rows.map((r,i)=>'<tr><th scope="row">'+esc(r.name)+'</th>'+counts[i].map(v=>'<td>'+v+'</td>').join("")+'</tr>').join("")+'</tbody></table></div><p class="hint">Le cumul additionne les postes SMUR de l’historique et du mois, hors chevauchements avec une absence. Un poste est isolé si aucun poste du même régime ne figure la veille ou le lendemain. Le TIIH compte comme une journée pour ce calcul.</p></section>';

  function durationInput(minutes) {

  function tiihHours(day,minutes) {
    const end=D.tiihWallEnd(day,minutes);
    const start=Date.parse(day+"T00:00:00Z")/60000;
    const dayOffset=Math.floor((end-start)/1440), clock=(end-start)%1440;
    const time=clock===0?"minuit":Math.floor(clock/60)+" h"+(clock%60?" "+String(clock%60).padStart(2,"0"):"");
    return "9 h – "+time+(dayOffset===1?" le lendemain":dayOffset===2?" le surlendemain":"");
  }
  function shiftHours(s,day,code) {
    if(code==="J") return "8 h – 20 h";

  function absenceView() {
    const old=state.absences.find(a=>a.id===absenceId);
    const timed=old && (!old.start.slice(11).startsWith("00:00") || !old.end.slice(11).startsWith("00:00"));
    const first=old?.start.slice(0,10) || (today.startsWith(period)?today:range()[0]);
    const last=old?(timed?old.end.slice(0,10):D.addDays(old.end.slice(0,10),-1)):first;
    const credits=old?Object.values(old.credits):[];

  function addTiihRange(form) {
    const data=new FormData(form), from=data.get("from"), to=data.get("to");
    const weekdays=new Set(data.getAll("weekday").map(Number));
    if(from>to) throw Error("La date de fin doit suivre le début de la période.");
    if(!weekdays.size) throw Error("Cochez au moins un jour d’origine.");
    const found=D.dates(from,to).filter(day=>weekdays.has(D.weekday(day)) && (D.defaultTiih(state,day)||Object.hasOwn(state.tiih_changes,day)));
    if(!found.length) throw Error("Aucun TIIH sur les jours sélectionnés dans cette période.");
    found.forEach(day=>tiihSelected.add(day)); syncTiihBatch();
    notify("Sélection mise à jour.");
  }
  function showTiihReview(request,result,updated=false) {

    tiihReview={request,signature:JSON.stringify(result.changes)};
    const when=(day,m)=>day?esc(shortDay(day))+'<small>'+esc(tiihHours(day,m))+' · '+esc(D.formatMinutes(m))+'</small>':"Supprimé";
    const rows=result.changes.map(c=>'<tr><th scope="row">'+esc(shortDay(c.source))+'</th><td>'+when(c.from,c.oldMinutes)+'</td><td>'+when(c.to,c.newMinutes)+'</td><td>'+
      esc(c.released.map(nameOf).join(", ")||(c.changed?"—":"Déjà appliqué"))+'</td></tr>').join("");
    dialog.innerHTML='<div class="tiih-preview"><h2 id="dialog-title">Examiner les changements TIIH</h2><p><strong>'+esc(tiihOperations[request.operation])+'</strong> · '+changed.length+' poste(s) à modifier sur '+result.changes.length+' sélectionné(s).'+
      (released?' '+released+' affectation(s) à réattribuer.':'')+'</p>'+(updated?'<p>Le planning a changé. Vérifiez ce nouvel aperçu avant de confirmer.</p>':'')+
      '<div class="scroll"><table><thead><tr><th>Origine</th><th>Avant</th><th>Après</th><th>Affectations libérées</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      result.warnings.map(w=>'<p class="hint">'+esc(w)+'</p>').join("")+
      '<p class="issueerror" role="alert"></p><div class="actions">'+btn("close","Annuler")+btn("tiih-apply-batch","Appliquer les changements","primary",changed.length?"":"disabled")+'</div></div>';
    if(!dialog.open) dialog.showModal();

  function reviewTiihForm(form) {
    const operation=form.elements.operation.value, options={};
    if(operation==="duration") options.minutes=D.parseDuration(form.elements.duration.value);
    if(operation==="move") options.shiftDays=Number(form.elements.offset.value);
    const request={sources:[...tiihSelected].sort(),operation,options};
    showTiihReview(request,D.previewTiihBatch(state,request.sources,operation,options));
  }
  function commitTiihBatch() {
    if(!tiihReview) return;
    const {request,signature}=tiihReview;
    const result=D.previewTiihBatch(state,request.sources,request.operation,request.options);
    if(signature!==JSON.stringify(result.changes)) {showTiihReview(request,result,true); return;}
    const count=result.changes.filter(c=>c.changed).length;
    save(result.state,count+" poste(s) TIIH mis à jour.");
    tiihReview=null; dialog.close();
  }

  function syncTiih(form,sourceChanged=false) {

      form.elements.operation.value=actual?"duration":"restore";

    form.querySelector("#duration-row").hidden=!editDuration;
    form.querySelector("#target-row").hidden=!moving;
    form.elements.duration.disabled=!editDuration;
    form.elements.target.disabled=!moving;
    form.elements.duration.required=editDuration;
    form.elements.target.required=moving;
    const help=form.querySelector("#tiih-help");
    if(editDuration) {
      const value=form.elements.duration.value;
      let text="Saisissez une durée de 0:01 à 48:00.";

  }
  function legacyView() {
    return '<section class="panel"><h2>Ajouter un historique mensuel</h2><p>Choisissez les fichiers <strong>planning_AAAA_MM.json</strong> de l’ancienne application ou les <strong>CSV mensuels exportés par Planning IDE</strong>. Les postes s’ajoutent à l’historique utilisé pour équilibrer les prochains mois.</p><p class="hint">Le CSV reprend les postes affectés, les durées des TIIH affectés et les repos. Une sauvegarde JSON complète contient aussi les absences détaillées, les crédits, les contrats et les protections.</p><form data-form="legacy"><div class="fields"><label>Fichiers mensuels JSON ou CSV<input type="file" required multiple name="months" accept=".json,.csv,application/json,text/csv"></label></div>'+submit("Examiner les anciens plannings")+'</form></section>';
  }
  function download(name,body,type) {
    const url=URL.createObjectURL(new Blob([body],{type}));
    const a=document.createElement("a"); a.href=url; a.download=name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }
  function csv(name, rows) {
    const quote=value=>{
      let t=String(value??"");
      if(/^[\s]*[=+@-]/.test(t)) t="'"+t;
      return '"'+t.replace(/"/g,'""')+'"';
    };
    download(name,"\uFEFF"+rows.map(row=>row.map(quote).join(";")).join("\r\n"),"text/csv;charset=utf-8");
  }
  let stagedImport=null, historyFiles=null, historyNames=[];
  function showImportDialog(content) {
    dialog.innerHTML=content;
    if(!dialog.open) dialog.showModal();
  }
  function importQuotaField() {
    return '<div class="fields"><label>Passer toute l’équipe à 100 % à compter du <small>(facultatif)</small><input type="date" id="import-effective" min="1900-01-01" max="2199-12-31" aria-describedby="import-effective-hint"></label></div><p id="import-effective-hint" class="hint">Laissez la date vide pour reprendre les contrats tels quels. Si vous indiquez une date, la base des IDE en activité sera fixée à 100 % jusqu’au prochain changement prévu. Les périodes temporaires continuent de s’appliquer. Vous pourrez modifier les quotités dans Équipe et règles.</p>';
  }
  function prepareHistory(files) {
    const names=new Set();
    historyFiles=files.map(file=>{
      let rows;
      try {rows=JSON.parse(file.content.replace(/^\uFEFF/,""));}
      catch {throw Error("JSON illisible dans "+file.name+".");}
      if(!rows || typeof rows!=="object" || Array.isArray(rows)) throw Error("Planning mensuel invalide dans "+file.name+".");
      Object.keys(rows).forEach(n=>names.add(n));
      return {...file,rows};
    });
    historyNames=[...names].sort((a,b)=>a.localeCompare(b,"fr"));
    if(historyNames.every(n=>state.nurses.some(person=>person.name===n))) {
      previewHistory();
      return;
    }
    const mapping=historyNames.map((name,i)=>{
      const existing=state.nurses.find(n=>n.name===name);
      return '<tr><th scope="row">'+esc(name)+'</th><td><select name="map-'+i+'" aria-label="'+esc("Associer "+name)+'">'+
        (existing?"":opt("","Choisir une IDE",true))+state.nurses.map(n=>opt("id:"+n.id,n.name,n.id===existing?.id)).join("")+
        (existing?"":opt("add","Créer « "+name+" »"))+'</select></td></tr>';
    }).join("");
    showImportDialog('<form data-form="history-map"><h2 id="dialog-title">Associer les noms de l’historique</h2><p>Pour chaque nom du fichier, choisissez l’IDE correspondante dans votre équipe ou créez une nouvelle fiche.</p><div class="scroll"><table><thead><tr><th>Nom du fichier</th><th>IDE de l’équipe</th></tr></thead><tbody>'+mapping+'</tbody></table></div><p role="alert" class="issueerror"></p><div class="actions">'+btn("close","Annuler")+submit("Examiner l’import")+'</div></form>');
  }
  function previewHistory(mapping=new Map()) {
    const files=historyFiles.map(file=>{
      const renamed=Object.create(null);
      for(const [original,days] of Object.entries(file.rows)) {
        const name=mapping.get(original)??original;
        if(Object.hasOwn(renamed,name)) throw Error("Deux lignes du fichier "+file.name+" sont associées à "+name+".");
        renamed[name]=days;
      }
      return {name:file.name,content:JSON.stringify(renamed)};
    });
    const result=D.importLegacyFiles(state,files);
    stagedImport=result;
    const warnings=[...historyFiles.flatMap(file=>file.warnings??[]),...result.warnings];
    showImportDialog('<h2 id="dialog-title">Importer cet historique ?</h2><p>'+files.length+' fichier(s) · '+result.state.nurses.length+' IDE dans l’équipe après import.</p><ul>'+warnings.map(text=>'<li>'+esc(text)+'</li>').join("")+'</ul>'+importQuotaField()+'<p role="alert" class="issueerror"></p><div class="actions">'+btn("close","Annuler")+btn("restore-data","Importer les plannings","primary")+'</div>');
  }
  async function submitForm(form) {
    if(form.dataset.form==="edit-day") {
      const {candidate,changes}=dayEdits(form);
      if(changes.length) save(candidate,"Journée du "+shortDay(form.dataset.day)+" enregistrée.");
      dialog.close(); return;
    }
    if(form.dataset.form==="tiih-range") {addTiihRange(form); return;}
    if(form.dataset.form==="tiih-batch") {reviewTiihForm(form); return;}
    if(form.dataset.form==="team-management") {
      await globalThis.PlannerTeamManagement.submit(form,{state,save,dialog,render}); return;
    }
    const f=new FormData(form), get=k=>String(f.get(k)??"");
    const candidate=clone(state);
    switch(form.dataset.form) {
      case "cell": {
        const {nurse:id,day}=form.dataset;
        if(!candidate.nurses.some(n=>n.id===id && D.isActive(n,day))) throw Error("Cette IDE est hors effectif à cette date.");
        const prev=candidate.assignments[day]?.[id];
        const shift=get("shift"), confirmed=f.has("confirmed"), locked=f.has("locked");
        if((prev?.confirmed||prev?.locked)&&prev.shift!==shift) throw Error("Retirez la protection et enregistrez avant de modifier ce poste.");
        if(confirmed&&(shift==="-"||D.shiftInterval(day,shift,"elapsed",candidate)[1]>Date.now()/60000)) throw Error("Seul un poste terminé peut être confirmé.");
        if(!candidate.assignments[day]) candidate.assignments[day]={};
        candidate.assignments[day][id]={shift,locked,confirmed};
        candidate.reviewed[day]=[...new Set([...(candidate.reviewed[day]||[]),id])];
        save(candidate,"Modification du brouillon enregistrée."); dialog.close(); break;
      }
      case "team": {
        const effective=get("effective");
        candidate.nurses.forEach((n,i)=>{
          if(!D.isActive(n,effective)) return;
          const name=get("name-"+i).trim(), raw=get("quota-"+i);
          if(!name) throw Error("Chaque IDE doit avoir un nom.");
          const quota=raw===""?null:Number(raw);
          n.name=name;
          if(quota!==D.baseQuotaOn(n,effective)) D.setContract(n,effective,quota);
        });
        if(new Set(candidate.nurses.map(n=>n.name)).size!==candidate.nurses.length) throw Error("Choisissez un nom distinct pour chaque IDE.");
        save(candidate,"Équipe enregistrée."); break;
      }
      case "rules": {
        const text=get("oat").trim();
        if(text) candidate.oat[String(year())]=D.parseDuration(text); else delete candidate.oat[String(year())];
        Object.assign(candidate.settings,{rest_clock:get("rest"),phase_min:Number(get("phase_min")),phase_target:Number(get("phase_target")),phase_max:Number(get("phase_max")),extra_holidays:[...new Set(get("holidays").split(/[,;\s]+/).filter(Boolean))]});
        save(candidate,"Règles enregistrées."); break;
      }
      case "absence": {
        const day=get("from"), end=get("to"), slot=get("mode")==="slot", credit=D.parseDuration(get("credit"));
        if(day>end) throw Error("La fin doit suivre le début de l’absence.");
        const nurse=candidate.nurses.find(n=>n.id===get("nurse"));
        if(!nurse || !D.isActive(nurse,day) || !D.isActive(nurse,slot && get("finish")==="00:00"?D.addDays(end,-1):end))
          throw Error("Les dates de l’absence doivent être comprises dans la période d’activité de cette IDE.");
        const fields={nurse_id:get("nurse"),kind:get("kind"),start:slot?day+"T"+get("begin"):day,end:slot?end+"T"+get("finish"):D.addDays(end,1)};
        if(slot) fields.credits={[day]:credit}; else fields.daily_minutes=credit;
        if(absenceId) fields.id=absenceId;
        D.setAbsence(candidate,fields); save(candidate,"Absence enregistrée."); absenceId=""; render(); break;
      }
      case "tiih": {
        const op=get("operation"), source=get("source");
        if(op==="duration" || op==="normal") {
          const day=D.tiihDay(candidate,source);
          if(!day) throw Error("Restaurez le TIIH de cette date avant d’en modifier la durée.");
          const minutes=op==="normal"?D.SHIFT_MINUTES.T:D.parseDuration(get("duration"));
          D.setTiihDuration(candidate,day,minutes);
        } else {
          if(op==="move" && !get("target")) throw Error("Choisissez la nouvelle date.");
          D.changeTiih(candidate,source,op==="move"?get("target"):null,op==="restore");
        }
        editingTiih=source;
        save(candidate,"TIIH du "+shortDay(source)+" mis à jour."); break;
      }
      case "phase": {
        const day=get("anchor"), id=get("nurse"), mode=get("mode");
        const nurse=candidate.nurses.find(n=>n.id===id);
        if(!nurse || !D.isActive(nurse,day)) throw Error("Choisissez une IDE dans l’effectif à la date de la période.");
        if(mode) {
          if(!candidate.phases[day]) candidate.phases[day]={};
          candidate.phases[day][id]={mode,age:Number(get("age")),locked:true};
        } else if(candidate.phases[day]) {
          delete candidate.phases[day][id];
          if(!Object.keys(candidate.phases[day]).length) delete candidate.phases[day];
        }
        save(candidate,"Régime enregistré."); break;
      }
      case "legacy": {
        const files=f.getAll("months");
        if(!files.length || files.reduce((n,file)=>n+file.size,0)>20*1024*1024) throw Error("Sélectionnez des plannings mensuels de moins de 20 Mo au total.");
        const data=await Promise.all(files.map(async file=>{
          const value={name:file.name,content:await file.text()};
          return /\.csv$/i.test(file.name)?globalThis.PlannerCSV.toLegacyFile(value):value;
        }));
        prepareHistory(data);
        break;
      }
      case "history-map": {
        const mapping=new Map();
        historyNames.forEach((name,i)=>{
          const id=get("map-"+i);
          if(!id) throw Error("Choisissez une IDE pour "+name+".");
          mapping.set(name,id==="add"?name:nameOf(id.slice(3)));
        });
        previewHistory(mapping); break;
      }
      case "import": {
        historyFiles=null;
        const file=f.get("backup");
        if(!file?.size||file.size>20*1024*1024) throw Error("Choisissez un fichier JSON de moins de 20 Mo.");
        const value=D.migrateState(JSON.parse((await file.text()).replace(/^\uFEFF/,"")));
        stagedImport={state:value,placeholderContractIds:[]};
        dialog.innerHTML='<h2 id="dialog-title">Restaurer cette sauvegarde ?</h2><p>'+value.nurses.length+' IDE · '+Object.keys(value.assignments).length+' dates · '+value.absences.length+' absences</p><p>Cette sauvegarde remplacera les données de '+(demo?"l’équipe fictive":cloudActive()?"ce classeur Google Sheets partagé":"votre équipe")+'.</p>'+importQuotaField()+'<p class="issueerror" role="alert"></p><div class="actions">'+btn("close","Annuler")+btn("restore-data","Remplacer les données","primary")+'</div>';
        dialog.showModal(); break;
      }
    }
  }
  async function act(button) {
    const action=button.dataset.act;
    if(busy) return;
    if(action==="team-manage") {
      await globalThis.PlannerTeamManagement.action(button,{state,save,dialog,render}); return;
    }
    if(action==="generate") {
      busy=true; button.disabled=true; button.textContent="Recherche en cours…";
      try {
        await new Promise(resolve=>setTimeout(resolve,40));
        const result=E.generate(state,year(),month(),{timeLimitMs:2500,includeLookahead});
        if(result.candidate) {proposal=result; week=-1; notify();} else notify(result.message,true);
      } finally {busy=false; render();}
      return;
    }
    switch(action) {
      case "cloud-read": {
        if(cloudActive()) await cloud.read({force:!state});
        break;
      }
      case "cloud-draft": {
        if(cloudActive() && state) download("planning-ide-brouillon-"+today+".json",JSON.stringify(state,null,2),"application/json");
        break;
      }
      case "cloud-retry": if(cloudActive()) await cloud.retry(); break;
      case "cloud-reload": {
        if(!cloudActive()) break;
        dialog.innerHTML='<h2 id="dialog-title">Recharger la version partagée ?</h2><p>La version du classeur remplacera le brouillon affiché. Vous pouvez en télécharger une copie avant de continuer.</p><p class="issueerror" role="alert"></p><div class="actions">'+btn("close","Annuler")+btn("cloud-draft","Exporter mon brouillon JSON")+btn("cloud-discard","Abandonner le brouillon et recharger","primary")+'</div>';
        dialog.showModal(); break;
      }
      case "cloud-discard": {
        if(!cloudActive()) break;
        dialog.close(); await cloud.read({force:true,discard:true}); break;
      }
      case "page": page=button.dataset.page; notify(); render(); break;
      case "prev": setPeriod(D.addDays(range()[0],-1).slice(0,7)); break;
      case "next": setPeriod(D.addDays(range()[1],1).slice(0,7)); break;
      case "planning-mode": planningMode=button.dataset.mode; render(); break;
      case "week": week=Number(button.dataset.week); render(); break;
      case "all-full": {
        const form=button.closest("form");
        form.querySelectorAll('input[name^="quota-"]').forEach(input=>{input.value="100";});
        notify("Les quotités de base sont prêtes. Enregistrez l’équipe pour appliquer la date d’effet choisie.");
        break;
      }
      case "demo": switchSpace(true); break;
      case "exit-demo": switchSpace(false); break;
      case "accept":
        if(proposal) {
          const scope=proposal.end>range()[1]?"Planning et anticipation enregistrés.":"Planning du mois enregistré.";
          save(clone(proposal.candidate),scope); includeLookahead=false; render();
        }
        break;
      case "discard": proposal=null; notify("Proposition écartée."); render(); break;
      case "cell": showEditor(button.dataset.nurse,button.dataset.day); break;
      case "edit-day": showDayEditor(button.dataset.day||defaultDay()); break;
      case "export-pdf": {
        button.disabled=true;
        try {
          const result=await globalThis.PlannerPDF.exportMonth({state:proposal?.candidate||state,year:year(),month:month(),
            nurseId:planningMode==="individual"?selectedNurseId:null,proposal:Boolean(proposal),demo});
          download(result.filename,result.blob,"application/pdf");
        } finally {button.disabled=false;}
        break;
      }
      case "close": dialog.close(); stagedImport=null; break;
      case "edit-tiih": {
        tiihMode="single"; editingTiih=button.dataset.source; render();
        main.querySelector("#tiih-op").focus();
        break;
      }
      case "tiih-mode": tiihMode=button.dataset.mode; syncTiihBatch(); break;
      case "tiih-select-month":
        main.querySelectorAll("[data-pick-tiih]").forEach(input=>tiihSelected.add(input.dataset.pickTiih));
        tiihMode="batch"; syncTiihBatch(); break;
      case "tiih-clear": tiihSelected.clear(); syncTiihBatch(); break;
      case "tiih-apply-batch": commitTiihBatch(); break;
      case "edit-absence": absenceId=button.dataset.id; render(); break;
      case "cancel-absence": absenceId=""; render(); break;
      case "delete-absence": {
        const id=button.dataset.id, a=state.absences.find(x=>x.id===id);
        if(!a) return;
        dialog.innerHTML='<h2 id="dialog-title">Supprimer cette absence ?</h2><p>'+esc(nameOf(a.nurse_id))+' · '+esc(a.kind)+' · '+esc(shortDay(a.start.slice(0,10)))+'</p><p class="issueerror" role="alert"></p><div class="actions">'+btn("close","Annuler")+btn("confirm-delete","Supprimer","danger",dataAtt("id",id))+'</div>';
        dialog.showModal(); break;
      }
      case "confirm-delete": {
        const candidate=clone(state); candidate.absences=candidate.absences.filter(a=>a.id!==button.dataset.id);
        absenceId=""; save(candidate,"Absence supprimée."); dialog.close(); break;
      }
      case "export": download("planning-ide"+(demo?"-fictif":"")+"-"+today+".json",JSON.stringify(state,null,2),"application/json"); break;
      case "raw": download("planning-ide-a-recuperer.json",stored,"application/json"); break;
      case "restore-data": {
        if(!stagedImport) throw Error("Choisissez une sauvegarde.");
        const input=dialog.querySelector("#import-effective");
        if(!input.reportValidity()) break;
        const restored=clone(stagedImport.state), effective=input.value;
        if(effective) {
          const placeholders=new Set(stagedImport.placeholderContractIds);
          for(const nurse of restored.nurses) {
            if(!D.isActive(nurse,effective)) continue;
            // These new identities have only the default contract of the template slot.
            if(placeholders.has(nurse.id)) nurse.contracts=[];
            D.setContract(nurse,effective,100);
          }
        }
        let message=historyFiles?"Historique importé. Consultez la répartition des postes dans Planning.":"Sauvegarde restaurée.";
        if(effective) message+=" Quotités à 100 % au "+shortDay(effective)+".";
        save(restored,message,{replace:true}); stagedImport=null; dialog.close(); break;
      }
      case "csv":
      case "csv-individual": {
        const value=proposal?.candidate||state, all=days();
        const one=action==="csv-individual";
        const roster=rosterDuring(value,all), nurses=one?roster.filter(n=>n.id===selectedNurseId):roster;
        if(!nurses.length) throw Error("Aucune IDE dans l’effectif sur ce mois.");
        const suffix=one?"-"+nurses[0].name.replace(/[^\p{L}\p{N}]+/gu,"-").slice(0,60):"";
        csv("planning-"+period+suffix+".csv",[["IDE",...all],...nurses.map(n=>[n.name,...all.map(d=>{
          const {code,label}=cellInfo(value,n.id,d);
          return globalThis.PlannerCSV.shiftLabel(value,d,code,label);
        })])]);
        break;
      }
      case "export-balance": {
        const rows=balanceRows(proposal?.candidate||state);
        csv("repartition-"+period+".csv",[
          ["IDE","SMUR J antérieurs","SMUR N antérieurs","SMUR J du mois","SMUR N du mois","TIIH du mois","Cumul SMUR J","Cumul SMUR N","Jours isolés du mois","Nuits isolées du mois"],
          ...rows.map(r=>[r.name,r.pastJ,r.pastN,r.J,r.N,r.T,r.pastJ+r.J,r.pastN+r.N,r.aloneJ,r.aloneN])
        ]);
        break;
      }
      case "export-year": {
        const rows=annualRows();
        csv("compteurs-"+year()+".csv",[["IDE","Confirmé (min)","Planifié (min)","Absences (min)","Total (min)","Cible (min)","Reste (min)","Conflits"],...rows.map(r=>[r.name,r.confirmed_minutes,r.planned_minutes,r.absence_minutes,r.total_minutes,r.target_minutes,r.remaining_minutes,r.conflicts])]); break;
      }
    }
  }
  dialog.addEventListener("close",()=>{stagedImport=null;historyFiles=null;historyNames=[];tiihReview=null;});
  document.addEventListener("click",e=>{const b=e.target.closest("button[data-act]"); if(b) act(b).catch(infoError);});
  document.addEventListener("submit",e=>{if(e.target.dataset.form){e.preventDefault();submitForm(e.target).catch(infoError);}});
  document.addEventListener("input",e=>{
    const t=e.target;
    if(t.form && !dialog.contains(t)) formEdited=true;
    if(t.name==="duration" && t.form?.dataset.form==="tiih") syncTiih(t.form);
    if(t.form?.dataset.form==="tiih-batch" && ["duration","offset"].includes(t.name)) tiihBatchValues[t.name]=t.value;
  });
  document.addEventListener("change",e=>{
    try {
      const t=e.target;
      if(t.form && !dialog.contains(t)) formEdited=true;
      if(t.form?.dataset.form==="absence" && ["from","nurse"].includes(t.name)) {
        const form=t.form;
        const edited=state.absences.find(a=>a.id===absenceId);
        const keep=edited && form.elements.nurse.value===edited.nurse_id?edited.nurse_id:null;
        syncDatedNurses(form,form.elements.from.value,keep);
      }
      if(t.form?.dataset.form==="phase" && ["anchor","nurse"].includes(t.name)) syncPhase();
      if(t.id==="include-lookahead") includeLookahead=t.checked;
      if(t.id==="edit-day-date" && t.value && t.validity.valid) showDayEditor(t.value);
      else if(t.form?.dataset.form==="edit-day" && t.id!=="edit-day-date") refreshDayEditor(t.form);
      if(t.id==="period"&&t.value) setPeriod(t.value);
      if(t.id==="individual-nurse") {selectedNurseId=t.value; render();}
      if(t.id==="effective"&&t.value) {
        teamDay=t.value;
        t.form.querySelector("tbody").innerHTML=teamRows(teamDay);
        main.querySelector("#team-management").innerHTML=globalThis.PlannerTeamManagement.view(state,{day:teamDay});
      }
      if(t.id==="tiih-op"||t.id==="tiih-source") syncTiih(t.form,t.id==="tiih-source");
      if(t.hasAttribute("data-pick-tiih")) {
        if(t.checked) tiihSelected.add(t.dataset.pickTiih); else tiihSelected.delete(t.dataset.pickTiih);
        tiihMode="batch"; syncTiihBatch();
      }
      if(t.form?.dataset.form==="tiih-batch" && t.name==="operation") {
        tiihBatchValues.operation=t.value; syncTiihBatch();
      }
      if(t.id==="absence-mode") {
        const slot=t.value==="slot"; document.getElementById("times").style.display=slot?"":"none";
        document.getElementById("credit-label").textContent=slot?"Crédit total du créneau":"Crédit par jour du lundi au vendredi";
        t.form.elements.credit.value=slot?"2:00":"7:42";
      }
    } catch(err) {infoError(err);}
  });
  window.addEventListener("storage",e=>{if(!cloudActive() && (e.key===key() || e.key===null)) notify("Une autre fenêtre a modifié les données. Rechargez cette page avant d’enregistrer.",true);});
  const bridge=globalThis.google?.script?.run;
  if(bridge) {
    cloud=globalThis.PlannerSheetsSync.connect(bridge,{
      active:()=>!demo,
      canRefresh:()=>!demo && !dialog.open && !proposal && !busy && !formEdited,
      prepare:body=>body===null?D.newState(Number(today.slice(0,4))):D.migrateState(JSON.parse(body)),
      receive:value=>{state=value;proposal=null;absenceId="";notify();render();},
      changed:()=>{if(!state && cloud.phase==="read-error") render(); else syncStatus();},
      saved:(message,warning)=>{if(!demo) notify(message+" Enregistré dans Google Sheets."+(warning?" "+warning:""));}
    });
    const refresh=()=>{if(cloudActive() && state && !document.hidden) void cloud.read();};
    window.addEventListener("focus",refresh);
    document.addEventListener("visibilitychange",refresh);
    window.addEventListener("beforeunload",e=>{
      if(cloudActive() && cloud.pending) {e.preventDefault();e.returnValue="";}
    });
  }
  openSpace();
})();

</script>
</body></html>
